<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Breakout</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none;touch-action:none}
h1{font-size:1.25rem;font-weight:800;margin-bottom:6px}
.sc{font-weight:700;margin-bottom:10px;color:#a5b4fc}
canvas{border-radius:12px;box-shadow:0 0 0 2px #1e293b,0 20px 50px rgba(0,0,0,.45);max-width:96vw}
.hint{margin-top:10px;color:#64748b;font-size:.75rem}
</style></head><body>
<h1>Breakout</h1>
<div class="sc">Score: <span id="sc">0</span> · Lives: <span id="lv">3</span></div>
<canvas id="c" width="480" height="560"></canvas>
<p class="hint">Mys / touch = padlo · klik = start</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const W=480,H=560;
const COLORS=["#f43f5e","#f97316","#eab308","#22c55e","#3b82f6","#a855f7"];
let paddle,ball,bricks,score=0,run=false,lives=3,particles=[];
function build(){
  bricks=[];
  for(var r=0;r<6;r++)for(var c=0;c<10;c++)
    bricks.push({x:10+c*46.5,y:50+r*24,w:42,h:18,c:COLORS[r],on:true,hit:0});
}
function reset(){
  paddle={x:W/2-45,w:90,h:12,y:H-32};
  ball={x:W/2,y:H-50,vx:4.2,vy:-5.2,r:7};
  score=0;lives=3;build();run=false;particles=[];
  document.getElementById("sc").textContent="0";
  document.getElementById("lv").textContent="3";
}
function burst(x,y,col){
  for(var i=0;i<8;i++)particles.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,c:col});
}
function loop(){
  if(run){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));}
    if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);
    if(ball.y>H){
      lives--;document.getElementById("lv").textContent=lives;
      if(lives<=0)run=false;
      else{ball={x:W/2,y:H-50,vx:4.2,vy:-5.2,r:7};run=false;}
    }
    if(ball.y+ball.r>paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
      ball.vy=-Math.abs(ball.vy);
      ball.vx=(ball.x-(paddle.x+paddle.w/2))*0.16;
      ball.y=paddle.y-ball.r;
    }
    bricks.forEach(function(b){
      if(!b.on)return;
      if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
        b.on=false;ball.vy*=-1;score+=10;document.getElementById("sc").textContent=score;
        burst(b.x+b.w/2,b.y+b.h/2,b.c);
      }
    });
    if(bricks.every(function(b){return !b.on;})){build();ball.vx*=1.05;ball.vy*=1.05;}
  }
  particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=0.04;return p.life>0;});
  // draw
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#0f172a");grd.addColorStop(1,"#020617");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  bricks.forEach(function(b){
    if(!b.on)return;
    ctx.fillStyle=b.c;
    roundRect(ctx,b.x,b.y,b.w,b.h,4);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.25)";ctx.fillRect(b.x+3,b.y+2,b.w-6,4);
  });
  particles.forEach(function(p){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  });
  ctx.fillStyle="#e2e8f0";
  roundRect(ctx,paddle.x,paddle.y,paddle.w,paddle.h,5);ctx.fill();
  ctx.shadowColor="#fbbf24";ctx.shadowBlur=10;
  ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  if(!run){
    ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 20px system-ui";ctx.textAlign="center";
    ctx.fillText(lives<=0?"Game Over · klikni":"Klikni pro start",W/2,H/2);
  }
  requestAnimationFrame(loop);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
canvas.addEventListener("pointermove",function(e){
  var r=canvas.getBoundingClientRect();
  paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*(W/r.width)-paddle.w/2));
});
canvas.addEventListener("pointerdown",function(){if(!run){if(lives<=0)reset();run=true;}});
reset();requestAnimationFrame(loop);
</script></body></html>
