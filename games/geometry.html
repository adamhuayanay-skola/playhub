<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Geometry Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0618;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none;touch-action:none}
h1{font-size:1.2rem;font-weight:800;margin-bottom:.35rem;background:linear-gradient(90deg,#ff2d95,#7c5cfc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hud{display:flex;gap:1.2rem;color:#c4b5fd;margin-bottom:.4rem;font-size:.85rem}
.hud strong{color:#f5d0fe}
.wrap{position:relative;line-height:0}
canvas{display:block;border-radius:14px;box-shadow:0 0 0 2px rgba(255,45,149,.3),0 25px 60px rgba(0,0,0,.55);max-width:96vw;background:#12061f}
.overlay{position:absolute;inset:0;background:rgba(13,6,24,.94);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;border-radius:14px;padding:1rem;overflow-y:auto}
.overlay h2{font-size:1.3rem;font-weight:800}
.overlay p{color:#a78bfa;font-size:.85rem;text-align:center}
.levels{display:flex;flex-direction:column;gap:.55rem;width:min(300px,90%);margin:.4rem 0}
.lvl{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;border:none;border-radius:12px;background:linear-gradient(135deg,rgba(255,45,149,.2),rgba(124,92,252,.25));color:#fff;cursor:pointer;text-align:left;transition:transform .15s}
.lvl:hover{transform:scale(1.03)}
.lvl .ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0}
.lvl .name{font-weight:700;font-size:.95rem}
.lvl .diff{font-size:.72rem;opacity:.7}
.back-btn{margin-top:.3rem;padding:.5rem 1.4rem;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:transparent;color:#c4b5fd;cursor:pointer;font-size:.85rem}
.hint{margin-top:.5rem;font-size:.72rem;color:#64748b}
</style>
</head>
<body>
<h1>GEOMETRY DASH</h1>
<div class="hud"><span>Level: <strong id="lvName">—</strong></span><span>Progress: <strong id="prog">0%</strong></span></div>
<div class="wrap">
<canvas id="c" width="560" height="320"></canvas>
<div class="overlay" id="ov">
  <h2>Vyber level</h2>
  <p>Klik / mezernik = skok · drz pro auto-jump</p>
  <div class="levels" id="levelList"></div>
</div>
</div>
<p class="hint">Stereo Madness a dalsi · skoky jsou plynule</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const ov=document.getElementById("ov");
const lvName=document.getElementById("lvName"),progEl=document.getElementById("prog");
const params=new URLSearchParams(location.search);
const diffMod={easy:0.85,mid:1,hard:1.2}[params.get("diff")||"mid"]||1;
const W=560,H=320,GROUND=270,CUBE=28,GRAVITY=0.85,JUMP=-11.2;
const LEVELS=[
{id:"stereo",name:"Stereo Madness",color:"#22c55e",ico:"1",diff:"Easy",speed:4.2,pattern:[{t:"empty",g:180},{t:"spike",g:90},{t:"spike",g:70},{t:"empty",g:100},{t:"block",g:80,h:28},{t:"spike",g:60},{t:"empty",g:90},{t:"spike",g:55},{t:"spike",g:55},{t:"spike",g:70},{t:"block",g:100,h:40},{t:"spike",g:50},{t:"empty",g:80},{t:"dspike",g:90},{t:"spike",g:65},{t:"block",g:85,h:28},{t:"spike",g:50},{t:"spike",g:50},{t:"empty",g:110},{t:"block",g:70,h:50},{t:"spike",g:55},{t:"spike",g:60},{t:"empty",g:100},{t:"dspike",g:80},{t:"spike",g:50},{t:"block",g:90,h:28},{t:"spike",g:55},{t:"spike",g:55},{t:"empty",g:120},{t:"spike",g:50},{t:"block",g:70,h:40},{t:"spike",g:50},{t:"dspike",g:80},{t:"spike",g:55},{t:"empty",g:100},{t:"spike",g:45},{t:"spike",g:45},{t:"spike",g:55},{t:"block",g:90,h:28},{t:"empty",g:150}]},
{id:"backontrack",name:"Back On Track",color:"#3b82f6",ico:"2",diff:"Normal",speed:4.8,pattern:[{t:"empty",g:150},{t:"spike",g:70},{t:"block",g:65,h:28},{t:"spike",g:55},{t:"spike",g:50},{t:"empty",g:80},{t:"dspike",g:70},{t:"spike",g:50},{t:"block",g:75,h:40},{t:"spike",g:45},{t:"spike",g:50},{t:"empty",g:70},{t:"spike",g:45},{t:"spike",g:45},{t:"block",g:60,h:28},{t:"dspike",g:75},{t:"spike",g:50},{t:"empty",g:90},{t:"block",g:55,h:50},{t:"spike",g:45},{t:"spike",g:45},{t:"spike",g:55},{t:"empty",g:80},{t:"dspike",g:60},{t:"block",g:70,h:28},{t:"spike",g:50},{t:"spike",g:45},{t:"empty",g:100},{t:"spike",g:40},{t:"spike",g:40},{t:"block",g:65,h:40},{t:"dspike",g:70},{t:"spike",g:50},{t:"empty",g:90},{t:"spike",g:40},{t:"block",g:55,h:28},{t:"spike",g:45},{t:"spike",g:45},{t:"spike",g:50},{t:"empty",g:140}]},
{id:"polargeist",name:"Polargeist",color:"#a855f7",ico:"3",diff:"Hard",speed:5.4,pattern:[{t:"empty",g:140},{t:"spike",g:55},{t:"spike",g:45},{t:"block",g:55,h:28},{t:"spike",g:40},{t:"dspike",g:60},{t:"spike",g:40},{t:"spike",g:40},{t:"empty",g:65},{t:"block",g:50,h:40},{t:"spike",g:40},{t:"spike",g:40},{t:"dspike",g:55},{t:"spike",g:40},{t:"block",g:55,h:28},{t:"spike",g:40},{t:"spike",g:40},{t:"spike",g:45},{t:"empty",g:70},{t:"block",g:45,h:55},{t:"spike",g:40},{t:"dspike",g:55},{t:"spike",g:40},{t:"spike",g:40},{t:"empty",g:60},{t:"spike",g:38},{t:"spike",g:38},{t:"block",g:50,h:28},{t:"spike",g:40},{t:"dspike",g:55},{t:"spike",g:40},{t:"block",g:55,h:40},{t:"spike",g:38},{t:"spike",g:38},{t:"spike",g:42},{t:"empty",g:80},{t:"dspike",g:50},{t:"spike",g:38},{t:"block",g:50,h:28},{t:"spike",g:38},{t:"spike",g:40},{t:"empty",g:130}]},
{id:"dryout",name:"Dry Out",color:"#f59e0b",ico:"4",diff:"Harder",speed:5.8,pattern:[{t:"empty",g:130},{t:"spike",g:50},{t:"block",g:50,h:28},{t:"spike",g:40},{t:"spike",g:38},{t:"dspike",g:55},{t:"spike",g:38},{t:"empty",g:55},{t:"block",g:45,h:45},{t:"spike",g:38},{t:"spike",g:38},{t:"spike",g:42},{t:"dspike",g:50},{t:"block",g:50,h:28},{t:"spike",g:38},{t:"spike",g:38},{t:"empty",g:60},{t:"spike",g:35},{t:"spike",g:35},{t:"block",g:45,h:55},{t:"spike",g:38},{t:"dspike",g:50},{t:"spike",g:35},{t:"spike",g:38},{t:"empty",g:55},{t:"block",g:42,h:28},{t:"spike",g:35},{t:"spike",g:35},{t:"spike",g:40},{t:"dspike",g:50},{t:"block",g:48,h:40},{t:"spike",g:38},{t:"spike",g:35},{t:"spike",g:38},{t:"empty",g:70},{t:"spike",g:35},{t:"dspike",g:48},{t:"block",g:45,h:28},{t:"spike",g:38},{t:"spike",g:35},{t:"spike",g:40},{t:"empty",g:120}]},
{id:"baseafterbase",name:"Base After Base",color:"#ef4444",ico:"5",diff:"Insane",speed:6.2,pattern:[{t:"empty",g:120},{t:"spike",g:42},{t:"spike",g:36},{t:"block",g:45,h:28},{t:"spike",g:35},{t:"spike",g:35},{t:"dspike",g:48},{t:"spike",g:35},{t:"empty",g:50},{t:"block",g:40,h:48},{t:"spike",g:35},{t:"spike",g:35},{t:"spike",g:38},{t:"dspike",g:45},{t:"block",g:45,h:28},{t:"spike",g:34},{t:"spike",g:34},{t:"spike",g:38},{t:"empty",g:55},{t:"block",g:40,h:58},{t:"spike",g:35},{t:"dspike",g:45},{t:"spike",g:34},{t:"spike",g:34},{t:"empty",g:50},{t:"spike",g:32},{t:"spike",g:32},{t:"block",g:42,h:28},{t:"spike",g:35},{t:"dspike",g:45},{t:"spike",g:34},{t:"block",g:45,h:40},{t:"spike",g:32},{t:"spike",g:32},{t:"spike",g:36},{t:"empty",g:60},{t:"dspike",g:42},{t:"spike",g:32},{t:"block",g:40,h:28},{t:"spike",g:32},{t:"spike",g:32},{t:"spike",g:38},{t:"empty",g:110}]}
];
let player={x:90,y:GROUND-CUBE,vy:0,onGround:true,rot:0,rotTarget:0};
let obstacles=[],running=false,holding=false,level=null,scrollX=0,totalLen=0,particles=[],bgOffset=0;
function buildObstacles(lvl){obstacles=[];let x=320;for(const p of lvl.pattern){x+=p.g;if(p.t==="empty")continue;if(p.t==="spike")obstacles.push({x,w:26,h:32,type:"spike"});else if(p.t==="dspike"){obstacles.push({x,w:26,h:32,type:"spike"});obstacles.push({x:x+28,w:26,h:32,type:"spike"})}else if(p.t==="block")obstacles.push({x,w:30,h:p.h||28,type:"block"})}totalLen=x+200}
function reset(lvl){level=lvl;player={x:90,y:GROUND-CUBE,vy:0,onGround:true,rot:0,rotTarget:0};scrollX=0;particles=[];holding=false;buildObstacles(lvl);lvName.textContent=lvl.name;progEl.textContent="0%"}
function jump(){if(player.onGround&&running){player.vy=JUMP;player.onGround=false;player.rotTarget+=Math.PI/2}}
function tick(){if(!running)return;const spd=level.speed*diffMod;if(holding&&player.onGround)jump();player.vy+=GRAVITY;player.y+=player.vy;if(player.y+CUBE>=GROUND){player.y=GROUND-CUBE;player.vy=0;if(!player.onGround){player.onGround=true;player.rot=Math.round(player.rot/(Math.PI/2))*(Math.PI/2);player.rotTarget=player.rot}}const rotDiff=player.rotTarget-player.rot;if(Math.abs(rotDiff)>0.01)player.rot+=rotDiff*0.18;else player.rot=player.rotTarget;scrollX+=spd;bgOffset+=spd*0.3;const pct=Math.min(100,Math.floor((scrollX/totalLen)*100));progEl.textContent=pct+"%";if(scrollX>=totalLen){running=false;showWin();return}for(const o of obstacles){const ox=o.x-scrollX;if(ox<-40||ox>W+20)continue;const px=player.x,py=player.y;if(px+CUBE-6>ox+4&&px+4<ox+o.w-4&&py+CUBE>GROUND-o.h+6){die();return}}if(Math.random()<0.5)particles.push({x:player.x+4,y:player.y+CUBE/2+(Math.random()-0.5)*10,vx:-1.5-Math.random(),vy:(Math.random()-0.5)*1.5,life:1,col:level.color});particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.045});particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(tick)}
function die(){running=false;for(let i=0;i<20;i++)particles.push({x:player.x+CUBE/2,y:player.y+CUBE/2,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:1,col:"#ff2d95"});draw();setTimeout(()=>{ov.innerHTML="<h2>Zkus to znovu</h2><p>"+level.name+" · "+progEl.textContent+"</p><button class=\"lvl\" style=\"justify-content:center;margin-top:.5rem\" onclick=\"startLevel(LEVELS.find(l=>l.id===\'"+level.id+"\'))\"><span class=\"name\">Restart</span></button><button class=\"back-btn\" onclick=\"showMenu()\">← Levely</button>";ov.style.display="flex"},400)}
function showWin(){ov.innerHTML="<h2>Level Complete!</h2><p>"+level.name+"</p><button class=\"lvl\" style=\"justify-content:center;margin-top:.5rem\" onclick=\"showMenu()\"><span class=\"name\">Dalsi levely</span></button>";ov.style.display="flex"}
function startLevel(lvl){reset(lvl);ov.style.display="none";running=true;tick()}
function showMenu(){running=false;ov.innerHTML="<h2>Vyber level</h2><p>Klik / mezernik = skok · drz pro auto-jump</p><div class=\"levels\" id=\"levelList\"></div>";const list=document.getElementById("levelList");LEVELS.forEach(l=>{const b=document.createElement("button");b.className="lvl";b.innerHTML="<div class=\"ico\" style=\"background:"+l.color+"\">"+l.ico+"</div><div class=\"info\"><div class=\"name\">"+l.name+"</div><div class=\"diff\">"+l.diff+"</div></div>";b.onclick=()=>startLevel(l);list.appendChild(b)});ov.style.display="flex";lvName.textContent="—";progEl.textContent="0%";drawMenuBg()}
function drawMenuBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a0a2e");g.addColorStop(1,"#2d1155");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="#1e1035";ctx.fillRect(0,GROUND,W,H-GROUND);ctx.strokeStyle="#ff2d95";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke()}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a0a2e");g.addColorStop(1,"#2d1155");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle="rgba(167,139,250,0.07)";ctx.lineWidth=1;const go=bgOffset%40;for(let x=-go;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GROUND);ctx.stroke()}for(let y=0;y<GROUND;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle="#1e1035";ctx.fillRect(0,GROUND,W,H-GROUND);const lineG=ctx.createLinearGradient(0,GROUND,W,GROUND);lineG.addColorStop(0,level?level.color:"#ff2d95");lineG.addColorStop(1,"#7c5cfc");ctx.strokeStyle=lineG;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col||"#39ff14";ctx.fillRect(p.x,p.y,5,5)});ctx.globalAlpha=1;obstacles.forEach(o=>{const ox=o.x-scrollX;if(ox<-50||ox>W+30)return;if(o.type==="spike"){const sg=ctx.createLinearGradient(ox,GROUND-o.h,ox,GROUND);sg.addColorStop(0,"#ff6bcb");sg.addColorStop(1,"#c02674");ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(ox,GROUND);ctx.lineTo(ox+o.w/2,GROUND-o.h);ctx.lineTo(ox+o.w,GROUND);ctx.closePath();ctx.fill()}else{const bg=ctx.createLinearGradient(ox,GROUND-o.h,ox+o.w,GROUND);bg.addColorStop(0,"#8b5cf6");bg.addColorStop(1,"#4c1d95");ctx.fillStyle=bg;ctx.fillRect(ox,GROUND-o.h,o.w,o.h);ctx.fillStyle="rgba(255,255,255,0.18)";ctx.fillRect(ox+3,GROUND-o.h+3,o.w-6,5)}});const cx=player.x+CUBE/2,cy=player.y+CUBE/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(player.rot);ctx.shadowColor=level?level.color:"#39ff14";ctx.shadowBlur=14;const cg=ctx.createLinearGradient(-14,-14,14,14);cg.addColorStop(0,"#6ee7b7");cg.addColorStop(1,"#10b981");ctx.fillStyle=cg;ctx.fillRect(-CUBE/2,-CUBE/2,CUBE,CUBE);ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,0.35)";ctx.fillRect(-CUBE/2+4,-CUBE/2+4,CUBE-8,7);ctx.fillStyle="#064e3b";ctx.beginPath();ctx.arc(5,-2,3.5,0,Math.PI*2);ctx.fill();ctx.restore()}
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();holding=true;jump()}});
document.addEventListener("keyup",e=>{if(e.code==="Space"||e.code==="ArrowUp")holding=false});
canvas.addEventListener("pointerdown",e=>{e.preventDefault();holding=true;jump()});
canvas.addEventListener("pointerup",()=>holding=false);
canvas.addEventListener("pointerleave",()=>holding=false);
showMenu();
</script>
</body>
</html>
