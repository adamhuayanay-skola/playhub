<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none;touch-action:none}

.overlay h2{font-size:1.1rem;font-weight:800}
.overlay p{color:#aaa;font-size:.8rem}
.skins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px}
.skin{width:40px;height:40px;border:2px solid #444;border-radius:4px;cursor:pointer}
.skin.on{border-color:#7cff4a;box-shadow:0 0 10px #7cff4a}
.levels{display:flex;flex-direction:column;gap:6px;width:min(280px,90%)}
.lvl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid #333;border-radius:6px;background:#1a1a2e;color:#fff;cursor:pointer;font-weight:700;text-align:left}
.lvl:hover{border-color:#7cff4a}
.lvl .n{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900}
.lvl .meta{font-size:.7rem;color:#888;font-weight:500}
.btn{margin-top:6px;padding:10px 28px;border:2px solid #7cff4a;border-radius:6px;background:#1a3a1a;color:#7cff4a;font-weight:800;cursor:pointer}
.btn:hover{background:#7cff4a;color:#000}
.hint{margin-top:8px;font-size:.7rem;color:#555}

let P={x:100,y:GROUND-SZ,vy:0,gnd:true,rot:0,rt:0},objs=[],run=false,hold=false,lvl=null,scr=0,total=0,parts=[],tt=0,cam=0;
function build(L){objs=[];let x=320;for(const p of L.pattern){x+=p.g;if(p.t==="e")continue;if(p.t==="s")objs.push({x,w:30,h:34,ty:"s"});else if(p.t==="d"){objs.push({x,w:28,h:34,ty:"s"});objs.push({x:x+28,w:28,h:34,ty:"s"})}else if(p.t==="b")objs.push({x,w:52,h:p.h||32,ty:"b"})}total=x+250}
function reset(L){lvl=L;P={x:100,y:GROUND-SZ,vy:0,gnd:true,rot:0,rt:0};scr=0;parts=[];hold=false;build(L);pctEl.textContent="0%";attEl.textContent="Attempt "+attempts}

function die(){run=false;attempts++;localStorage.setItem("gdAtt",attempts);const s=SKINS[skinI];for(let i=0;i<24;i++)parts.push({x:P.x+SZ/2,y:P.y+SZ/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10-2,life:1,c:i%2?s.pri:s.sec});draw();setTimeout(function(){ov.innerHTML="<h2 style=\"color:#ff5555\">Crashed!</h2><p>"+lvl.name+" · "+pctEl.textContent+"</p><button class=\"btn\" onclick=\"go(LEVELS.find(l=>l.id===\'"+lvl.id+"\'))\">Retry</button><button class=\"btn\" style=\"border-color:#666;color:#aaa;background:#222\" onclick=\"menu()\">Menu</button>";ov.style.display="flex"},400)}

function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a3a6e");g.addColorStop(1,"#0d1b3a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ground();cube(W/2,GROUND-SZ/2-20,0,SKINS[skinI])}
function ground(){ctx.fillStyle="#0a0a12";ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle="#1a1a2a";ctx.fillRect(0,GROUND,W,8);ctx.strokeStyle="#fff";ctx.globalAlpha=.15;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();ctx.globalAlpha=1}
function cube(cx,cy,rot,s){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.shadowColor=s.pri;ctx.shadowBlur=20;
  const g=ctx.createLinearGradient(-SZ/2,-SZ/2,SZ/2,SZ/2);
  g.addColorStop(0,s.pri);g.addColorStop(1,s.sec);
  ctx.fillStyle=g;
  // body by shape
  if(s.shape==="cat"){
    ctx.beginPath();ctx.roundRect(-SZ/2,-SZ/2,SZ,SZ,6);ctx.fill();
    // ears
    ctx.fillStyle=s.pri;
    ctx.beginPath();ctx.moveTo(-SZ/2+2,-SZ/2);ctx.lineTo(-SZ/2+8,-SZ/2-10);ctx.lineTo(-SZ/2+14,-SZ/2);ctx.fill();
    ctx.beginPath();ctx.moveTo(SZ/2-14,-SZ/2);ctx.lineTo(SZ/2-8,-SZ/2-10);ctx.lineTo(SZ/2-2,-SZ/2);ctx.fill();
  } else if(s.shape==="robot"){
    ctx.fillRect(-SZ/2,-SZ/2,SZ,SZ);
    ctx.fillStyle="#333";ctx.fillRect(-SZ/2+4,-SZ/2+4,SZ-8,8);
    ctx.fillStyle=s.eye;ctx.fillRect(-6,-6,5,5);ctx.fillRect(2,-6,5,5);

  } else if(s.shape==="fire"){
    ctx.beginPath();ctx.moveTo(0,-SZ/2-4);ctx.lineTo(SZ/2,SZ/2);ctx.lineTo(-SZ/2,SZ/2);ctx.closePath();ctx.fill();
  } else if(s.shape==="ice"){
    ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;const r=SZ/2+2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();
  } else if(s.shape==="neon"){
    ctx.strokeStyle=s.pri;ctx.lineWidth=3;ctx.shadowBlur=25;
    ctx.strokeRect(-SZ/2+2,-SZ/2+2,SZ-4,SZ-4);
    ctx.fillStyle=s.sec;ctx.globalAlpha=.5;ctx.fillRect(-SZ/2+4,-SZ/2+4,SZ-8,SZ-8);ctx.globalAlpha=1;
  } else {
    ctx.fillRect(-SZ/2,-SZ/2,SZ,SZ);
  }
  ctx.shadowBlur=0;
  if(s.shape!=="robot"&&s.shape!=="fire"&&s.shape!=="neon"){
    ctx.fillStyle="rgba(255,255,255,.4)";ctx.fillRect(-SZ/2+3,-SZ/2+3,SZ-6,8);
    ctx.fillStyle=s.eye;ctx.beginPath();ctx.arc(7,-2,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(8.5,-2,2.5,0,Math.PI*2);ctx.fill();
    if(s.shape==="cat"){
      // second eye + whiskers
      ctx.fillStyle=s.eye;ctx.beginPath();ctx.arc(-5,-2,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-4,-2,2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#111";ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-14,4);ctx.lineTo(-4,6);ctx.moveTo(4,6);ctx.lineTo(14,4);ctx.stroke();
    } else {
      ctx.strokeStyle="#111";ctx.lineWidth=1.8;ctx.lineCap="round";
      ctx.beginPath();ctx.arc(2,7,5,.2,Math.PI-.2);ctx.stroke();
    }
  }
  if(s.shape==="gold"){
    ctx.strokeStyle="#fff";ctx.globalAlpha=.3;ctx.lineWidth=2;ctx.strokeRect(-SZ/2+2,-SZ/2+2,SZ-4,SZ-4);ctx.globalAlpha=1;
  }
  if(s.shape==="dark"){
    ctx.fillStyle=s.eye;ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function loop(){if(!run)return;tt++;if(hold&&P.gnd)jump();P.vy+=GRAV;P.y+=P.vy;P.gnd=false;if(P.y+SZ>=GROUND){P.y=GROUND-SZ;P.vy=0;P.gnd=true;P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);P.rt=P.rot}for(const o of objs){const ox=o.x-scr;if(ox<-60||ox>W+40)continue;const top=GROUND-o.h;const hitX=P.x+SZ-6>ox+4&&P.x+6<ox+o.w-4;if(!hitX)continue;if(o.ty==="s"){if(P.y+SZ>top+5){die();return}}else{const feet=P.y+SZ;if(P.vy>=0&&feet>=top-2&&feet<=top+20&&P.y<top+2){P.y=top-SZ;P.vy=0;P.gnd=true;P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);P.rt=P.rot}else if(feet>top+22&&P.y<GROUND-6){die();return}}}const rd=P.rt-P.rot;if(Math.abs(rd)>.01)P.rot+=rd*0.22;else P.rot=P.rt;scr+=lvl.spd*diffMod;cam+=lvl.spd*diffMod*.4;const pct=Math.min(100,Math.floor(scr/total*100));pctEl.textContent=pct+"%";if(scr>=total){win();return}if(tt%2===0){const s=SKINS[skinI];parts.push({x:P.x+4,y:P.y+SZ/2+(Math.random()-.5)*12,vx:-2-Math.random()*2,vy:(Math.random()-.5)*2,life:1,c:s.pri})}parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=.05});parts=parts.filter(function(p){return p.life>0});draw();requestAnimationFrame(loop)}
function draw(){const bgc=lvl?lvl.bg:["#1a3a6e","#0d1b3a"];const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,bgc[0]);g.addColorStop(1,bgc[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.06;ctx.strokeStyle="#fff";ctx.lineWidth=2;for(let i=0;i<8;i++){const x=((i*90-cam*0.3)%(W+100))-50;ctx.strokeRect(x,40+(i%3)*50,60,60)}ctx.globalAlpha=1;ctx.strokeStyle="rgba(255,255,255,.04)";ctx.lineWidth=1;const go=cam%40;for(let x=-go;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GROUND);ctx.stroke()}ground();if(lvl){ctx.strokeStyle=lvl.col;ctx.globalAlpha=.6;ctx.lineWidth=3;ctx.shadowColor=lvl.col;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1}parts.forEach(function(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,7,7)});ctx.globalAlpha=1;objs.forEach(function(o){const ox=o.x-scr;if(ox<-50||ox>W+40)return;if(o.ty==="s"){ctx.fillStyle="#111";ctx.beginPath();ctx.moveTo(ox,GROUND);ctx.lineTo(ox+o.w/2,GROUND-o.h);ctx.lineTo(ox+o.w,GROUND);ctx.closePath();ctx.fill();ctx.strokeStyle="#fff";ctx.globalAlpha=.25;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1}else{ctx.fillStyle="#2a2a3a";ctx.fillRect(ox,GROUND-o.h,o.w,o.h);ctx.fillStyle=lvl?lvl.col:"#4a9eff";ctx.globalAlpha=.7;ctx.fillRect(ox,GROUND-o.h,o.w,4);ctx.globalAlpha=1;ctx.strokeStyle="rgba(255,255,255,.2)";ctx.lineWidth=1;ctx.strokeRect(ox,GROUND-o.h,o.w,o.h)}});cube(P.x+SZ/2,P.y+SZ/2,P.rot,SKINS[skinI]);ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillRect(0,0,W,6);const pct=Math.min(1,scr/total);const pg=ctx.createLinearGradient(0,0,W*pct,0);pg.addColorStop(0,"#7cff4a");pg.addColorStop(1,"#00d4ff");ctx.fillStyle=pg;ctx.fillRect(0,0,W*pct,6)}
