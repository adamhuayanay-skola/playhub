<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Geometry Dash</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#12061f;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none;touch-action:none}h1{font-size:1.15rem;font-weight:800;margin-bottom:.25rem;background:linear-gradient(90deg,#ff2d95,#7c5cfc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hud{color:#c4b5fd;margin-bottom:.5rem;font-size:.9rem}.hud strong{color:#f5d0fe}.wrap{position:relative;line-height:0}canvas{display:block;border-radius:14px;box-shadow:0 0 0 2px rgba(255,45,149,.25),0 25px 60px rgba(0,0,0,.55);max-width:100%}.overlay{position:absolute;inset:0;background:rgba(18,6,31,.9);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;border-radius:14px}.overlay h2{font-size:1.35rem;font-weight:800}.overlay p{color:#a78bfa;font-size:.9rem}.overlay button{padding:.75rem 2.2rem;border:none;border-radius:999px;background:linear-gradient(135deg,#ff2d95,#7c5cfc);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.hint{margin-top:.55rem;font-size:.75rem;color:#64748b}</style></head><body>
<h1>GEOMETRY DASH</h1><div class="hud">Skore: <strong id="sc">0</strong></div>
<div class="wrap"><canvas id="c" width="520" height="300"></canvas>
<div class="overlay" id="ov"><h2 id="msg">Geometry Dash</h2><p>Klik / mezernik = skok</p><button id="btn">Hrat</button></div></div>
<p class="hint">Kostka se otaci ve vzduchu</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc"),ov=document.getElementById("ov"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
const params=new URLSearchParams(location.search);const diff=params.get("diff")||"mid";
const SPEEDS={easy:3.4,mid:4.8,hard:6.5};let speed=SPEEDS[diff]||4.8;
let player={x:90,y:220,vy:0,w:30,h:30,onGround:true,rot:0,rotV:0};
let obstacles=[],score=0,running=false,frame=0,particles=[],groundY=250;
const W=520,H=300;
function spawn(){const type=Math.random()>0.45?"spike":"block";const h=type==="spike"?36+Math.random()*20:32+Math.random()*28;obstacles.push({x:W+40,w:type==="spike"?28:30,h,type})}
function reset(){player={x:90,y:groundY-30,vy:0,w:30,h:30,onGround:true,rot:0,rotV:0};obstacles=[];score=0;frame=0;particles=[];scEl.textContent=0;for(let i=0;i<4;i++)obstacles.push({x:320+i*160,w:28,h:35+Math.random()*20,type:Math.random()>0.4?"spike":"block"})}
function jump(){if(player.onGround&&running){player.vy=-12.2;player.onGround=false;player.rotV=0.22}}
function tick(){if(!running)return;frame++;player.vy+=0.58;player.y+=player.vy;
if(player.y+player.h>=groundY){player.y=groundY-player.h;player.vy=0;player.onGround=true;player.rot=Math.round(player.rot/(Math.PI/2))*(Math.PI/2);player.rotV=0}else{player.rot+=player.rotV}
obstacles.forEach(o=>o.x-=speed);
if(obstacles.length&&obstacles[0].x<-50){obstacles.shift();score++;scEl.textContent=score;spawn()}if(frame%75===0)spawn();
for(const o of obstacles){const px=player.x,py=player.y,pw=player.w,ph=player.h;if(px+pw>o.x+5&&px<o.x+o.w-5&&py+ph>groundY-o.h+4){running=false;msg.textContent="Game Over · "+score;btn.textContent="Znovu";ov.style.display="flex";return}}
if(frame%3===0)particles.push({x:player.x+4,y:player.y+player.h/2,vx:-2-Math.random(),vy:(Math.random()-0.5)*2,life:1});
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.05});particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(tick)}
function draw(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#1a0a2e");bg.addColorStop(1,"#2d1155");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.strokeStyle="rgba(167,139,250,0.08)";ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,groundY);ctx.stroke()}for(let y=0;y<groundY;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle="#1e1035";ctx.fillRect(0,groundY,W,H-groundY);const lineG=ctx.createLinearGradient(0,groundY,W,groundY);lineG.addColorStop(0,"#ff2d95");lineG.addColorStop(0.5,"#7c5cfc");lineG.addColorStop(1,"#22d3ee");ctx.strokeStyle=lineG;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();
particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle="#39ff14";ctx.fillRect(p.x,p.y,5,5)});ctx.globalAlpha=1;
obstacles.forEach(o=>{if(o.type==="spike"){const g=ctx.createLinearGradient(o.x,groundY-o.h,o.x,groundY);g.addColorStop(0,"#ff6bcb");g.addColorStop(1,"#c02674");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(o.x,groundY);ctx.lineTo(o.x+o.w/2,groundY-o.h);ctx.lineTo(o.x+o.w,groundY);ctx.closePath();ctx.fill()}else{const g=ctx.createLinearGradient(o.x,groundY-o.h,o.x+o.w,groundY);g.addColorStop(0,"#8b5cf6");g.addColorStop(1,"#4c1d95");ctx.fillStyle=g;ctx.fillRect(o.x,groundY-o.h,o.w,o.h);ctx.fillStyle="rgba(255,255,255,0.15)";ctx.fillRect(o.x+3,groundY-o.h+3,o.w-6,6)}});
const cx=player.x+player.w/2,cy=player.y+player.h/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(player.rot);ctx.shadowColor="#39ff14";ctx.shadowBlur=12;
const cg=ctx.createLinearGradient(-15,-15,15,15);cg.addColorStop(0,"#6ee7b7");cg.addColorStop(1,"#10b981");ctx.fillStyle=cg;ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,0.3)";ctx.fillRect(-player.w/2+4,-player.h/2+4,player.w-8,7);ctx.fillStyle="#064e3b";ctx.beginPath();ctx.arc(4,-2,3,0,Math.PI*2);ctx.fill();ctx.restore()}
btn.onclick=()=>{ov.style.display="none";reset();running=true;tick()};
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});canvas.addEventListener("pointerdown",jump);draw();
</script></body></html>
