<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Simon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;font-family:system-ui,sans-serif;color:#fff;user-select:none}
#leave{position:fixed;top:12px;left:12px;z-index:99;width:48px;height:48px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
h1{margin-bottom:8px;letter-spacing:.1em}
#st{margin-bottom:16px;color:#94a3b8;font-weight:700}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(320px,90vw)}
.btn{aspect-ratio:1;border:none;border-radius:18px;cursor:pointer;opacity:.75;transition:opacity .1s,transform .1s}
.btn:active,.btn.lit{opacity:1;transform:scale(.97);filter:brightness(1.35)}
.g{background:#16a34a}.r{background:#dc2626}.y{background:#eab308}.b{background:#2563eb}
#start{margin-top:18px;padding:12px 22px;border:none;border-radius:12px;font-weight:800;cursor:pointer}

/* visual polish – no gameplay changes */
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;
}
#leave,.leave-btn,button#leave{
  position:fixed!important;top:12px!important;left:12px!important;z-index:9999!important;
  width:48px!important;height:48px!important;border:none!important;border-radius:14px!important;
  background:linear-gradient(145deg,#f87171,#dc2626)!important;color:#fff!important;
  font-size:28px!important;font-weight:900!important;cursor:pointer!important;
  box-shadow:0 6px 20px rgba(220,38,38,.45)!important;line-height:1!important;
}
#leave:active,.leave-btn:active,button#leave:active{transform:scale(.94)}
canvas{
  border-radius:14px!important;
  box-shadow:0 16px 40px rgba(0,0,0,.35)!important;
}
h1{
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

</style></head><body>
<button type="button" id="leave">&times;</button>
<h1>SIMON</h1>
<div id="st">Stiskni Start</div>
<div class="pad">
<button class="btn g" data-i="0"></button>
<button class="btn r" data-i="1"></button>
<button class="btn y" data-i="2"></button>
<button class="btn b" data-i="3"></button>
</div>
<button type="button" id="start">Start</button>
<script>
(function(){
document.getElementById("leave").onclick=function(){location.href="../index.html";};
var seq=[],pos=0,lock=true,btns=document.querySelectorAll(".btn");
var st=document.getElementById("st");
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function playSeq(){
  lock=true;st.textContent="Sleduj...";
  await sleep(400);
  for(var i=0;i<seq.length;i++){
    var b=btns[seq[i]];b.classList.add("lit");
    await sleep(420);b.classList.remove("lit");await sleep(180);
  }
  pos=0;lock=false;st.textContent="Tvoje rada ("+seq.length+")";
}
async function next(){
  seq.push((Math.random()*4)|0);
  await playSeq();
}
document.getElementById("start").onclick=function(){seq=[];pos=0;next();};
btns.forEach(function(b){
  b.onclick=function(){
    if(lock)return;
    var i=+b.getAttribute("data-i");
    b.classList.add("lit");setTimeout(function(){b.classList.remove("lit");},180);
    if(i!==seq[pos]){st.textContent="Game Over! Skore "+Math.max(0,seq.length-1);lock=true;return;}
    pos++;
    if(pos>=seq.length){st.textContent="Spravne!";lock=true;setTimeout(next,500);}
  };
});
})();
</script></body></html>
