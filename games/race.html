<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Retro Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}
#leave{position:fixed;top:12px;left:12px;z-index:99;width:48px;height:48px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
h1{margin-bottom:6px}
#sc{margin-bottom:8px;font-weight:700}
canvas{border-radius:8px;max-width:96vw;background:#222;cursor:pointer}
.hint{margin-top:8px;color:#888;font-size:.8rem}

/* visual polish – no gameplay changes */
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;
}
#leave,.leave-btn,button#leave{
  position:fixed!important;top:12px!important;left:12px!important;z-index:9999!important;
  width:48px!important;height:48px!important;border:none!important;border-radius:14px!important;
  background:linear-gradient(145deg,#f87171,#dc2626)!important;color:#fff!important;
  font-size:28px!important;font-weight:900!important;cursor:pointer!important;
  box-shadow:0 6px 20px rgba(220,38,38,.45)!important;line-height:1!important;
}
#leave:active,.leave-btn:active,button#leave:active{transform:scale(.94)}
canvas{
  border-radius:14px!important;
  box-shadow:0 16px 40px rgba(0,0,0,.35)!important;
}
h1{
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

</style></head><body>
<button type="button" id="leave">&times;</button>
<h1>RETRO RACE</h1>
<div id="sc">Score 0</div>
<canvas id="c" width="320" height="480"></canvas>
<p class="hint">\u2190 \u2192 nebo A/D \u00b7 vyhybej se autum</p>
<script>
(function(){
document.getElementById("leave").onclick=function(){location.href="../index.html";};
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=320,H=480;
var lane=1,cars=[],score=0,run=false,dead=false,spd=4,tick=0;
function reset(){lane=1;cars=[];score=0;run=true;dead=false;spd=4;tick=0;document.getElementById("sc").textContent="Score 0";}
function loop(){
if(run&&!dead){
tick++;spd=4+Math.min(6,score/8);
if(tick%Math.max(25,50-score)===0)cars.push({lane:(Math.random()*3)|0,y:-60,color:["#ef4444","#3b82f6","#eab308","#a855f7"][(Math.random()*4)|0]});
for(var i=cars.length-1;i>=0;i--){
cars[i].y+=spd;
if(cars[i].y>H+40){cars.splice(i,1);score++;document.getElementById("sc").textContent="Score "+score;continue;}
if(cars[i].lane===lane&&cars[i].y>H-130&&cars[i].y<H-40){dead=true;run=false;}
}
}
ctx.fillStyle="#1a1a1a";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="#fbbf24";ctx.setLineDash([16,16]);ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(W/3,0);ctx.lineTo(W/3,H);ctx.moveTo(2*W/3,0);ctx.lineTo(2*W/3,H);ctx.stroke();ctx.setLineDash([]);
function carRect(ln,y,col){var x=ln*(W/3)+W/6-18;ctx.fillStyle=col;ctx.fillRect(x,y,36,56);ctx.fillStyle="#0ea5e9";ctx.fillRect(x+4,y+8,28,14);}
for(i=0;i<cars.length;i++)carRect(cars[i].lane,cars[i].y,cars[i].color);
carRect(lane,H-100,"#22c55e");
if(!run&&!dead){ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="18px system-ui";ctx.textAlign="center";ctx.fillText("Klikni pro start",W/2,H/2);}
if(dead){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fecaca";ctx.font="bold 24px system-ui";ctx.textAlign="center";ctx.fillText("Crash!",W/2,H/2);ctx.fillStyle="#fff";ctx.font="16px system-ui";ctx.fillText("Score "+score,W/2,H/2+28);}
requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){
if(!run){reset();return;}if(dead){reset();return;}
if(e.code==="ArrowLeft"||e.code==="KeyA")lane=Math.max(0,lane-1);
if(e.code==="ArrowRight"||e.code==="KeyD")lane=Math.min(2,lane+1);
});
cv.addEventListener("pointerdown",function(e){
if(!run||dead){reset();return;}
var r=cv.getBoundingClientRect();var x=(e.clientX-r.left)/r.width;
if(x<0.5)lane=Math.max(0,lane-1);else lane=Math.min(2,lane+1);
});
requestAnimationFrame(loop);
})();
</script></body></html>
