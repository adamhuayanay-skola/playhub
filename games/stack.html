<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Stack Ball</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0b1020;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none;touch-action:none}h1{font-size:1.15rem;font-weight:800;margin-bottom:.25rem;background:linear-gradient(90deg,#fbbf24,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hud{color:#94a3b8;margin-bottom:.5rem;font-size:.9rem}.hud strong{color:#fef3c7}.wrap{position:relative;line-height:0}canvas{display:block;border-radius:14px;box-shadow:0 25px 60px rgba(0,0,0,.5);max-width:96vw}.overlay{position:absolute;inset:0;background:rgba(11,16,32,.9);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;border-radius:14px}.overlay h2{font-size:1.35rem;font-weight:800}.overlay p{color:#94a3b8;font-size:.9rem}.overlay button{padding:.75rem 2.2rem;border:none;border-radius:999px;background:linear-gradient(135deg,#fbbf24,#ef4444);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.hint{margin-top:.55rem;font-size:.75rem;color:#475569}</style></head><body>
<h1>STACK BALL</h1><div class="hud">Skore: <strong id="sc">0</strong></div>
<div class="wrap"><canvas id="c" width="360" height="560"></canvas>
<div class="overlay" id="ov"><h2 id="msg">Stack Ball</h2><p>Klik / mezernik = pust micek</p><button id="btn">Hrat</button></div></div>
<p class="hint">Kruhy se otaci · micek se toci</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc"),ov=document.getElementById("ov"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
const params=new URLSearchParams(location.search);const diff=params.get("diff")||"mid";
const FALL={easy:2.8,mid:4.2,hard:6.0};let ball={x:180,y:70,r:13,vy:0,angle:0},platforms=[],score=0,running=false;
const colors=["#ef4444","#f97316","#eab308","#22c55e","#3b82f6","#a855f7"];const W=360,H=560,CX=180;
function makePlat(y){const segs=6+Math.floor(Math.random()*2);const gap=Math.floor(Math.random()*segs);return{y,segs,gap,rot:Math.random()*Math.PI*2,spin:(Math.random()>0.5?1:-1)*(0.012+Math.random()*0.01)}}
function reset(){ball={x:CX,y:70,r:13,vy:0,angle:0};platforms=[];score=0;scEl.textContent=0;for(let i=0;i<9;i++)platforms.push(makePlat(150+i*72))}
function tick(){if(!running)return;ball.vy+=0.28;ball.y+=ball.vy;ball.angle+=ball.vy*0.08+0.05;platforms.forEach(p=>{p.y-=1.35;p.rot+=p.spin});
if(platforms[0]&&platforms[0].y<-50){platforms.shift();platforms.push(makePlat(platforms[platforms.length-1].y+72));score++;scEl.textContent=score}
for(const p of platforms){const dy=ball.y-p.y;if(dy>-ball.r-4&&dy<ball.r+6){const localAng=(( -Math.PI/2 - p.rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);const segAng=(Math.PI*2)/p.segs;const seg=Math.floor(localAng/segAng)%p.segs;if(seg!==p.gap&&ball.vy>0){ball.vy=-7.5;ball.y=p.y-ball.r-2}}}
if(ball.y>H+40){running=false;msg.textContent="Game Over · "+score;btn.textContent="Znovu";ov.style.display="flex";return}if(ball.y<20)ball.y=20;draw();requestAnimationFrame(tick)}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b1020");g.addColorStop(1,"#1a1040");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle="rgba(255,255,255,0.03)";for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(CX,H/2,40+i*50,0,Math.PI*2);ctx.stroke()}
platforms.forEach(p=>{const R=95,r=58;for(let i=0;i<p.segs;i++){if(i===p.gap)continue;const a0=p.rot+i*(Math.PI*2)/p.segs;const a1=a0+(Math.PI*2)/p.segs*0.96;ctx.beginPath();ctx.arc(CX,p.y,R,a0,a1);ctx.arc(CX,p.y,r,a1,a0,true);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=1.5;ctx.stroke()}});
const bx=ball.x,by=ball.y,r=ball.r;ctx.fillStyle="rgba(0,0,0,0.3)";ctx.beginPath();ctx.ellipse(bx,by+r+3,r*0.85,r*0.3,0,0,Math.PI*2);ctx.fill();
const grd=ctx.createRadialGradient(bx-4,by-5,2,bx,by,r);grd.addColorStop(0,"#fef08a");grd.addColorStop(0.55,"#fbbf24");grd.addColorStop(1,"#b45309");ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
ctx.save();ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.clip();ctx.translate(bx,by);ctx.rotate(ball.angle);ctx.strokeStyle="rgba(255,255,255,0.3)";ctx.lineWidth=2.5;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(-r,i*7);ctx.lineTo(r,i*7);ctx.stroke()}ctx.restore();
ctx.fillStyle="rgba(255,255,255,0.4)";ctx.beginPath();ctx.ellipse(bx-4,by-5,r*0.3,r*0.2,-0.5,0,Math.PI*2);ctx.fill()}
function boost(){if(running)ball.vy=Math.max(ball.vy,FALL[diff]||4.2)}
btn.onclick=()=>{ov.style.display="none";reset();running=true;ball.vy=FALL[diff]||4.2;tick()};
canvas.addEventListener("pointerdown",boost);document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();boost()}});draw();
</script></body></html>
