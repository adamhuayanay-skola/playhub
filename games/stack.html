<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Stack</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-weight:800;margin-bottom:4px}.sc{font-size:1.6rem;font-weight:800;color:#a5b4fc;margin-bottom:10px}
canvas{border-radius:14px;max-width:96vw;cursor:pointer;background:#1e1b4b}.hint{margin-top:10px;color:#64748b;font-size:.75rem}.leave-btn{position:fixed;top:12px;left:12px;z-index:99;width:42px;height:42px;border:none;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:1.35rem;font-weight:800;cursor:pointer;line-height:1}
</style></head><body>
<button type="button" class="leave-btn" id="leaveBtn" title="Zpet">×</button>
<h1>STACK</h1><div class="sc" id="sc">0</div><canvas id="c" width="360" height="520"></canvas><p class="hint">Klik / Space = polozit</p>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),scEl=document.getElementById("sc");
const W=360,H=520,BH=32;
let stack=[],mov=null,score=0,play=false,over=false,spd=3;
function col(i){return "hsl("+((i*37)%360)+",78%,55%)";}
function start(){stack=[{x:W/2-50,y:H-60,w:100}];spd=3;score=0;scEl.textContent="0";over=false;play=true;spawn();}
function spawn(){var p=stack[stack.length-1],w=p.w,y=p.y-BH-3,left=score%2===0;mov={x:left?-w:W,y:y,w:w,vx:left?spd:-spd};if(y<80){var dy=80-y;stack.forEach(function(b){b.y+=dy;});mov.y+=dy;stack=stack.filter(function(b){return b.y<H+40;});}}
function drop(){if(over||!play){start();return;}if(!mov)return;var p=stack[stack.length-1],L=Math.max(mov.x,p.x),R=Math.min(mov.x+mov.w,p.x+p.w),nw=R-L;if(nw<6){play=false;over=true;mov=null;return;}stack.push({x:L,y:mov.y,w:nw});score++;scEl.textContent=score;spd=Math.min(7,3+score*0.15);mov=null;spawn();}
function loop(){if(play&&mov){mov.x+=mov.vx;if(mov.x+mov.w>W+40)mov.vx=-Math.abs(spd);if(mov.x<-40)mov.vx=Math.abs(spd);}
var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#312e81");g.addColorStop(1,"#0f172a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
function rr(x,y,w,h){ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.fill();}
stack.forEach(function(b,i){ctx.fillStyle=col(i);rr(b.x,b.y,b.w,BH);ctx.fillStyle="rgba(255,255,255,.2)";ctx.fillRect(b.x+3,b.y+2,b.w-6,5);});
if(mov){ctx.fillStyle=col(stack.length);rr(mov.x,mov.y,mov.w,BH);}
if(!play&&!over){ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 22px system-ui";ctx.textAlign="center";ctx.fillText("Klikni pro start",W/2,H/2);}
if(over){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("Game Over",W/2,H/2-10);ctx.font="16px system-ui";ctx.fillText("Score "+score,W/2,H/2+20);}
requestAnimationFrame(loop);}
cv.addEventListener("pointerdown",function(e){e.preventDefault();drop();});document.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();drop();}});
requestAnimationFrame(loop);
})();</script><script>(function(){var b=document.getElementById("leaveBtn");if(b)b.onclick=function(){if(history.length>1)history.back();else location.href="../index.html";};})();</script>
</body></html>
