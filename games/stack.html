<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Stack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.sc{font-size:1.8rem;font-weight:800;margin-bottom:10px;color:#a5b4fc}
canvas{border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.45);max-width:96vw;cursor:pointer;background:#1e1b4b}
.hint{margin-top:10px;color:#64748b;font-size:.75rem}
</style></head><body>
<h1>STACK</h1>
<div class="sc" id="sc">0</div>
<canvas id="c" width="360" height="520"></canvas>
<p class="hint">Klik / Space = polozit blok</p>
<script>
(function(){
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc");
const W=360,H=520,BH=32;
let stack=[], moving=null, score=0, playing=false, over=false, spd=3;

function color(i){return "hsl("+((i*37)%360)+",78%,55%)";}

function startGame(){
  stack=[{x:W/2-50, y:H-60, w:100}];
  spd=3;
  score=0;
  scEl.textContent="0";
  over=false;
  playing=true;
  spawnMoving();
}

function spawnMoving(){
  var prev=stack[stack.length-1];
  var w=prev.w;
  var y=prev.y-BH-3;
  // start from left or right alternating
  var fromLeft=(score%2===0);
  moving={
    x: fromLeft ? -w : W,
    y: y,
    w: w,
    vx: fromLeft ? spd : -spd
  };
  // scroll if too high
  if(y<80){
    var dy=80-y;
    for(var i=0;i<stack.length;i++)stack[i].y+=dy;
    moving.y+=dy;
    stack=stack.filter(function(b){return b.y<H+40;});
  }
}

function drop(){
  if(over){startGame();return;}
  if(!playing){startGame();return;}
  if(!moving)return;

  var prev=stack[stack.length-1];
  var left=Math.max(moving.x, prev.x);
  var right=Math.min(moving.x+moving.w, prev.x+prev.w);
  var newW=right-left;

  if(newW<6){
    // miss
    playing=false;
    over=true;
    moving=null;
    return;
  }

  // success - add block and continue
  stack.push({x:left, y:moving.y, w:newW});
  score+=1;
  scEl.textContent=String(score);
  spd=Math.min(7, 3+score*0.15);
  moving=null;
  spawnMoving();
}

function tick(){
  if(playing&&moving){
    moving.x+=moving.vx;
    if(moving.x+moving.w>W+40)moving.vx=-Math.abs(spd);
    if(moving.x<-40)moving.vx=Math.abs(spd);
  }

  // draw
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#312e81");g.addColorStop(1,"#0f172a");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  for(var i=0;i<stack.length;i++){
    var b=stack[i];
    ctx.fillStyle=color(i);
    rr(b.x,b.y,b.w,BH,5);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.2)";ctx.fillRect(b.x+3,b.y+2,b.w-6,5);
  }
  if(moving){
    ctx.fillStyle=color(stack.length);
    rr(moving.x,moving.y,moving.w,BH,5);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.25)";ctx.fillRect(moving.x+3,moving.y+2,moving.w-6,5);
  }

  if(!playing&&!over){
    ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 22px system-ui";ctx.textAlign="center";
    ctx.fillText("Klikni pro start",W/2,H/2);
  }
  if(over){
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 26px system-ui";ctx.textAlign="center";
    ctx.fillText("Game Over",W/2,H/2-14);
    ctx.font="16px system-ui";ctx.fillText("Score "+score,W/2,H/2+16);
    ctx.fillText("klikni znovu",W/2,H/2+40);
  }
  requestAnimationFrame(tick);
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

canvas.addEventListener("pointerdown",function(e){e.preventDefault();drop();});
document.addEventListener("keydown",function(e){
  if(e.code==="Space"){e.preventDefault();drop();}
});
requestAnimationFrame(tick);
})();
</script></body></html>
