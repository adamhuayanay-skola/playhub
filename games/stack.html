<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Stack</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}h1{font-size:1.3rem;font-weight:800;margin-bottom:6px}.sc{font-size:1.5rem;font-weight:800;margin-bottom:8px;color:#a5b4fc}canvas{border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.4);max-width:96vw}.hint{margin-top:8px;color:#64748b;font-size:.75rem}</style></head><body>
<h1>STACK</h1><div class="sc" id="sc">0</div><canvas id="c" width="360" height="520"></canvas><p class="hint">Klik / Space = polozit</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");const W=360,H=520;
let stack=[],cur,dir=1,score=0,run=false,speed=3.2;
function hue(i){return `hsl(${(i*28)%360},80%,60%)`}
function reset(){stack=[{x:W/2-50,w:100,y:H-40}];cur={x:0,w:100,y:H-80};dir=1;score=0;speed=3.2;run=true;document.getElementById("sc").textContent=0}
function place(){if(!run){reset();return}const prev=stack[stack.length-1];const left=Math.max(cur.x,prev.x);const right=Math.min(cur.x+cur.w,prev.x+prev.w);const w=right-left;if(w<8){run=false;return}stack.push({x:left,w,y:cur.y});score++;document.getElementById("sc").textContent=score;speed=Math.min(7,3.2+score*0.08);cur={x:dir>0?-cur.w:W,w,y:cur.y-40};dir*=-1;if(cur.y<120){const d=120-cur.y;stack.forEach(s=>s.y+=d);cur.y+=d}}
function tick(){if(run){cur.x+=dir*speed;if(cur.x+cur.w>W+20||cur.x<-20)dir*=-1}const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1e1b4b");g.addColorStop(1,"#0f172a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);stack.forEach((s,i)=>{ctx.fillStyle=hue(i);ctx.beginPath();ctx.roundRect(s.x,s.y,s.w,36,6);ctx.fill();ctx.fillStyle="rgba(255,255,255,.2)";ctx.fillRect(s.x+4,s.y+3,s.w-8,6)});if(run){ctx.fillStyle=hue(stack.length);ctx.globalAlpha=.9;ctx.beginPath();ctx.roundRect(cur.x,cur.y,cur.w,36,6);ctx.fill();ctx.globalAlpha=1}else{ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 24px system-ui";ctx.textAlign="center";ctx.fillText(score?"Game Over":"Klikni pro start",W/2,H/2);if(score){ctx.font="16px system-ui";ctx.fillText("Score "+score,W/2,H/2+28)}}requestAnimationFrame(tick)}
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();place()}});canvas.addEventListener("pointerdown",place);requestAnimationFrame(tick);
</script></body></html>
