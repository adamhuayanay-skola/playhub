<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Stack Ball</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none}
h1{font-size:1.2rem;margin-bottom:.3rem;font-weight:800;background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.score{color:#94a3b8;margin-bottom:.5rem}canvas{border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);max-width:100%;touch-action:none}
.hint{margin-top:.6rem;font-size:.8rem;color:#64748b}.overlay{position:absolute;inset:0;background:rgba(15,23,42,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;border-radius:12px}
.overlay button{padding:.7rem 2rem;background:linear-gradient(135deg,#f59e0b,#ef4444);border:none;border-radius:999px;color:#fff;font-weight:700;cursor:pointer}.wrap{position:relative}
</style></head><body>
<h1>Stack Ball</h1><div class="score">Skore: <strong id="sc">0</strong></div>
<div class="wrap"><canvas id="c" width="360" height="520"></canvas>
<div class="overlay" id="ov"><div id="msg">Klik = pust micek</div><button id="btn">Hrat</button></div></div>
<p class="hint">Propadni skrz diry</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc"),ov=document.getElementById("ov"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
const params=new URLSearchParams(location.search);const diff=params.get("diff")||"mid";
const FALL={easy:3,mid:4.5,hard:6.5};let ball={x:180,y:80,r:14,vy:0},platforms=[],score=0,running=false;
const colors=["#ef4444","#f59e0b","#22c55e","#3b82f6","#a855f7"];
function makePlat(y){const segs=6,gap=Math.floor(Math.random()*segs);return{y,segs,gap,rot:Math.random()*Math.PI*2}}
function reset(){ball={x:180,y:80,r:14,vy:0};platforms=[];score=0;scEl.textContent=0;for(let i=0;i<8;i++)platforms.push(makePlat(160+i*70))}
function tick(){if(!running)return;ball.vy+=.25;ball.y+=ball.vy;platforms.forEach(p=>{p.y-=1.2;p.rot+=.015});
if(platforms[0]&&platforms[0].y<-40){platforms.shift();platforms.push(makePlat(platforms[platforms.length-1].y+70));score++;scEl.textContent=score}
for(const p of platforms){const dy=Math.abs(ball.y-p.y);if(dy<ball.r+6&&dy>ball.r-8){const ang=((Math.atan2(0,1)+p.rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);const segAng=(Math.PI*2)/p.segs;const seg=Math.floor(ang/segAng);if(seg!==p.gap&&ball.vy>0){ball.vy=-8;ball.y=p.y-ball.r-2}}}
if(ball.y>560){running=false;msg.textContent="Game Over! "+score;btn.textContent="Znovu";ov.style.display="flex";return}
if(ball.y<20)ball.y=20;draw();requestAnimationFrame(tick)}
function draw(){const g=ctx.createLinearGradient(0,0,0,520);g.addColorStop(0,"#0f172a");g.addColorStop(1,"#1e1b4b");ctx.fillStyle=g;ctx.fillRect(0,0,360,520);
platforms.forEach(p=>{const cx=180,cy=p.y,R=90,r=55;for(let i=0;i<p.segs;i++){if(i===p.gap)continue;const a0=p.rot+i*(Math.PI*2)/p.segs,a1=a0+(Math.PI*2)/p.segs;ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.arc(cx,cy,r,a1,a0,true);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill()}});
ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle="#fbbf24";ctx.fill()}
btn.onclick=()=>{ov.style.display="none";reset();running=true;ball.vy=FALL[diff]||4.5;tick()};
canvas.addEventListener("pointerdown",()=>{if(running)ball.vy=Math.max(ball.vy,FALL[diff]||4.5)});
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();if(running)ball.vy=Math.max(ball.vy,FALL[diff]||4.5)}});draw();
</script></body></html>
