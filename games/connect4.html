<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Connect 4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1e3a5f,#0f172a);font-family:system-ui,sans-serif;color:#fff;user-select:none;
}
h1{font-weight:800;margin-bottom:6px;font-size:1.4rem}
#st{margin-bottom:12px;font-weight:700;min-height:28px;font-size:1.15rem}
canvas{border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.45);max-width:96vw;cursor:pointer;touch-action:none}
button.rst{margin-top:14px;padding:12px 24px;border:none;border-radius:12px;font-weight:800;cursor:pointer;background:#fff;color:#1e3a5f;font-size:1rem}
.hint{margin-top:10px;color:#93c5fd;font-size:.8rem}
.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.65);z-index:50;padding:16px;
}
.overlay.show{display:flex}
.overlay-box{
  background:#fff;color:#0f172a;border-radius:24px;padding:36px 28px;text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,.5);width:min(360px,100%);
  animation:pop .35s ease;
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.overlay-box h2{
  font-size:clamp(1.8rem,7vw,2.6rem);font-weight:900;line-height:1.15;margin-bottom:10px;
  letter-spacing:-.03em;
}
.overlay-box.red h2{color:#dc2626;text-shadow:0 2px 0 #fecaca}
.overlay-box.yellow h2{color:#ca8a04;text-shadow:0 2px 0 #fef08a}
.overlay-box.draw h2{color:#334155}
.overlay-box p{color:#64748b;margin-bottom:20px;font-size:1rem}
.overlay-box button{
  border:none;background:#1d4ed8;color:#fff;font-weight:800;padding:14px 28px;
  border-radius:14px;cursor:pointer;font-size:1.05rem;
}
</style></head><body>
<h1>Connect 4</h1>
<div id="st">Hraje: Cervena</div>
<canvas id="c" width="420" height="380"></canvas>
<button class="rst" id="rst">Nova hra</button>
<p class="hint">Klikni na sloupec</p>
<div class="overlay" id="ov">
  <div class="overlay-box" id="ovBox">
    <h2 id="ovTitle">Vyhra</h2>
    <p id="ovText"></p>
    <button type="button" id="ovBtn">Hrat znovu</button>
  </div>
</div>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const R=6,C=7,GAP=8;
const cell=Math.floor((420-32-GAP*(C-1))/C);
const boardH=R*cell+(R-1)*GAP,boardW=C*cell+(C-1)*GAP;
const ox=(420-boardW)/2,oy=(380-boardH)/2;
let grid=Array.from({length:R},function(){return Array(C).fill(0);});
let turn=1,over=false,busy=false,anim=null,hoverCol=-1;
const st=document.getElementById("st");
const ov=document.getElementById("ov"),ovBox=document.getElementById("ovBox");
const ovTitle=document.getElementById("ovTitle"),ovText=document.getElementById("ovText");
function colX(c){return ox+c*(cell+GAP);}function rowY(r){return oy+r*(cell+GAP);}
function showWin(color){
  over=true;
  if(color===0){
    ovBox.className="overlay-box draw";
    ovTitle.textContent="Remiza!";
    ovText.textContent="Deska je plna";
    st.textContent="Remiza";
  }else if(color===1){
    ovBox.className="overlay-box red";
    ovTitle.textContent="Cervena vyhrala!";
    ovText.textContent="4 v rade pro cervene";
    st.textContent="Cervena vyhrala!";
  }else{
    ovBox.className="overlay-box yellow";
    ovTitle.textContent="Zluta vyhrala!";
    ovText.textContent="4 v rade pro zlute";
    st.textContent="Zluta vyhrala!";
  }
  ov.classList.add("show");
}
function drop(col){
  if(over||busy)return;
  for(var r=R-1;r>=0;r--){
    if(grid[r][col]===0){
      busy=true;
      anim={col:col,row:r,color:turn,y:oy-cell-10,targetY:rowY(r),vy:0};
      return;
    }
  }
}
function finishDrop(){
  if(!anim)return;
  grid[anim.row][anim.col]=anim.color;
  var r=anim.row,c=anim.col,color=anim.color;
  anim=null;busy=false;
  if(win(r,c)){showWin(color);return;}
  if(grid.every(function(row){return row.every(function(v){return v!==0;});})){showWin(0);return;}
  turn=turn===1?2:1;
  st.textContent="Hraje: "+(turn===1?"Cervena":"Zluta");
}
function win(r,c){
  var t=grid[r][c];
  function cnt(dr,dc){var n=0,rr=r+dr,cc=c+dc;while(rr>=0&&rr<R&&cc>=0&&cc<C&&grid[rr][cc]===t){n++;rr+=dr;cc+=dc;}return n;}
  return [[0,1],[1,0],[1,1],[1,-1]].some(function(d){return 1+cnt(d[0],d[1])+cnt(-d[0],-d[1])>=4;});
}
function drawDisc(x,y,color,scale){
  scale=scale||1;var rad=(cell/2-3)*scale,cx=x+cell/2,cy=y+cell/2;
  ctx.beginPath();ctx.arc(cx+2,cy+3,rad,0,Math.PI*2);ctx.fillStyle="rgba(0,0,0,.25)";ctx.fill();
  var g=ctx.createRadialGradient(cx-rad*0.3,cy-rad*0.3,2,cx,cy,rad);
  if(color===1){g.addColorStop(0,"#fca5a5");g.addColorStop(0.5,"#ef4444");g.addColorStop(1,"#b91c1c");}
  else if(color===2){g.addColorStop(0,"#fde68a");g.addColorStop(0.5,"#eab308");g.addColorStop(1,"#a16207");}
  else{g.addColorStop(0,"#1e293b");g.addColorStop(1,"#020617");}
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  if(color){ctx.beginPath();ctx.ellipse(cx-rad*0.25,cy-rad*0.3,rad*0.35,rad*0.2,-0.4,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.35)";ctx.fill();}
}
function loop(){
  if(anim){
    anim.vy+=0.85;anim.y+=anim.vy;
    if(anim.y>=anim.targetY){anim.y=anim.targetY;if(anim.vy>3)anim.vy*=-0.28;else finishDrop();}
  }
  ctx.clearRect(0,0,420,380);
  roundRect(ctx,ox-12,oy-12,boardW+24,boardH+24,16);ctx.fillStyle="#1d4ed8";ctx.fill();
  roundRect(ctx,ox-8,oy-8,boardW+16,boardH+16,14);ctx.fillStyle="#2563eb";ctx.fill();
  for(var r=0;r<R;r++)for(var c=0;c<C;c++){
    var x=colX(c),y=rowY(r);
    ctx.beginPath();ctx.arc(x+cell/2,y+cell/2,cell/2-2,0,Math.PI*2);ctx.fillStyle="#0f172a";ctx.fill();
    if(grid[r][c])drawDisc(x,y,grid[r][c]);
  }
  if(!busy&&!over&&hoverCol>=0&&hoverCol<C){
    var free=-1;for(var r=R-1;r>=0;r--)if(grid[r][hoverCol]===0){free=r;break;}
    if(free>=0){ctx.globalAlpha=0.35;drawDisc(colX(hoverCol),rowY(free),turn);ctx.globalAlpha=1;drawDisc(colX(hoverCol),oy-cell-4,turn,0.7);}
  }
  if(anim)drawDisc(colX(anim.col),anim.y,anim.color);
  requestAnimationFrame(loop);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function colFromEvent(e){var rect=cv.getBoundingClientRect();var x=(e.clientX-rect.left)*(cv.width/rect.width);for(var c=0;c<C;c++){var cx=colX(c);if(x>=cx&&x<=cx+cell)return c;}return Math.max(0,Math.min(C-1,Math.floor((x-ox)/(cell+GAP))));}
function reset(){grid=Array.from({length:R},function(){return Array(C).fill(0);});turn=1;over=false;busy=false;anim=null;st.textContent="Hraje: Cervena";ov.classList.remove("show");}
cv.addEventListener("pointermove",function(e){hoverCol=colFromEvent(e);});
cv.addEventListener("pointerleave",function(){hoverCol=-1;});
cv.addEventListener("pointerdown",function(e){drop(colFromEvent(e));});
document.getElementById("rst").onclick=reset;
document.getElementById("ovBtn").onclick=reset;
requestAnimationFrame(loop);
})();
</script></body></html>
