<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Connect 4</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e3a5f;font-family:system-ui,sans-serif;color:#fff;user-select:none}
h1{font-weight:800;margin-bottom:8px}#st{margin-bottom:12px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(7,48px);gap:8px;background:#1d4ed8;padding:12px;border-radius:16px}
.cell{width:48px;height:48px;border-radius:50%;background:#0f172a;border:none;cursor:pointer}.cell.r{background:#ef4444}.cell.y{background:#eab308}
button.rst{margin-top:14px;padding:10px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body>
<h1>Connect 4</h1><div id="st">Hraje: Cerveny</div><div class="board" id="board"></div><button class="rst" id="rst">Nova hra</button>
<script>
(function(){
const R=6,C=7;let g=Array.from({length:R},function(){return Array(C).fill(0);}),turn=1,over=false;
const board=document.getElementById("board"),st=document.getElementById("st");
function render(){board.innerHTML="";for(var r=0;r<R;r++)for(var c=0;c<C;c++){var b=document.createElement("button");b.className="cell"+(g[r][c]===1?" r":g[r][c]===2?" y":"");b.onclick=(function(col){return function(){drop(col);};})(c);board.appendChild(b);}}
function drop(col){if(over)return;for(var r=R-1;r>=0;r--){if(g[r][col]===0){g[r][col]=turn;if(win(r,col)){over=true;st.textContent=(turn===1?"Cerveny":"Zluty")+" vyhral!";render();return;}turn=turn===1?2:1;st.textContent="Hraje: "+(turn===1?"Cerveny":"Zluty");render();return;}}}
function win(r,c){var t=g[r][c];function cnt(dr,dc){var n=0,rr=r+dr,cc=c+dc;while(rr>=0&&rr<R&&cc>=0&&cc<C&&g[rr][cc]===t){n++;rr+=dr;cc+=dc;}return n;}return [[0,1],[1,0],[1,1],[1,-1]].some(function(d){return 1+cnt(d[0],d[1])+cnt(-d[0],-d[1])>=4;});}
function reset(){g=Array.from({length:R},function(){return Array(C).fill(0);});turn=1;over=false;st.textContent="Hraje: Cerveny";render();}
document.getElementById("rst").onclick=reset;render();
})();</script></body></html>
