<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Connect 4</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#1e3a5f;color:#fff}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#leave{
  position:fixed;top:12px;left:12px;width:52px;height:52px;z-index:9999;
  border:3px solid #fff;border-radius:14px;background:#ef4444;color:#fff;
  font-size:32px;font-weight:900;cursor:pointer;line-height:1;
}
h1{margin:0 0 8px}
#st{margin:0 0 12px;font-weight:700;font-size:18px}
#board{
  display:grid;grid-template-columns:repeat(7,48px);gap:8px;
  background:#1d4ed8;padding:12px;border-radius:16px;
}
.cell{
  width:48px;height:48px;border-radius:50%;border:none;background:#0f172a;cursor:pointer;
}
.cell.r{background:#ef4444}
.cell.y{background:#eab308}
#rst{margin-top:14px;padding:12px 20px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
#mask{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:5000;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#mask.hide{display:none}
.box{background:#fff;color:#111;border-radius:18px;padding:24px;width:min(320px,100%);text-align:center}
.box h2{margin:0 0 10px;font-size:28px}
.box button{
  display:block;width:100%;margin:10px 0 0;padding:14px;border:none;border-radius:12px;
  font-size:16px;font-weight:800;cursor:pointer;
}
#bf{background:#e2e8f0;color:#111}
#bb{background:#7c3aed;color:#fff}
#ba{background:#1d4ed8;color:#fff}
#bm{background:#e2e8f0;color:#111}
.winRed h2{color:#dc2626}
.winYel h2{color:#ca8a04}
</style>
</head>
<body>
<button type="button" id="leave">&times;</button>
<h1>Connect 4</h1>
<div id="st">Vyber rezim</div>
<div id="board"></div>
<button type="button" id="rst">Nova hra</button>

<div id="mask">
  <div class="box" id="box">
    <h2 id="mt">Jak chces hrat?</h2>
    <p id="mp">Vyber souperu</p>
    <button type="button" id="bf">Proti kamaradovi</button>
    <button type="button" id="bb">Proti botovi</button>
    <button type="button" id="ba" style="display:none">Hrat znovu</button>
    <button type="button" id="bm" style="display:none">Zmenit rezim</button>
  </div>
</div>

<script>
(function(){
var ROWS=6,COLS=7;
var grid=[],turn=1,over=false,vsBot=false,started=false,busy=false;
var board=document.getElementById("board");
var st=document.getElementById("st");
var mask=document.getElementById("mask");
var box=document.getElementById("box");
var mt=document.getElementById("mt");
var mp=document.getElementById("mp");

document.getElementById("leave").onclick=function(){
  window.location.href="../index.html";
};

function empty(){
  var g=[],r,c;
  for(r=0;r<ROWS;r++){g[r]=[];for(c=0;c<COLS;c++)g[r][c]=0;}
  return g;
}
function render(){
  board.innerHTML="";
  var r,c,btn;
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++){
      btn=document.createElement("button");
      btn.type="button";
      btn.className="cell"+(grid[r][c]===1?" r":grid[r][c]===2?" y":"");
      btn.setAttribute("data-col",String(c));
      btn.onclick=onCell;
      board.appendChild(btn);
    }
  }
}
function onCell(e){
  if(!started||over||busy)return;
  if(vsBot&&turn===2)return;
  var col=parseInt(e.currentTarget.getAttribute("data-col"),10);
  playCol(col);
}
function playCol(col){
  if(over||busy)return;
  var r;
  for(r=ROWS-1;r>=0;r--){
    if(grid[r][col]===0){
      grid[r][col]=turn;
      render();
      if(win(r,col)){endWin(turn);return;}
      if(full()){endDraw();return;}
      turn=turn===1?2:1;
      if(vsBot){
        st.textContent=turn===1?"Ty (cervena)":"Bot mysli...";
        if(turn===2){
          busy=true;
          setTimeout(botTurn,350);
        }
      }else{
        st.textContent="Hraje: "+(turn===1?"Cervena":"Zluta");
      }
      return;
    }
  }
}
function full(){
  var c;for(c=0;c<COLS;c++)if(grid[0][c]===0)return false;return true;
}
function win(r,c){
  var t=grid[r][c];
  function cnt(dr,dc){
    var n=0,rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===t){n++;rr+=dr;cc+=dc;}
    return n;
  }
  var d=[[0,1],[1,0],[1,1],[1,-1]],i;
  for(i=0;i<4;i++)if(1+cnt(d[i][0],d[i][1])+cnt(-d[i][0],-d[i][1])>=4)return true;
  return false;
}
function endWin(color){
  over=true;busy=false;
  box.className="box "+(color===1?"winRed":"winYel");
  mt.textContent=color===1?"Cervena vyhrala!":"Zluta vyhrala!";
  mp.textContent=vsBot?(color===1?"Vyhral jsi!":"Bot vyhral"):"4 v rade";
  st.textContent=mt.textContent;
  showEnd();
}
function endDraw(){
  over=true;busy=false;
  box.className="box";
  mt.textContent="Remiza!";
  mp.textContent="Deska je plna";
  st.textContent="Remiza";
  showEnd();
}
function showEnd(){
  document.getElementById("bf").style.display="none";
  document.getElementById("bb").style.display="none";
  document.getElementById("ba").style.display="block";
  document.getElementById("bm").style.display="block";
  mask.className="";
}
function showMode(){
  started=false;over=false;busy=false;
  box.className="box";
  mt.textContent="Jak chces hrat?";
  mp.textContent="Vyber souperu";
  document.getElementById("bf").style.display="block";
  document.getElementById("bb").style.display="block";
  document.getElementById("ba").style.display="none";
  document.getElementById("bm").style.display="none";
  mask.className="";
  st.textContent="Vyber rezim";
}
function start(bot){
  vsBot=bot?true:false;
  started=true;over=false;busy=false;turn=1;
  grid=empty();
  render();
  mask.className="hide";
  st.textContent=vsBot?"Ty (cervena) vs Bot":"Hraje: Cervena";
}
function botTurn(){
  busy=false;
  if(over||!vsBot)return;
  var moves=[],c,r,i,best=[],score,pick;
  for(c=0;c<COLS;c++)if(grid[0][c]===0)moves.push(c);
  if(!moves.length)return;
  // win
  for(i=0;i<moves.length;i++){
    c=moves[i];
    for(r=ROWS-1;r>=0;r--)if(grid[r][c]===0)break;
    grid[r][c]=2;if(win(r,c)){grid[r][c]=0;playCol(c);return;}grid[r][c]=0;
  }
  // block
  for(i=0;i<moves.length;i++){
    c=moves[i];
    for(r=ROWS-1;r>=0;r--)if(grid[r][c]===0)break;
    grid[r][c]=1;if(win(r,c)){grid[r][c]=0;playCol(c);return;}grid[r][c]=0;
  }
  // prefer center-ish with randomness
  for(i=0;i<moves.length;i++){
    c=moves[i];score=10-Math.abs(c-3)*2+Math.random()*3;
    best.push({c:c,s:score});
  }
  best.sort(function(a,b){return b.s-a.s;});
  pick=best[Math.random()<0.25&&best.length>1?1:0].c;
  playCol(pick);
}

document.getElementById("bf").onclick=function(){start(false);};
document.getElementById("bb").onclick=function(){start(true);};
document.getElementById("ba").onclick=function(){start(vsBot);};
document.getElementById("bm").onclick=function(){showMode();};
document.getElementById("rst").onclick=function(){
  if(started)start(vsBot);else showMode();
};

grid=empty();
render();
showMode();
})();
</script>
</body>
</html>
