<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Connect 4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e3a5f;font-family:system-ui,sans-serif;color:#fff;user-select:none}
#leave{position:fixed;top:12px;left:12px;z-index:300;width:48px;height:48px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
h1{font-size:1.4rem;font-weight:800;margin-bottom:8px}
#st{margin-bottom:14px;font-weight:600;min-height:24px}
.board{display:grid;grid-template-columns:repeat(7,46px);gap:8px;background:#1d4ed8;padding:12px;border-radius:16px}
.cell{width:46px;height:46px;border-radius:50%;border:none;background:#0f172a;cursor:pointer}
.cell.r{background:#ef4444}.cell.y{background:#eab308}
#rst{margin-top:16px;padding:10px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:16px}
.modal[hidden]{display:none!important}
.panel{background:#fff;color:#0f172a;border-radius:20px;padding:28px 22px;width:min(340px,100%);text-align:center}
.panel h2{font-size:1.7rem;font-weight:900;margin-bottom:8px}
.panel.red h2{color:#dc2626}.panel.yellow h2{color:#ca8a04}.panel.draw h2{color:#475569}
.panel p{color:#64748b;margin-bottom:14px}
.panel button{display:block;width:100%;margin:8px 0;padding:14px;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-size:1rem}
.btn-blue{background:#1d4ed8;color:#fff}.btn-gray{background:#e2e8f0;color:#0f172a}.btn-purple{background:#7c3aed;color:#fff}

/* visual polish – no gameplay changes */
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;
}
#leave,.leave-btn,button#leave{
  position:fixed!important;top:12px!important;left:12px!important;z-index:9999!important;
  width:48px!important;height:48px!important;border:none!important;border-radius:14px!important;
  background:linear-gradient(145deg,#f87171,#dc2626)!important;color:#fff!important;
  font-size:28px!important;font-weight:900!important;cursor:pointer!important;
  box-shadow:0 6px 20px rgba(220,38,38,.45)!important;line-height:1!important;
}
#leave:active,.leave-btn:active,button#leave:active{transform:scale(.94)}
canvas{
  border-radius:14px!important;
  box-shadow:0 16px 40px rgba(0,0,0,.35)!important;
}
h1{
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

</style></head><body>
<button type="button" id="leave">&times;</button>
<h1>Connect 4</h1>
<div id="st">Vyber rezim</div>
<div class="board" id="board"></div>
<button type="button" id="rst">Nova hra</button>

<div class="modal" id="modeModal">
  <div class="panel">
    <h2>Jak chces hrat?</h2>
    <p>Vyber souperu</p>
    <button type="button" class="btn-gray" id="btnFriend">Proti kamaradovi</button>
    <button type="button" class="btn-purple" id="btnBot">Proti botovi</button>
  </div>
</div>

<div class="modal" id="winModal" hidden>
  <div class="panel" id="winPanel">
    <h2 id="winTitle">Vyhra</h2>
    <p id="winText"></p>
    <button type="button" class="btn-blue" id="btnAgain">Hrat znovu</button>
    <button type="button" class="btn-gray" id="btnMode">Zmenit rezim</button>
  </div>
</div>

<script>
(function(){
var ROWS=6,COLS=7;
var boardEl=document.getElementById("board");
var st=document.getElementById("st");
var grid=[],turn=1,over=false,vsBot=false,started=false;

document.getElementById("leave").onclick=function(){
  window.location.href="../index.html";
};

function emptyGrid(){
  var g=[],r,c;
  for(r=0;r<ROWS;r++){g[r]=[];for(c=0;c<COLS;c++)g[r][c]=0;}
  return g;
}
function render(){
  boardEl.innerHTML="";
  var r,c,btn;
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++){
      btn=document.createElement("button");
      btn.type="button";
      btn.className="cell"+(grid[r][c]===1?" r":(grid[r][c]===2?" y":""));
      (function(col){
        btn.onclick=function(){
          if(!started||over)return;
          if(vsBot&&turn!==1)return;
          drop(col);
        };
      })(c);
      boardEl.appendChild(btn);
    }
  }
}
function drop(col){
  if(over)return;
  var r;
  for(r=ROWS-1;r>=0;r--){
    if(grid[r][col]===0){
      grid[r][col]=turn;
      render();
      if(checkWin(r,col)){endGame(turn);return;}
      if(isFull()){endGame(0);return;}
      turn=turn===1?2:1;
      if(vsBot){
        st.textContent=turn===1?"Ty (cervena)":"Bot tahne...";
        if(turn===2)setTimeout(botMove,300);
      }else{
        st.textContent="Hraje: "+(turn===1?"Cervena":"Zluta");
      }
      return;
    }
  }
}
function isFull(){
  var c;for(c=0;c<COLS;c++)if(grid[0][c]===0)return false;return true;
}
function checkWin(r,c){
  var t=grid[r][c];
  function cnt(dr,dc){
    var n=0,rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===t){n++;rr+=dr;cc+=dc;}
    return n;
  }
  var dirs=[[0,1],[1,0],[1,1],[1,-1]],i;
  for(i=0;i<4;i++){
    if(1+cnt(dirs[i][0],dirs[i][1])+cnt(-dirs[i][0],-dirs[i][1])>=4)return true;
  }
  return false;
}
function endGame(color){
  over=true;
  var panel=document.getElementById("winPanel");
  var title=document.getElementById("winTitle");
  var text=document.getElementById("winText");
  if(color===0){
    panel.className="panel draw";
    title.textContent="Remiza!";
    text.textContent="Deska je plna";
  }else if(color===1){
    panel.className="panel red";
    title.textContent="Cervena vyhrala!";
    text.textContent=vsBot?"Vyhral jsi!":"4 v rade";
  }else{
    panel.className="panel yellow";
    title.textContent="Zluta vyhrala!";
    text.textContent=vsBot?"Bot vyhral":"4 v rade";
  }
  st.textContent=title.textContent;
  document.getElementById("winModal").hidden=false;
}
function openCols(){
  var a=[],c;for(c=0;c<COLS;c++)if(grid[0][c]===0)a.push(c);return a;
}
function botMove(){
  if(over||!vsBot||turn!==2)return;
  var cols=openCols(),i,c,r,pick;
  if(!cols.length)return;
  // win now
  for(i=0;i<cols.length;i++){
    c=cols[i];
    for(r=ROWS-1;r>=0;r--)if(grid[r][c]===0)break;
    grid[r][c]=2;
    if(checkWin(r,c)){grid[r][c]=0;drop(c);return;}
    grid[r][c]=0;
  }
  // block X
  for(i=0;i<cols.length;i++){
    c=cols[i];
    for(r=ROWS-1;r>=0;r--)if(grid[r][c]===0)break;
    grid[r][c]=1;
    if(checkWin(r,c)){grid[r][c]=0;drop(c);return;}
    grid[r][c]=0;
  }
  // random preference toward center
  cols.sort(function(a,b){return Math.abs(a-3)-Math.abs(b-3);});
  if(Math.random()<0.3&&cols.length>1)pick=cols[1+Math.floor(Math.random()*(cols.length-1))];
  else pick=cols[0];
  drop(pick);
}
function start(bot){
  vsBot=!!bot;
  started=true;
  over=false;
  turn=1;
  grid=emptyGrid();
  document.getElementById("modeModal").hidden=true;
  document.getElementById("winModal").hidden=true;
  st.textContent=vsBot?"Ty (cervena)":"Hraje: Cervena";
  render();
}
document.getElementById("btnFriend").onclick=function(){start(false);};
document.getElementById("btnBot").onclick=function(){start(true);};
document.getElementById("btnAgain").onclick=function(){start(vsBot);};
document.getElementById("btnMode").onclick=function(){
  document.getElementById("winModal").hidden=true;
  document.getElementById("modeModal").hidden=false;
  started=false;
  st.textContent="Vyber rezim";
};
document.getElementById("rst").onclick=function(){
  if(started)start(vsBot);
  else document.getElementById("modeModal").hidden=false;
};
grid=emptyGrid();
render();
})();
</script>
</body></html>
