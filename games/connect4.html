<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Connect 4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e3a5f;font-family:system-ui,sans-serif;color:#fff;user-select:none}
h1{font-size:1.4rem;font-weight:800;margin-bottom:8px}
.status{margin-bottom:12px;font-weight:700;min-height:24px}
.board{display:grid;grid-template-columns:repeat(7,52px);gap:8px;background:#1d4ed8;padding:14px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.cell{width:52px;height:52px;border-radius:50%;background:#0f172a;cursor:pointer;border:none;transition:transform .1s}
.cell:hover{transform:scale(1.05)}
.cell.r{background:#ef4444}
.cell.y{background:#eab308}
.hint{margin-top:12px;color:#93c5fd;font-size:.8rem}
button.reset{margin-top:14px;padding:10px 20px;border:none;border-radius:10px;background:#fff;color:#1e3a5f;font-weight:700;cursor:pointer}
</style></head><body>
<h1>Connect 4</h1>
<div class="status" id="st">Hraje: Cerveny</div>
<div class="board" id="board"></div>
<button class="reset" id="rst">Nova hra</button>
<p class="hint">Klikni na sloupec · 4 v rade vyhrava</p>
<script>
(function(){
const ROWS=6,COLS=7;
let grid=Array.from({length:ROWS},function(){return Array(COLS).fill(0);});
let turn=1,over=false; // 1 red 2 yellow
const board=document.getElementById("board");
const st=document.getElementById("st");
function render(){
  board.innerHTML="";
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var b=document.createElement("button");
    b.className="cell"+(grid[r][c]===1?" r":grid[r][c]===2?" y":"");
    b.dataset.col=c;
    b.onclick=function(){drop(+this.dataset.col);};
    board.appendChild(b);
  }
}
function drop(col){
  if(over)return;
  for(var r=ROWS-1;r>=0;r--){
    if(grid[r][col]===0){
      grid[r][col]=turn;
      if(win(r,col)){over=true;st.textContent=(turn===1?"Cerveny":"Zluty")+" vyhral!";render();return;}
      if(grid.every(function(row){return row.every(function(v){return v!==0;});})){over=true;st.textContent="Remiza";render();return;}
      turn=turn===1?2:1;
      st.textContent="Hraje: "+(turn===1?"Cerveny":"Zluty");
      render();return;
    }
  }
}
function win(r,c){
  var t=grid[r][c];
  function count(dr,dc){
    var n=0,rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===t){n++;rr+=dr;cc+=dc;}
    return n;
  }
  return [[0,1],[1,0],[1,1],[1,-1]].some(function(d){return 1+count(d[0],d[1])+count(-d[0],-d[1])>=4;});
}
function reset(){grid=Array.from({length:ROWS},function(){return Array(COLS).fill(0);});turn=1;over=false;st.textContent="Hraje: Cerveny";render();}
document.getElementById("rst").onclick=reset;
render();
})();
</script></body></html>
