<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Connect 4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1e3a5f,#0f172a);font-family:system-ui,sans-serif;color:#fff;user-select:none;
}
h1{font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
#st{margin-bottom:12px;font-weight:700;min-height:24px}
canvas{border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.45);max-width:96vw;cursor:pointer;touch-action:none}
button.rst{
  margin-top:14px;padding:10px 22px;border:none;border-radius:12px;font-weight:700;cursor:pointer;
  background:#fff;color:#1e3a5f;
}
.hint{margin-top:10px;color:#93c5fd;font-size:.8rem}
</style></head><body>
<h1>Connect 4</h1>
<div id="st">Hraje: Cerveny</div>
<canvas id="c" width="420" height="380"></canvas>
<button class="rst" id="rst">Nova hra</button>
<p class="hint">Klikni na sloupec</p>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const R=6,C=7,PAD=16,GAP=8;
const cell=Math.floor((420-PAD*2-GAP*(C-1))/C);
const boardH=R*cell+(R-1)*GAP;
const boardW=C*cell+(C-1)*GAP;
const ox=(420-boardW)/2, oy=(380-boardH)/2;

let grid=Array.from({length:R},function(){return Array(C).fill(0);});
let turn=1, over=false, busy=false;
let anim=null; // {col,row,color,y,targetY,vy}
let hoverCol=-1;
const st=document.getElementById("st");

function colX(c){return ox+c*(cell+GAP);}
function rowY(r){return oy+r*(cell+GAP);}

function drop(col){
  if(over||busy)return;
  for(var r=R-1;r>=0;r--){
    if(grid[r][col]===0){
      busy=true;
      var color=turn;
      anim={
        col:col, row:r, color:color,
        y: oy - cell - 10,
        targetY: rowY(r),
        vy: 0
      };
      return;
    }
  }
}

function finishDrop(){
  if(!anim)return;
  grid[anim.row][anim.col]=anim.color;
  var r=anim.row,c=anim.col,color=anim.color;
  anim=null;busy=false;
  if(win(r,c)){
    over=true;
    st.textContent=(color===1?"Cerveny":"Zluty")+" vyhral!";
    return;
  }
  if(grid.every(function(row){return row.every(function(v){return v!==0;});})){
    over=true;st.textContent="Remiza";return;
  }
  turn=turn===1?2:1;
  st.textContent="Hraje: "+(turn===1?"Cerveny":"Zluty");
}

function win(r,c){
  var t=grid[r][c];
  function cnt(dr,dc){
    var n=0,rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<R&&cc>=0&&cc<C&&grid[rr][cc]===t){n++;rr+=dr;cc+=dc;}
    return n;
  }
  return [[0,1],[1,0],[1,1],[1,-1]].some(function(d){
    return 1+cnt(d[0],d[1])+cnt(-d[0],-d[1])>=4;
  });
}

function drawDisc(x,y,color,scale){
  scale=scale||1;
  var rad=(cell/2-3)*scale;
  var cx=x+cell/2, cy=y+cell/2;
  // shadow
  ctx.beginPath();
  ctx.arc(cx+2,cy+3,rad,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.fill();
  // body
  var g=ctx.createRadialGradient(cx-rad*0.3,cy-rad*0.3,2,cx,cy,rad);
  if(color===1){g.addColorStop(0,"#fca5a5");g.addColorStop(0.5,"#ef4444");g.addColorStop(1,"#b91c1c");}
  else if(color===2){g.addColorStop(0,"#fde68a");g.addColorStop(0.5,"#eab308");g.addColorStop(1,"#a16207");}
  else{g.addColorStop(0,"#1e293b");g.addColorStop(1,"#020617");}
  ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  // gloss
  if(color){
    ctx.beginPath();
    ctx.ellipse(cx-rad*0.25,cy-rad*0.3,rad*0.35,rad*0.2, -0.4,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,.35)";ctx.fill();
  }
}

function loop(){
  // physics for falling piece
  if(anim){
    anim.vy+=0.85;
    anim.y+=anim.vy;
    if(anim.y>=anim.targetY){
      anim.y=anim.targetY;
      // bounce once
      if(anim.vy>3){anim.vy*=-0.28;}
      else{finishDrop();}
    }
  }

  // bg
  ctx.clearRect(0,0,420,380);
  // board plate
  roundRect(ctx,ox-12,oy-12,boardW+24,boardH+24,16);
  ctx.fillStyle="#1d4ed8";ctx.fill();
  roundRect(ctx,ox-8,oy-8,boardW+16,boardH+16,14);
  ctx.fillStyle="#2563eb";ctx.fill();

  // empty holes + placed discs
  for(var r=0;r<R;r++){
    for(var c=0;c<C;c++){
      var x=colX(c), y=rowY(r);
      // hole
      ctx.beginPath();
      ctx.arc(x+cell/2,y+cell/2,cell/2-2,0,Math.PI*2);
      ctx.fillStyle="#0f172a";ctx.fill();
      if(grid[r][c]) drawDisc(x,y,grid[r][c]);
    }
  }

  // hover preview
  if(!busy&&!over&&hoverCol>=0&&hoverCol<C){
    var free=-1;
    for(var r=R-1;r>=0;r--)if(grid[r][hoverCol]===0){free=r;break;}
    if(free>=0){
      ctx.globalAlpha=0.35;
      drawDisc(colX(hoverCol), rowY(free), turn);
      ctx.globalAlpha=1;
      // top indicator
      drawDisc(colX(hoverCol), oy-cell-4, turn, 0.7);
    }
  }

  // falling disc
  if(anim){
    drawDisc(colX(anim.col), anim.y, anim.color);
  }

  requestAnimationFrame(loop);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function colFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var x=(e.clientX-rect.left)*(cv.width/rect.width);
  for(var c=0;c<C;c++){
    var cx=colX(c);
    if(x>=cx&&x<=cx+cell)return c;
  }
  return Math.max(0,Math.min(C-1, Math.floor((x-ox)/(cell+GAP))));
}

cv.addEventListener("pointermove",function(e){hoverCol=colFromEvent(e);});
cv.addEventListener("pointerleave",function(){hoverCol=-1;});
cv.addEventListener("pointerdown",function(e){
  var col=colFromEvent(e);
  drop(col);
});

document.getElementById("rst").onclick=function(){
  grid=Array.from({length:R},function(){return Array(C).fill(0);});
  turn=1;over=false;busy=false;anim=null;
  st.textContent="Hraje: Cerveny";
};

requestAnimationFrame(loop);
})();
</script></body></html>
