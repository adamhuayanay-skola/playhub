<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Snake</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none;touch-action:none}
h1{font-weight:800;margin-bottom:8px}.hud{display:flex;gap:12px;margin-bottom:10px}.hud span{background:#1e293b;padding:6px 14px;border-radius:10px;font-weight:700}
canvas{border-radius:14px;background:#020617;box-shadow:0 12px 40px #0008;max-width:94vw;cursor:pointer}
.hint{margin-top:10px;color:#64748b;font-size:.75rem}.leave-btn{position:fixed;top:12px;left:12px;z-index:99;width:42px;height:42px;border:none;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:1.35rem;font-weight:800;cursor:pointer;line-height:1}
</style></head><body>
<button type="button" class="leave-btn" id="leaveBtn" title="Zpet">×</button>
<h1>Snake</h1><div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="hi">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas><p class="hint">Sipky / WASD · klik start</p>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),sc=document.getElementById("sc"),hiEl=document.getElementById("hi");
const N=16,S=25,MS=+( {easy:150,mid:110,hard:75}[(new URLSearchParams(location.search)).get("diff")||"mid"]||110);
let snake,dir,next,food,score=0,hi=+(localStorage.snakeHi||0),run=false,dead=false,acc=0,last=0;
hiEl.textContent=hi;
function place(){var p,t=0;do{p={x:(Math.random()*N)|0,y:(Math.random()*N)|0};t++;}while(t<200&&snake.some(function(s){return s.x===p.x&&s.y===p.y;}));return p;}
function reset(){snake=[{x:4,y:8},{x:3,y:8},{x:2,y:8}];dir={x:1,y:0};next={x:1,y:0};score=0;sc.textContent=0;food=place();run=true;dead=false;acc=0;}
function step(){dir=next;var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s){return s.x===h.x&&s.y===h.y;})){dead=true;run=false;if(score>hi){hi=score;localStorage.snakeHi=hi;hiEl.textContent=hi;}return;}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;sc.textContent=score;food=place();}else snake.pop();}
function draw(){ctx.fillStyle="#020617";ctx.fillRect(0,0,400,400);for(var i=0;i<N;i++)for(var j=0;j<N;j++)if((i+j)%2===0){ctx.fillStyle="#0b1220";ctx.fillRect(i*S,j*S,S,S);}
var pulse=1+Math.sin(performance.now()/200)*0.1;ctx.fillStyle="#f43f5e";ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*0.32*pulse,0,6.28);ctx.fill();
snake.forEach(function(s,i){ctx.fillStyle=i?"#22c55e":"#4ade80";ctx.beginPath();ctx.roundRect(s.x*S+2,s.y*S+2,S-4,S-4,6);ctx.fill();});
if(snake[0]){var h=snake[0],cx=h.x*S+S/2,cy=h.y*S+S/2;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx+dir.x*5-dir.y*4,cy+dir.y*5+dir.x*4,2.5,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(cx+dir.x*5+dir.y*4,cy+dir.y*5-dir.x*4,2.5,0,6.28);ctx.fill();}
if(!run&&!dead){ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,400,400);ctx.fillStyle="#fff";ctx.font="bold 22px system-ui";ctx.textAlign="center";ctx.fillText("Klikni pro start",200,200);}
if(dead){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,400,400);ctx.fillStyle="#f87171";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("Game Over",200,185);ctx.fillStyle="#fff";ctx.font="15px system-ui";ctx.fillText("Score "+score,200,215);}}
function loop(t){if(!last)last=t;var dt=t-last;last=t;if(run){acc+=dt;while(acc>=MS){acc-=MS;step();}}draw();requestAnimationFrame(loop);}
document.addEventListener("keydown",function(e){var k=e.key;if((k==="ArrowUp"||k==="w")&&dir.y===0)next={x:0,y:-1};if((k==="ArrowDown"||k==="s")&&dir.y===0)next={x:0,y:1};if((k==="ArrowLeft"||k==="a")&&dir.x===0)next={x:-1,y:0};if((k==="ArrowRight"||k==="d")&&dir.x===0)next={x:1,y:0};if(!run)reset();e.preventDefault();});
cv.addEventListener("pointerdown",function(){if(!run)reset();});
snake=[{x:4,y:8},{x:3,y:8},{x:2,y:8}];dir={x:1,y:0};next={x:1,y:0};food={x:11,y:8};
requestAnimationFrame(loop);
})();</script><script>(function(){var b=document.getElementById("leaveBtn");if(b)b.onclick=function(){if(history.length>1)history.back();else location.href="../index.html";};})();</script>
</body></html>
