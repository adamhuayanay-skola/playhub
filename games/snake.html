<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Snake</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0f1a;color:#e8ecf4;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}h1{font-size:1.4rem;margin-bottom:.5rem}.score{font-size:1.1rem;margin-bottom:1rem;color:#9b7fff}canvas{background:#12182b;border-radius:12px;border:2px solid rgba(124,92,252,.3);max-width:100%;touch-action:none}.hint{margin-top:1rem;font-size:.85rem;color:#8b95a8}.overlay{position:absolute;inset:0;background:rgba(11,15,26,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}.overlay button{padding:.7rem 1.8rem;background:#7c5cfc;border:none;border-radius:999px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}.wrap{position:relative}</style></head><body><h1>🐍 Snake</h1><div class="score">Skóre: <span id="score">0</span> | Nejlepší: <span id="best">0</span></div><div class="wrap"><canvas id="c" width="400" height="400"></canvas><div class="overlay" id="overlay"><div style="font-size:1.3rem;font-weight:700">Stiskni Start</div><button id="startBtn">Hrát</button></div></div><p class="hint">Šipky / WASD • swipe</p><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');const GRID=20,SIZE=canvas.width/GRID;let snake,dir,nextDir,food,score,best,loop,running;best=+localStorage.getItem('snakeBest')||0;bestEl.textContent=best;function reset(){snake=[{x:10,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent=0;spawnFood()}function spawnFood(){do{food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}function tick(){if(!running)return;dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){running=false;overlay.style.display='flex';overlay.querySelector('div').textContent='Game Over! '+score;startBtn.textContent='Znovu';return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snakeBest',best)}spawnFood()}else snake.pop();draw()}function draw(){ctx.fillStyle='#12182b';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00d4aa';ctx.beginPath();ctx.roundRect(food.x*SIZE+2,food.y*SIZE+2,SIZE-4,SIZE-4,4);ctx.fill();snake.forEach((s,i)=>{const t=i/snake.length;ctx.fillStyle=`rgb(${124+t*40},${92+t*60},${252-t*40})`;ctx.beginPath();ctx.roundRect(s.x*SIZE+1,s.y*SIZE+1,SIZE-2,SIZE-2,4);ctx.fill()})}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k)&&dir.y===0)nextDir={x:0,y:-1};if(['arrowdown','s'].includes(k)&&dir.y===0)nextDir={x:0,y:1};if(['arrowleft','a'].includes(k)&&dir.x===0)nextDir={x:-1,y:0};if(['arrowright','d'].includes(k)&&dir.x===0)nextDir={x:1,y:0}});let tx,ty;canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)){if(dx>20&&dir.x===0)nextDir={x:1,y:0};if(dx<-20&&dir.x===0)nextDir={x:-1,y:0}}else{if(dy>20&&dir.y===0)nextDir={x:0,y:1};if(dy<-20&&dir.y===0)nextDir={x:0,y:-1}}},{passive:true});startBtn.addEventListener('click',()=>{reset();running=true;overlay.style.display='none';clearInterval(loop);loop=setInterval(tick,110);draw()});draw();</script></body></html>
