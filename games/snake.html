<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#0f172a,#1e1b4b 50%,#134e4a);color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
h1{font-size:1.4rem;margin-bottom:.35rem;background:linear-gradient(90deg,#34d399,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.score{font-size:.95rem;margin-bottom:.9rem;color:#a5b4fc;display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center}
.score strong{color:#f0fdf4}
.wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 0 3px rgba(167,139,250,.25)}
canvas{display:block;background:#0c1222;max-width:100%;touch-action:none}
.hint{margin-top:.9rem;font-size:.8rem;color:#64748b}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.overlay button{padding:.7rem 1.8rem;background:linear-gradient(135deg,#7c5cfc,#34d399);border:none;border-radius:999px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
.overlay .msg{font-size:1.2rem;font-weight:700}
.badge{display:inline-block;padding:.2rem .55rem;border-radius:999px;font-size:.7rem;font-weight:700;background:rgba(167,139,250,.25);color:#c4b5fd}
</style></head><body>
<h1>Snake</h1>
<div class="score">
<span>Skore: <strong id="score">0</strong></span>
<span>Nejlepsi: <strong id="best">0</strong></span>
<span class="badge" id="diffBadge">Mid</span>
</div>
<div class="wrap"><canvas id="c" width="400" height="400"></canvas>
<div class="overlay" id="overlay"><div class="msg">Stiskni Start</div><button id="startBtn">Hrat</button></div></div>
<p class="hint">Sipky / WASD · swipe · obtiznost z PlayHub</p>
<script>
const params=new URLSearchParams(location.search);
let diff=params.get('diff')||localStorage.getItem('playhubDiff')||'mid';
if(!['easy','mid','hard'].includes(diff))diff='mid';
const SPEEDS={easy:140,mid:100,hard:65};
const speed=SPEEDS[diff];
document.getElementById('diffBadge').textContent=diff==='easy'?'Easy':diff==='hard'?'Hard':'Mid';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');
const GRID=20,SIZE=canvas.width/GRID;
let snake,dir,nextDir,food,score,best,loop,running,particles=[];
best=+localStorage.getItem('snakeBest_'+diff)||0;bestEl.textContent=best;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent=0;particles=[];spawnFood()}
function spawnFood(){do{food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function addParticles(x,y){for(let i=0;i<8;i++)particles.push({x:x*SIZE+SIZE/2,y:y*SIZE+SIZE/2,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,color:`hsl(${140+Math.random()*40},70%,55%)`})}
function tick(){if(!running)return;dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){running=false;overlay.style.display='flex';overlay.querySelector('.msg').textContent='Game Over! '+score;startBtn.textContent='Znovu';return}
snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;addParticles(food.x,food.y);if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snakeBest_'+diff,best)}spawnFood()}else snake.pop();
particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.04;return p.life>0});draw()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){ctx.fillStyle='#0c1222';ctx.fillRect(0,0,canvas.width,canvas.height);
for(let i=0;i<=GRID;i++){ctx.strokeStyle='rgba(148,163,184,.06)';ctx.beginPath();ctx.moveTo(i*SIZE,0);ctx.lineTo(i*SIZE,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*SIZE);ctx.lineTo(canvas.width,i*SIZE);ctx.stroke()}
const fx=food.x*SIZE+SIZE/2,fy=food.y*SIZE+SIZE/2,fr=SIZE*.38;
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(fx+2,fy+3,fr*.9,fr*.5,0,0,Math.PI*2);ctx.fill();
const ag=ctx.createRadialGradient(fx-3,fy-3,2,fx,fy,fr);ag.addColorStop(0,'#f87171');ag.addColorStop(.7,'#ef4444');ag.addColorStop(1,'#b91c1c');
ctx.fillStyle=ag;ctx.beginPath();ctx.arc(fx,fy,fr,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#22c55e';ctx.beginPath();ctx.ellipse(fx+4,fy-fr+2,5,3,.5,0,Math.PI*2);ctx.fill();
snake.forEach((s,i)=>{const px=s.x*SIZE,py=s.y*SIZE,pad=1.5,t=i/Math.max(snake.length-1,1);
if(i===0){const hg=ctx.createRadialGradient(px+SIZE*.35,py+SIZE*.35,2,px+SIZE/2,py+SIZE/2,SIZE*.5);hg.addColorStop(0,'#6ee7b7');hg.addColorStop(.5,'#34d399');hg.addColorStop(1,'#059669');ctx.fillStyle=hg;rr(px+pad,py+pad,SIZE-pad*2,SIZE-pad*2,8);ctx.fill();
let e1x,e1y,e2x,e2y;if(dir.x===1){e1x=px+SIZE-7;e1y=py+6;e2x=px+SIZE-7;e2y=py+SIZE-10}else if(dir.x===-1){e1x=px+5;e1y=py+6;e2x=px+5;e2y=py+SIZE-10}else if(dir.y===-1){e1x=px+6;e1y=py+5;e2x=px+SIZE-10;e2y=py+5}else{e1x=px+6;e1y=py+SIZE-9;e2x=px+SIZE-10;e2y=py+SIZE-9}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e1x,e1y,3.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e2x,e2y,3.2,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(e1x+dir.x,e1y+dir.y,1.6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e2x+dir.x,e2y+dir.y,1.6,0,Math.PI*2);ctx.fill();
}else{const r=Math.floor(52+(1-t)*80),g=Math.floor(180+(1-t)*40),b=Math.floor(100+(1-t)*50);ctx.fillStyle=`rgb(${r},${g},${b})`;rr(px+pad+t*1.5,py+pad+t*1.5,SIZE-pad*2-t*3,SIZE-pad*2-t*3,i===snake.length-1?10:6);ctx.fill()}});
particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k)&&dir.y===0)nextDir={x:0,y:-1};if(['arrowdown','s'].includes(k)&&dir.y===0)nextDir={x:0,y:1};if(['arrowleft','a'].includes(k)&&dir.x===0)nextDir={x:-1,y:0};if(['arrowright','d'].includes(k)&&dir.x===0)nextDir={x:1,y:0};e.preventDefault()});
let tx,ty;canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)){if(dx>20&&dir.x===0)nextDir={x:1,y:0};if(dx<-20&&dir.x===0)nextDir={x:-1,y:0}}else{if(dy>20&&dir.y===0)nextDir={x:0,y:1};if(dy<-20&&dir.y===0)nextDir={x:0,y:-1}}},{passive:true});
startBtn.addEventListener('click',()=>{reset();running=true;overlay.style.display='none';clearInterval(loop);loop=setInterval(tick,speed);draw()});
draw();
</script></body></html>
