<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Space Invaders</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;font-family:Courier New,monospace;color:#0f0;user-select:none;touch-action:none}
h1{letter-spacing:.15em;margin-bottom:6px}.hud{display:flex;gap:20px;margin-bottom:8px;font-weight:700}
canvas{border:2px solid #0f0;max-width:96vw}.hint{margin-top:8px;color:#060;font-size:.75rem}</style></head><body>
<h1>SPACE INVADERS</h1><div class="hud"><span>SCORE <b id="sc">0</b></span><span>HI <b id="hi">0</b></span></div>
<canvas id="c" width="480" height="560"></canvas><p class="hint">← → · Space / klik = strelba</p>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=480,H=560;
let ship,bullets,inv,dir,tick,score,hi=+(localStorage.invHi||0),run=false,over=false,keys={};
document.getElementById("hi").textContent=hi;
function spawn(){inv=[];for(var r=0;r<5;r++)for(var c=0;c<8;c++)inv.push({x:40+c*48,y:60+r*36,alive:true,row:r});}
function reset(){ship={x:W/2-16,y:H-40};bullets=[];spawn();dir=1;tick=0;score=0;run=true;over=false;document.getElementById("sc").textContent=0;}
function shoot(){if(!run||over){reset();return;}if(bullets.length<4)bullets.push({x:ship.x+14,y:ship.y});}
function loop(){
  if(run&&!over){
    if(keys.L)ship.x-=5;if(keys.R)ship.x+=5;ship.x=Math.max(4,Math.min(W-36,ship.x));
    tick++;if(tick%36===0){var edge=inv.some(function(i){return i.alive&&(i.x<8||i.x>W-40);});if(edge){dir*=-1;inv.forEach(function(i){if(i.alive)i.y+=14;});}else inv.forEach(function(i){if(i.alive)i.x+=dir*10;});}
    for(var i=bullets.length-1;i>=0;i--){bullets[i].y-=9;if(bullets[i].y<0){bullets.splice(i,1);continue;}for(var j=0;j<inv.length;j++){var a=inv[j];if(!a.alive)continue;if(bullets[i]&&bullets[i].x>a.x&&bullets[i].x<a.x+32&&bullets[i].y>a.y&&bullets[i].y<a.y+24){a.alive=false;bullets.splice(i,1);score+=10*(5-a.row);document.getElementById("sc").textContent=score;if(score>hi){hi=score;localStorage.invHi=hi;document.getElementById("hi").textContent=hi;}break;}}}
    if(inv.some(function(i){return i.alive&&i.y+24>=ship.y;})){over=true;run=false;}if(inv.every(function(i){return !i.alive;}))spawn();
  }
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#0f0";ctx.fillRect(ship.x+12,ship.y,8,6);ctx.fillRect(ship.x,ship.y+6,32,12);
  inv.forEach(function(i){if(!i.alive)return;ctx.fillStyle=["#f0f","#f0f","#0ff","#0ff","#ff0"][i.row];ctx.fillRect(i.x+4,i.y,24,8);ctx.fillRect(i.x,i.y+8,32,8);ctx.fillRect(i.x+4,i.y+16,8,6);ctx.fillRect(i.x+20,i.y+16,8,6);});
  ctx.fillStyle="#fff";bullets.forEach(function(b){ctx.fillRect(b.x,b.y,3,10);});
  if(!run&&!over){ctx.fillStyle="#0f0";ctx.font="18px Courier New";ctx.textAlign="center";ctx.fillText("CLICK TO START",W/2,H/2);}
  if(over){ctx.fillStyle="#f44";ctx.font="bold 28px Courier New";ctx.textAlign="center";ctx.fillText("GAME OVER",W/2,H/2);}
  requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=true;if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=true;if(e.code==="Space"){e.preventDefault();shoot();}});
document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=false;if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=false;});
cv.addEventListener("pointermove",function(e){var r=cv.getBoundingClientRect();ship.x=Math.max(4,Math.min(W-36,(e.clientX-r.left)*(W/r.width)-16));});
cv.addEventListener("pointerdown",shoot);
ship={x:W/2-16,y:H-40};bullets=[];inv=[];requestAnimationFrame(loop);
})();</script></body></html>
