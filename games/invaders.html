<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Space Invaders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;font-family:Courier New,monospace;color:#0f0;user-select:none;touch-action:none}
#leave{position:fixed;top:12px;left:12px;z-index:99;width:48px;height:48px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
h1{letter-spacing:.12em;margin-bottom:6px;font-size:1.1rem}
.hud{display:flex;gap:20px;margin-bottom:8px;font-weight:700}
canvas{border:2px solid #0f0;max-width:96vw;background:#000;cursor:pointer}
.hint{margin-top:8px;color:#060;font-size:.75rem}

/* visual polish – no gameplay changes */
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;
}
#leave,.leave-btn,button#leave{
  position:fixed!important;top:12px!important;left:12px!important;z-index:9999!important;
  width:48px!important;height:48px!important;border:none!important;border-radius:14px!important;
  background:linear-gradient(145deg,#f87171,#dc2626)!important;color:#fff!important;
  font-size:28px!important;font-weight:900!important;cursor:pointer!important;
  box-shadow:0 6px 20px rgba(220,38,38,.45)!important;line-height:1!important;
}
#leave:active,.leave-btn:active,button#leave:active{transform:scale(.94)}
canvas{
  border-radius:14px!important;
  box-shadow:0 16px 40px rgba(0,0,0,.35)!important;
}
h1{
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

</style></head><body>
<button type="button" id="leave">&times;</button>
<h1>SPACE INVADERS</h1>
<div class="hud"><span>SCORE <b id="sc">0</b></span><span>HI <b id="hi">0</b></span></div>
<canvas id="c" width="480" height="560"></canvas>
<p class="hint">\u2190 \u2192 pohyb \u00b7 Space / klik = strelba</p>
<script>
(function(){
document.getElementById("leave").onclick=function(){location.href="../index.html";};
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=480,H=560;
var ship={x:W/2-16,y:H-40},bullets=[],inv=[],dir=1,tick=0,score=0,hi=+(localStorage.invHi||0),run=false,over=false,keys={};
document.getElementById("hi").textContent=hi;
function spawn(){inv=[];for(var r=0;r<5;r++)for(var c=0;c<8;c++)inv.push({x:40+c*48,y:60+r*36,alive:true,row:r});}
function reset(){ship={x:W/2-16,y:H-40};bullets=[];spawn();dir=1;tick=0;score=0;run=true;over=false;document.getElementById("sc").textContent="0";}
function shoot(){if(!run||over){reset();return;}if(bullets.length<4)bullets.push({x:ship.x+14,y:ship.y});}
function loop(){
if(run&&!over){
if(keys.L)ship.x-=5;if(keys.R)ship.x+=5;ship.x=Math.max(4,Math.min(W-36,ship.x));
tick++;if(tick%36===0){var edge=false;for(var i=0;i<inv.length;i++){if(inv[i].alive&&(inv[i].x<8||inv[i].x>W-40))edge=true;}if(edge){dir*=-1;for(i=0;i<inv.length;i++)if(inv[i].alive)inv[i].y+=14;}else for(i=0;i<inv.length;i++)if(inv[i].alive)inv[i].x+=dir*10;}
for(i=bullets.length-1;i>=0;i--){bullets[i].y-=9;if(bullets[i].y<0){bullets.splice(i,1);continue;}for(var j=0;j<inv.length;j++){var a=inv[j];if(!a.alive)continue;if(bullets[i]&&bullets[i].x>a.x&&bullets[i].x<a.x+32&&bullets[i].y>a.y&&bullets[i].y<a.y+24){a.alive=false;bullets.splice(i,1);score+=10*(5-a.row);document.getElementById("sc").textContent=score;if(score>hi){hi=score;localStorage.invHi=hi;document.getElementById("hi").textContent=hi;}break;}}}
for(i=0;i<inv.length;i++)if(inv[i].alive&&inv[i].y+24>=ship.y){over=true;run=false;}
var left=false;for(i=0;i<inv.length;i++)if(inv[i].alive)left=true;if(!left)spawn();
}
ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#0f0";ctx.fillRect(ship.x+12,ship.y,8,6);ctx.fillRect(ship.x,ship.y+6,32,12);
for(i=0;i<inv.length;i++){a=inv[i];if(!a.alive)continue;ctx.fillStyle=["#f0f","#f0f","#0ff","#0ff","#ff0"][a.row];ctx.fillRect(a.x+4,a.y,24,8);ctx.fillRect(a.x,a.y+8,32,8);ctx.fillRect(a.x+4,a.y+16,8,6);ctx.fillRect(a.x+20,a.y+16,8,6);}
ctx.fillStyle="#fff";for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x,bullets[i].y,3,10);
if(!run&&!over){ctx.fillStyle="#0f0";ctx.font="18px Courier New";ctx.textAlign="center";ctx.fillText("CLICK TO START",W/2,H/2);}
if(over){ctx.fillStyle="#f44";ctx.font="bold 28px Courier New";ctx.textAlign="center";ctx.fillText("GAME OVER",W/2,H/2);}
requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=true;if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=true;if(e.code==="Space"){e.preventDefault();shoot();}});
document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=false;if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=false;});
cv.addEventListener("pointermove",function(e){var r=cv.getBoundingClientRect();ship.x=Math.max(4,Math.min(W-36,(e.clientX-r.left)*(W/r.width)-16));});
cv.addEventListener("pointerdown",shoot);
requestAnimationFrame(loop);
})();
</script></body></html>
