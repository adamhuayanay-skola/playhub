<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Memory</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none}h1{font-size:1.4rem;font-weight:800;margin-bottom:6px;background:linear-gradient(90deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hud{color:#94a3b8;margin-bottom:14px}.hud b{color:#fff}.board{display:grid;grid-template-columns:repeat(4,78px);gap:10px}.card{width:78px;height:78px;perspective:600px;cursor:pointer}.inner{width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;position:relative}.card.on .inner,.card.ok .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem}.front{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:2px solid rgba(255,255,255,.15)}.back{background:#1e293b;border:2px solid #334155;transform:rotateY(180deg)}.card.ok .back{border-color:#34d399;box-shadow:0 0 16px rgba(52,211,153,.35)}</style></head><body>
<h1>MEMORY MATCH</h1><div class="hud">Tahy: <b id="m">0</b> · Pary: <b id="p">0</b>/8</div><div class="board" id="b"></div>
<script>
const E=["\uD83C\uDF4E","\uD83D\uDE97","\u2B50","\uD83C\uDFB5","\uD83D\uDD25","\uD83D\uDC8E","\uD83C\uDFAE","\uD83D\uDE80"];
let cards=[],flipped=[],moves=0,pairs=0,lock=false;
function init(){const deck=[...E,...E].sort(()=>Math.random()-.5);cards=deck.map(e=>({e,on:false,ok:false}));flipped=[];moves=0;pairs=0;lock=false;document.getElementById("m").textContent=0;document.getElementById("p").textContent="0";render()}
function render(){const b=document.getElementById("b");b.innerHTML="";cards.forEach((c,i)=>{const d=document.createElement("div");d.className="card"+(c.on||c.ok?" on":"")+(c.ok?" ok":"");d.innerHTML="<div class=\"inner\"><div class=\"face front\">?</div><div class=\"face back\">"+c.e+"</div></div>";d.onclick=()=>flip(i);b.appendChild(d)})}
function flip(i){if(lock||cards[i].on||cards[i].ok)return;cards[i].on=true;flipped.push(i);render();if(flipped.length===2){moves++;document.getElementById("m").textContent=moves;lock=true;const[a,b]=flipped;if(cards[a].e===cards[b].e){cards[a].ok=cards[b].ok=true;pairs++;document.getElementById("p").textContent=pairs;flipped=[];lock=false;render()}else setTimeout(()=>{cards[a].on=cards[b].on=false;flipped=[];lock=false;render()},600)}}
init();
</script></body></html>
