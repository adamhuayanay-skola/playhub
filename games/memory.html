<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Memory Match</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;user-select:none}h1{font-size:1.2rem;margin-bottom:.4rem;color:#f472b6;font-weight:800}.hud{color:#94a3b8;margin-bottom:.5rem}.hud strong{color:#fff}.board{display:grid;grid-template-columns:repeat(4,72px);gap:8px}.card{width:72px;height:72px;border-radius:10px;cursor:pointer;position:relative}.inner{width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d;position:relative}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.8rem}.front{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.back{background:#0f172a;border:2px solid #334155;transform:rotateY(180deg)}.card.matched .back{border-color:#22c55e}</style></head><body>
<h1>MEMORY MATCH</h1><div class="hud">Tahy: <strong id="moves">0</strong> · Pary: <strong id="pairs">0</strong>/8</div><div class="board" id="board"></div>
<script>
const E=["\uD83C\uDF4E","\uD83D\uDE97","\u2B50","\uD83C\uDFB5","\uD83D\uDD25","\uD83D\uDC8E","\uD83C\uDFAE","\uD83D\uDE80"];
let cards=[],flipped=[],moves=0,pairs=0,lock=false;
function init(){const deck=[...E,...E].sort(()=>Math.random()-.5);cards=deck.map((e,i)=>({emoji:e,flipped:false,matched:false}));flipped=[];moves=0;pairs=0;lock=false;document.getElementById("moves").textContent=0;document.getElementById("pairs").textContent="0";render()}
function render(){const b=document.getElementById("board");b.innerHTML="";cards.forEach((c,i)=>{const d=document.createElement("div");d.className="card"+(c.flipped||c.matched?" flipped":"")+(c.matched?" matched":"");d.innerHTML="<div class=\"inner\"><div class=\"face front\">?</div><div class=\"face back\">"+c.emoji+"</div></div>";d.onclick=()=>flip(i);b.appendChild(d)})}
function flip(i){if(lock||cards[i].flipped||cards[i].matched)return;cards[i].flipped=true;flipped.push(i);render();if(flipped.length===2){moves++;document.getElementById("moves").textContent=moves;lock=true;const[a,b]=flipped;if(cards[a].emoji===cards[b].emoji){cards[a].matched=cards[b].matched=true;pairs++;document.getElementById("pairs").textContent=pairs;flipped=[];lock=false;render()}else{setTimeout(()=>{cards[a].flipped=cards[b].flipped=false;flipped=[];lock=false;render()},650)}}}
init();
</script></body></html>
