<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Minesweeper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0f172a;font-family:Inter,system-ui,sans-serif;color:#e2e8f0;user-select:none;
}
h1{font-size:1.4rem;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
.bar{
  display:flex;gap:12px;align-items:center;margin-bottom:14px;
  background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px 16px;
}
.bar .stat{font-weight:700;font-size:.95rem;min-width:70px;text-align:center}
.bar .stat span{color:#38bdf8}
.face{
  width:42px;height:42px;border-radius:12px;border:none;background:#334155;font-size:1.4rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.face:hover{background:#475569}
.grid{
  display:grid;gap:3px;padding:10px;background:#1e293b;border-radius:16px;
  border:1px solid #334155;box-shadow:0 16px 40px rgba(0,0,0,.4);
}
.cell{
  width:32px;height:32px;border:none;border-radius:6px;font-weight:800;font-size:.95rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#334155;color:#e2e8f0;transition:background .1s;
}
.cell:hover:not(.open):not(.flag){background:#475569}
.cell.open{background:#0f172a;cursor:default}
.cell.flag{background:#3b3f5c}
.cell.bomb{background:#7f1d1d;color:#fecaca}
.cell.n1{color:#3b82f6}.cell.n2{color:#22c55e}.cell.n3{color:#ef4444}
.cell.n4{color:#a855f7}.cell.n5{color:#f97316}.cell.n6{color:#06b6d4}
.hint{margin-top:12px;color:#64748b;font-size:.75rem;text-align:center}
</style></head><body>
<h1>💣 Minesweeper</h1>
<div class="bar">
  <div class="stat">💣 <span id="mines">10</span></div>
  <button class="face" id="face" title="Nová hra">🙂</button>
  <div class="stat">⏱ <span id="time">0</span></div>
</div>
<div class="grid" id="grid"></div>
<p class="hint">Levý klik = odkrýt · Pravý klik = vlajka</p>
<script>
const ROWS=9,COLS=9,MINES=10;
let board=[],open=[],flags=[],started=false,dead=false,won=false,t=0,timer=null;
const grid=document.getElementById("grid");
const minesEl=document.getElementById("mines");
const timeEl=document.getElementById("time");
const face=document.getElementById("face");
grid.style.gridTemplateColumns="repeat("+COLS+",32px)";

function idx(r,c){return r*COLS+c;}
function neighbors(r,c){
  var out=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)out.push([nr,nc]);
  }
  return out;
}
function build(safeR,safeC){
  board=Array(ROWS*COLS).fill(0);
  var placed=0;
  while(placed<MINES){
    var r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(board[idx(r,c)]===-1)continue;
    if(Math.abs(r-safeR)<=1&&Math.abs(c-safeC)<=1)continue;
    board[idx(r,c)]=-1;placed++;
  }
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(board[idx(r,c)]===-1)continue;
    var n=0;neighbors(r,c).forEach(function(p){if(board[idx(p[0],p[1])]===-1)n++;});
    board[idx(r,c)]=n;
  }
}
function reset(){
  open=Array(ROWS*COLS).fill(false);
  flags=Array(ROWS*COLS).fill(false);
  started=false;dead=false;won=false;t=0;timeEl.textContent="0";
  clearInterval(timer);timer=null;
  board=Array(ROWS*COLS).fill(0);
  face.textContent="🙂";
  minesEl.textContent=MINES;
  render();
}
function startTimer(){
  if(timer)return;
  timer=setInterval(function(){t++;timeEl.textContent=t;},1000);
}
function flood(r,c){
  var stack=[[r,c]];
  while(stack.length){
    var p=stack.pop(),r=p[0],c=p[1],i=idx(r,c);
    if(open[i]||flags[i])continue;
    open[i]=true;
    if(board[i]===0)neighbors(r,c).forEach(function(n){if(!open[idx(n[0],n[1])])stack.push(n);});
  }
}
function checkWin(){
  var left=0;
  for(var i=0;i<board.length;i++)if(board[i]!==-1&&!open[i])left++;
  if(left===0){won=true;dead=false;face.textContent="😎";clearInterval(timer);}
}
function reveal(r,c){
  if(dead||won)return;
  var i=idx(r,c);
  if(flags[i]||open[i])return;
  if(!started){build(r,c);started=true;startTimer();}
  if(board[i]===-1){
    dead=true;face.textContent="😵";clearInterval(timer);
    for(var j=0;j<board.length;j++)if(board[j]===-1)open[j]=true;
    render();return;
  }
  if(board[i]===0)flood(r,c);else open[i]=true;
  checkWin();render();
}
function toggleFlag(r,c){
  if(dead||won||!started&&false){}
  if(dead||won)return;
  var i=idx(r,c);
  if(open[i])return;
  flags[i]=!flags[i];
  var fc=flags.filter(Boolean).length;
  minesEl.textContent=Math.max(0,MINES-fc);
  render();
}
function render(){
  grid.innerHTML="";
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var i=idx(r,c);
    var btn=document.createElement("button");
    btn.className="cell";
    if(flags[i]&&!open[i]){btn.classList.add("flag");btn.textContent="🚩";}
    else if(open[i]){
      btn.classList.add("open");
      if(board[i]===-1){btn.classList.add("bomb");btn.textContent="💣";}
      else if(board[i]>0){btn.classList.add("n"+board[i]);btn.textContent=board[i];}
    }
    (function(rr,cc){
      btn.addEventListener("click",function(){reveal(rr,cc);});
      btn.addEventListener("contextmenu",function(e){e.preventDefault();toggleFlag(rr,cc);});
    })(r,c);
    grid.appendChild(btn);
  }
}
face.onclick=reset;
reset();
</script></body></html>
