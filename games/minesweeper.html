<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Minesweeper</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#c0c0c0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Tahoma,sans-serif;user-select:none}h1{font-size:1.1rem;margin-bottom:.4rem}.panel{background:#c0c0c0;border:3px solid;border-color:#fff #808080 #808080 #fff;padding:8px}.top{display:flex;justify-content:space-between;padding:4px 8px;border:2px solid;border-color:#808080 #fff #fff #808080;margin-bottom:6px}.lcd{background:#000;color:#f00;font-family:Courier New,monospace;font-size:1.3rem;font-weight:bold;padding:2px 8px;min-width:50px;text-align:center}.face{width:36px;height:36px;font-size:1.3rem;border:3px solid;border-color:#fff #808080 #808080 #fff;background:#c0c0c0;cursor:pointer}.grid{display:grid;border:3px solid;border-color:#808080 #fff #fff #808080}.cell{width:28px;height:28px;border:2px solid;border-color:#fff #808080 #808080 #fff;background:#c0c0c0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.9rem;cursor:pointer}.cell.open{border:1px solid #808080;background:#bdbdbd}.cell.mine{background:#f00}</style></head><body>
<h1>Minesweeper</h1><div class="panel"><div class="top"><div class="lcd" id="mines">10</div><button class="face" id="face">🙂</button><div class="lcd" id="timer">000</div></div><div class="grid" id="grid"></div></div>
<script>
const params=new URLSearchParams(location.search);
const D={easy:{r:8,c:8,m:8},mid:{r:9,c:9,m:12},hard:{r:12,c:12,m:25}}[params.get("diff")||"mid"]||{r:9,c:9,m:12};
const R=D.r,C=D.c,M=D.m;let board=[],op=[],fg=[],alive=true,started=false,time=0,tim=null;
const grid=document.getElementById("grid"),face=document.getElementById("face");grid.style.gridTemplateColumns="repeat("+C+",28px)";
function init(){board=Array.from({length:R},()=>Array(C).fill(0));op=Array.from({length:R},()=>Array(C).fill(false));fg=Array.from({length:R},()=>Array(C).fill(false));alive=true;started=false;time=0;clearInterval(tim);document.getElementById("timer").textContent="000";document.getElementById("mines").textContent=String(M).padStart(2,"0");face.textContent="🙂";render()}
function place(sr,sc){let p=0;while(p<M){const r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C);if(board[r][c]===-1||(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1))continue;board[r][c]=-1;p++}for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(board[r][c]===-1)continue;let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&board[nr][nc]===-1)n++}board[r][c]=n}}
const COL=["","#00f","#008000","#f00","#000080","#800000","#008080","#000","#808080"];
function rev(r,c){if(r<0||r>=R||c<0||c>=C||op[r][c]||fg[r][c])return;op[r][c]=true;if(board[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)rev(r+dr,c+dc)}
function click(r,c){if(!alive||fg[r][c])return;if(!started){started=true;place(r,c);tim=setInterval(()=>{time++;document.getElementById("timer").textContent=String(time).padStart(3,"0")},1000)}if(board[r][c]===-1){alive=false;face.textContent="💀";op.forEach((row,ri)=>row.forEach((_,ci)=>{if(board[ri][ci]===-1)op[ri][ci]=true}));clearInterval(tim);render();return}rev(r,c);render();if(op.flat().filter(Boolean).length===R*C-M){alive=false;face.textContent="😎";clearInterval(tim)}}
function rc(r,c){if(!alive||op[r][c])return;fg[r][c]=!fg[r][c];document.getElementById("mines").textContent=String(Math.max(0,M-fg.flat().filter(Boolean).length)).padStart(2,"0");render()}
function render(){grid.innerHTML="";for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement("div");d.className="cell";if(op[r][c]){d.classList.add("open");if(board[r][c]===-1){d.classList.add("mine");d.textContent="💣"}else if(board[r][c]>0){d.textContent=board[r][c];d.style.color=COL[board[r][c]]}}else if(fg[r][c])d.textContent="🚩";d.oncontextmenu=e=>{e.preventDefault();rc(r,c)};d.onclick=()=>click(r,c);grid.appendChild(d)}}face.onclick=init;init();
</script></body></html>
