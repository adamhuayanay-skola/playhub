<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Slope</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;user-select:none;touch-action:none;color:#fff;overflow:hidden}h1{font-size:1.2rem;font-weight:900;letter-spacing:.2em;margin-bottom:.3rem;color:#00e5ff;text-shadow:0 0 20px #00e5ff}.sc{font-size:1.4rem;font-weight:800;margin-bottom:.3rem}canvas{border-radius:8px;box-shadow:0 0 40px rgba(0,229,255,.15);max-width:96vw}.hint{color:#555;font-size:.75rem;margin-top:.4rem}</style></head><body>
<h1>SLOPE</h1><div class="sc" id="sc">0</div><canvas id="c" width="480" height="640"></canvas><p class="hint">&larr; &rarr; / A D</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),scEl=document.getElementById("sc");
const params=new URLSearchParams(location.search);
const baseSpd={easy:3.5,mid:5,hard:7}[params.get("diff")||"mid"]||5;
const W=480,H=640;
let ball={x:0,z:0,vx:0,r:14},speed=baseSpd,run=false,score=0,frame=0,tiles=[],reds=[];
function reset(){ball={x:0,z:0,vx:0,r:14};speed=baseSpd;score=0;frame=0;tiles=[];reds=[];for(let i=0;i<20;i++)addTile(i*80)}
function addTile(z){const w=140+Math.random()*80,xOff=(Math.random()-.5)*60;tiles.push({z,w,x:xOff});if(Math.random()>0.7&&z>200)reds.push({z:z+30,x:xOff+(Math.random()-.5)*w*0.5,w:30+Math.random()*25})}
function start(){if(!run){run=true;reset()}}
function project(x,z){const scale=220/(220+z);return{x:W/2+x*scale,y:H*0.15+z*0.55*scale+(1-scale)*200,s:scale}}
function tick(){if(!run){draw();requestAnimationFrame(tick);return}frame++;speed=baseSpd+frame*0.001;score=Math.floor(frame/3);scEl.textContent=score;ball.z+=speed;ball.x+=ball.vx;ball.vx*=0.92;while(tiles.length&&tiles[0].z<ball.z-50)tiles.shift();while(reds.length&&reds[0].z<ball.z-50)reds.shift();if(tiles.length<18)addTile(tiles[tiles.length-1].z+80);let onTile=false;for(const t of tiles){if(Math.abs(t.z-ball.z)<45&&Math.abs(ball.x-t.x)<t.w/2-8)onTile=true}for(const r of reds){if(Math.abs(r.z-ball.z)<25&&Math.abs(ball.x-r.x)<r.w/2+ball.r)run=false}if(!onTile&&ball.z>100)run=false;draw();requestAnimationFrame(tick)}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0d0221");g.addColorStop(0.5,"#1a0a3e");g.addColorStop(1,"#0a0a12");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="rgba(255,255,255,.3)";for(let i=0;i<30;i++){ctx.fillRect((i*97+frame*0.1)%W,(i*53)%(H*0.4),2,2)}const sorted=[...tiles].sort((a,b)=>b.z-a.z);sorted.forEach(t=>{const rel=t.z-ball.z;if(rel<-30||rel>600)return;const bl=project(t.x-t.w/2,rel),br=project(t.x+t.w/2,rel),fl=project(t.x-t.w/2,rel+70),fr=project(t.x+t.w/2,rel+70);const tg=ctx.createLinearGradient(0,bl.y,0,fl.y);tg.addColorStop(0,"#1a237e");tg.addColorStop(1,"#0d47a1");ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(br.x,br.y);ctx.lineTo(fr.x,fr.y);ctx.lineTo(fl.x,fl.y);ctx.closePath();ctx.fill();ctx.strokeStyle="#00e5ff";ctx.globalAlpha=0.5+0.3*bl.s;ctx.lineWidth=2*bl.s;ctx.shadowColor="#00e5ff";ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(br.x,br.y);ctx.stroke();ctx.beginPath();ctx.moveTo(fl.x,fl.y);ctx.lineTo(fr.x,fr.y);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1});reds.forEach(r=>{const rel=r.z-ball.z;if(rel<-20||rel>500)return;const p=project(r.x,rel);ctx.fillStyle="#ff1744";ctx.shadowColor="#ff1744";ctx.shadowBlur=12;ctx.fillRect(p.x-r.w/2*p.s,p.y-25*p.s,r.w*p.s,25*p.s);ctx.shadowBlur=0});const bp=project(ball.x,0),br=ball.r*(0.9+bp.s*0.3);ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(bp.x,bp.y+br*0.7,br*1.1,br*0.35,0,0,Math.PI*2);ctx.fill();const bg=ctx.createRadialGradient(bp.x-br*0.3,bp.y-br*0.3,br*0.1,bp.x,bp.y,br);bg.addColorStop(0,"#fff");bg.addColorStop(0.4,"#00e5ff");bg.addColorStop(1,"#006680");ctx.fillStyle=bg;ctx.shadowColor="#00e5ff";ctx.shadowBlur=15;ctx.beginPath();ctx.arc(bp.x,bp.y,br,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(!run){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#00e5ff";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText(score>0?"CRASHED":"SLOPE",W/2,H/2-15);ctx.fillStyle="#fff";ctx.font="14px system-ui";ctx.fillText(score>0?"Score: "+score:"Click to start",W/2,H/2+15)}}
document.addEventListener("keydown",e=>{if(e.code==="ArrowLeft"||e.key==="a"){ball.vx-=1.2;start()}if(e.code==="ArrowRight"||e.key==="d"){ball.vx+=1.2;start()}});
canvas.addEventListener("pointermove",e=>{if(!run)return;const r=canvas.getBoundingClientRect();ball.vx=((e.clientX-r.left)/r.width-0.5)*3});
canvas.addEventListener("pointerdown",start);tick();
</script></body></html>
