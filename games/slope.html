<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Slope</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030308;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none;overflow:hidden}
h1{font-size:1.1rem;font-weight:900;letter-spacing:.25em;color:#22d3ee;text-shadow:0 0 16px #22d3ee;margin-bottom:6px}
.sc{font-size:1.5rem;font-weight:800;margin-bottom:8px}
canvas{border-radius:10px;box-shadow:0 0 40px rgba(34,211,238,.12);max-width:96vw;cursor:none}
.hint{margin-top:10px;color:#555;font-size:.75rem}
.leave-btn{position:fixed;top:12px;left:12px;z-index:99;width:42px;height:42px;border:none;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:1.35rem;font-weight:800;cursor:pointer;line-height:1}
</style></head><body>
<button type="button" class="leave-btn" id="leaveBtn" title="Zpet">×</button>
<h1>SLOPE</h1>
<div class="sc" id="sc">0</div>
<canvas id="c" width="480" height="640"></canvas>
<p class="hint">A D / sipky · mys</p>
<script>
(function(){
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc");
const W=480,H=640;
const params=new URLSearchParams(location.search);
const baseSp={easy:4.2,mid:6,hard:8.5}[params.get("diff")||"mid"]||6;

// Classic Slope feel: you roll DOWN the screen (toward bottom).
// Far platform = near TOP of screen (small), near platform = toward BOTTOM (large).
let ball={x:0,z:0,vx:0};
let spd=baseSp, run=false, dead=false, score=0;
let plats=[];
let keys={L:false,R:false};
let mouseN=0; // -1..1

function proj(x,y,z){
  // z increases as we go forward; map so larger z appears LOWER on screen
  var depth=z-ball.z+40; // relative depth ahead of ball
  if(depth<8)depth=8;
  var scale=220/depth;
  // horizon near top
  var screenY=90+depth*1.35;
  return {x:W/2+x*scale, y:screenY-y*scale, s:scale, depth:depth};
}

function gen(){
  plats=[];
  var z=0,x=0;
  for(var i=0;i<50;i++){
    if(i>2)x+=(Math.random()-0.5)*35;
    x=Math.max(-70,Math.min(70,x));
    var w=100+Math.random()*40;
    plats.push({z:z,x:x,w:w,len:48,bad:false});
    if(i>6&&Math.random()<0.22){
      plats.push({z:z+20,x:x+(Math.random()>0.5?45:-45),w:36,len:28,bad:true});
    }
    z+=46;
  }
}

function reset(){
  ball={x:0,z:5,vx:0};spd=baseSp;run=true;dead=false;score=0;scEl.textContent="0";gen();
}

function under(z){
  for(var i=0;i<plats.length;i++){
    var p=plats[i];
    if(z>=p.z&&z<=p.z+p.len)return p;
  }
  return null;
}

function drawPlat(p){
  var yTop=8,yBot=0;
  var z0=p.z,z1=p.z+p.len;
  var x0=p.x-p.w/2,x1=p.x+p.w/2;
  var a=proj(x0,yTop,z0),b=proj(x1,yTop,z0),c=proj(x1,yTop,z1),d=proj(x0,yTop,z1);
  var a2=proj(x0,yBot,z0),b2=proj(x1,yBot,z0),c2=proj(x1,yBot,z1),d2=proj(x0,yBot,z1);
  if(a.depth>520)return;

  // side
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(d.x,d.y);ctx.lineTo(d2.x,d2.y);ctx.lineTo(a2.x,a2.y);ctx.closePath();ctx.fill();
  // front
  ctx.fillStyle=p.bad?"#7f1d1d":"#1e293b";
  ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(c.x,c.y);ctx.lineTo(c2.x,c2.y);ctx.lineTo(d2.x,d2.y);ctx.closePath();ctx.fill();
  // top
  ctx.fillStyle=p.bad?"#ef4444":"#334155";
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();
  // edge glow
  ctx.strokeStyle=p.bad?"#fca5a5":"#22d3ee";
  ctx.lineWidth=Math.max(1,a.s*0.05);ctx.globalAlpha=0.85;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.stroke();
  ctx.globalAlpha=1;
}

function loop(){
  if(run&&!dead){
    if(keys.L)ball.vx-=0.4;
    if(keys.R)ball.vx+=0.4;
    ball.vx+=(mouseN*5-ball.vx)*0.06;
    ball.vx*=0.9;
    ball.x+=ball.vx;
    ball.z+=spd*0.35;
    spd+=0.0012;
    score=Math.floor(ball.z/8);
    scEl.textContent=String(score);

    var p=under(ball.z);
    if(!p||p.bad||ball.x<p.x-p.w/2+10||ball.x>p.x+p.w/2-10){
      dead=true;run=false;
    }

    var last=plats[plats.length-1];
    if(last&&ball.z>last.z-350){
      var x=last.x+(Math.random()-0.5)*45;
      x=Math.max(-75,Math.min(75,x));
      plats.push({z:last.z+46,x:x,w:90+Math.random()*45,len:48,bad:false});
      if(Math.random()<0.2)plats.push({z:last.z+70,x:x+(Math.random()>0.5?50:-50),w:34,len:26,bad:true});
    }
    plats=plats.filter(function(p){return p.z+p.len>ball.z-30;});
  }

  ctx.fillStyle="#030308";ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle="rgba(255,255,255,.12)";
  for(var i=0;i<30;i++)ctx.fillRect((i*89+score)%W,(i*47)%90,2,2);

  var sorted=plats.slice().sort(function(a,b){return b.z-a.z;});
  for(var i=0;i<sorted.length;i++)drawPlat(sorted[i]);

  // ball near bottom of visible path
  var bp=proj(ball.x,10,ball.z+2);
  var r=Math.max(8,Math.min(22,bp.s*0.9));
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(bp.x,bp.y+r*0.5,r*1.2,r*0.35,0,0,Math.PI*2);ctx.fill();
  var grd=ctx.createRadialGradient(bp.x-r*0.3,bp.y-r*0.3,1,bp.x,bp.y,r);
  grd.addColorStop(0,"#fca5a5");grd.addColorStop(1,"#dc2626");
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(bp.x,bp.y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=2;ctx.stroke();

  if(!run&&!dead){
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 22px system-ui";ctx.textAlign="center";
    ctx.fillText("Klikni pro start",W/2,H/2);
  }
  if(dead){
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#f87171";ctx.font="bold 28px system-ui";ctx.textAlign="center";
    ctx.fillText("Game Over",W/2,H/2-12);
    ctx.fillStyle="#fff";ctx.font="16px system-ui";ctx.fillText("Score "+score+" · klikni",W/2,H/2+18);
  }
  requestAnimationFrame(loop);
}

document.addEventListener("keydown",function(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=true;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=true;
});
document.addEventListener("keyup",function(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=false;
});
canvas.addEventListener("pointermove",function(e){
  var r=canvas.getBoundingClientRect();
  mouseN=((e.clientX-r.left)/r.width)*2-1;
});
canvas.addEventListener("pointerdown",function(){if(!run||dead)reset();});
requestAnimationFrame(loop);
})();
</script><script>(function(){var b=document.getElementById("leaveBtn");if(b)b.onclick=function(){if(history.length>1)history.back();else location.href="../index.html";};})();</script>
</body></html>
