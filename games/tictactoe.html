<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tic Tac Toe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none}
#leave{position:fixed;top:12px;left:12px;z-index:200;width:48px;height:48px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
h1{font-size:1.4rem;font-weight:800;margin-bottom:8px}
#st{margin-bottom:14px;font-weight:600;color:#94a3b8;min-height:24px}
.board{display:grid;grid-template-columns:repeat(3,100px);gap:10px}
.cell{width:100px;height:100px;background:#1e293b;border:none;border-radius:14px;font-size:2.4rem;font-weight:800;cursor:pointer;color:#e2e8f0}
.cell.x{color:#38bdf8}.cell.o{color:#f472b6}
#rst{margin-top:16px;padding:10px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:16px}
.modal[hidden]{display:none!important}
.panel{background:#fff;color:#0f172a;border-radius:20px;padding:28px 22px;width:min(340px,100%);text-align:center}
.panel h2{font-size:1.7rem;font-weight:900;margin-bottom:8px}
.panel.winx h2{color:#0284c7}.panel.wino h2{color:#db2777}.panel.draw h2{color:#475569}
.panel p{color:#64748b;margin-bottom:14px}
.panel button{display:block;width:100%;margin:8px 0;padding:14px;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-size:1rem}
.btn-blue{background:#6366f1;color:#fff}.btn-gray{background:#e2e8f0;color:#0f172a}.btn-purple{background:#7c3aed;color:#fff}

/* visual polish – no gameplay changes */
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;
}
#leave,.leave-btn,button#leave{
  position:fixed!important;top:12px!important;left:12px!important;z-index:9999!important;
  width:48px!important;height:48px!important;border:none!important;border-radius:14px!important;
  background:linear-gradient(145deg,#f87171,#dc2626)!important;color:#fff!important;
  font-size:28px!important;font-weight:900!important;cursor:pointer!important;
  box-shadow:0 6px 20px rgba(220,38,38,.45)!important;line-height:1!important;
}
#leave:active,.leave-btn:active,button#leave:active{transform:scale(.94)}
canvas{
  border-radius:14px!important;
  box-shadow:0 16px 40px rgba(0,0,0,.35)!important;
}
h1{
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

</style></head><body>
<button type="button" id="leave">&times;</button>
<h1>Tic Tac Toe</h1>
<div id="st">Vyber rezim</div>
<div class="board" id="board"></div>
<button type="button" id="rst">Nova hra</button>

<div class="modal" id="modeModal">
  <div class="panel">
    <h2>Jak chces hrat?</h2>
    <p>Vyber souperu</p>
    <button type="button" class="btn-gray" id="btnFriend">Proti kamaradovi</button>
    <button type="button" class="btn-purple" id="btnBot">Proti botovi</button>
  </div>
</div>

<div class="modal" id="winModal" hidden>
  <div class="panel" id="winPanel">
    <h2 id="winTitle">Vyhra</h2>
    <p id="winText"></p>
    <button type="button" class="btn-blue" id="btnAgain">Hrat znovu</button>
    <button type="button" class="btn-gray" id="btnMode">Zmenit rezim</button>
  </div>
</div>

<script>
(function(){
var boardEl=document.getElementById("board");
var cells=[],turn="X",over=false,vsBot=false,started=false;

document.getElementById("leave").onclick=function(){location.href="../index.html";};

function lines(b){
  var L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],i,a,c,d;
  for(i=0;i<L.length;i++){
    a=L[i][0];c=L[i][1];d=L[i][2];
    if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
  }
  return b.every(Boolean)?"draw":null;
}
function empties(b){var e=[],i;for(i=0;i<9;i++)if(!b[i])e.push(i);return e;}
function minimax(b,isMax){
  var w=lines(b);
  if(w==="O")return {s:10};if(w==="X")return {s:-10};if(w==="draw")return {s:0};
  var best=isMax?{s:-999,i:-1}:{s:999,i:-1};
  var moves=empties(b),k,i,res,t,j;
  for(i=moves.length-1;i>0;i--){j=(Math.random()*(i+1))|0;t=moves[i];moves[i]=moves[j];moves[j]=t;}
  for(k=0;k<moves.length;k++){
    i=moves[k];b[i]=isMax?"O":"X";res=minimax(b,!isMax);b[i]=null;
    if(isMax){if(res.s>best.s)best={s:res.s,i:i};}
    else{if(res.s<best.s)best={s:res.s,i:i};}
  }
  return best;
}
function botPlay(){
  if(over||!vsBot)return;
  var b=cells.map(function(c){return c.mark;});
  var e=empties(b),move=null,i;
  for(i=0;i<e.length;i++){b[e[i]]="O";if(lines(b)==="O"){move=e[i];b[e[i]]=null;break;}b[e[i]]=null;}
  if(move==null){for(i=0;i<e.length;i++){b[e[i]]="X";if(lines(b)==="X"){move=e[i];b[e[i]]=null;break;}b[e[i]]=null;}}
  if(move==null){
    if(Math.random()<0.15&&e.length){
      var pref=e.filter(function(i){return i===4||i%2===0;});
      move=(pref.length?pref:e)[(Math.random()*(pref.length||e.length))|0];
    }else move=minimax(b,true).i;
  }
  if(move==null)move=e[0];
  setTimeout(function(){place(move,"O");},280+Math.random()*250);
}
function place(i,mark){
  if(over||cells[i].mark)return;
  cells[i].mark=mark;
  cells[i].btn.textContent=mark;
  cells[i].btn.className="cell "+mark.toLowerCase();
  cells[i].btn.disabled=true;
  var b=cells.map(function(c){return c.mark;});
  var w=lines(b);
  if(w){
    over=true;
    var panel=document.getElementById("winPanel");
    var title=document.getElementById("winTitle");
    var text=document.getElementById("winText");
    if(w==="draw"){panel.className="panel draw";title.textContent="Remiza!";text.textContent="Nikdo nevyhral";}
    else if(w==="X"){panel.className="panel winx";title.textContent="X vyhral!";text.textContent=vsBot?"Vyhral jsi!":"Hrac X";}
    else{panel.className="panel wino";title.textContent="O vyhral!";text.textContent=vsBot?"Bot vyhral":"Hrac O";}
    document.getElementById("st").textContent=title.textContent;
    document.getElementById("winModal").hidden=false;
    return;
  }
  turn=turn==="X"?"O":"X";
  if(vsBot){
    document.getElementById("st").textContent=turn==="X"?"Ty (X)":"Bot mysli...";
    if(turn==="O")botPlay();
  }else document.getElementById("st").textContent="Hraje: "+turn;
}
function render(){
  boardEl.innerHTML="";cells=[];
  var i;
  for(i=0;i<9;i++){
    (function(idx){
      var btn=document.createElement("button");
      btn.type="button";btn.className="cell";
      btn.onclick=function(){
        if(!started||over)return;
        if(vsBot&&turn!=="X")return;
        place(idx,turn);
      };
      boardEl.appendChild(btn);
      cells.push({btn:btn,mark:null});
    })(i);
  }
}
function start(bot){
  vsBot=!!bot;started=true;over=false;turn="X";
  document.getElementById("modeModal").hidden=true;
  document.getElementById("winModal").hidden=true;
  document.getElementById("st").textContent=vsBot?"Ty (X)":"Hraje: X";
  render();
}
document.getElementById("btnFriend").onclick=function(){start(false);};
document.getElementById("btnBot").onclick=function(){start(true);};
document.getElementById("btnAgain").onclick=function(){start(vsBot);};
document.getElementById("btnMode").onclick=function(){
  document.getElementById("winModal").hidden=true;
  document.getElementById("modeModal").hidden=false;
  started=false;
  document.getElementById("st").textContent="Vyber rezim";
};
document.getElementById("rst").onclick=function(){
  if(started)start(vsBot);
  else document.getElementById("modeModal").hidden=false;
};
render();
})();
</script>
</body></html>
