<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f4f6fb; color: #1a1d2e; font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    }
    h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    .status { color: #7c5cfc; margin-bottom: 1rem; font-size: 1.1rem; }
    .board {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: #e8ecf4; padding: 10px; border-radius: 16px;
    }
    .cell {
      width: 90px; height: 90px; background: #fff; border: none; border-radius: 12px;
      font-size: 2.5rem; cursor: pointer; color: #1a1d2e; box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .cell:hover:not(:disabled) { background: #f0edff; }
    .cell.x { color: #7c5cfc; }
    .cell.o { color: #00c9a0; }
    button {
      margin-top: 1.2rem; padding: 0.55rem 1.4rem; background: #7c5cfc; border: none;
      border-radius: 999px; color: white; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>❌ Tic Tac Toe</h1>
  <div class="status" id="status">Hraje: X</div>
  <div class="board" id="board"></div>
  <button id="reset">Nová hra</button>
  <script>
    let board, current, gameOver;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function init() {
      board = Array(9).fill(null); current = 'X'; gameOver = false;
      document.getElementById('status').textContent = 'Hraje: X';
      render();
    }
    function render() {
      const el = document.getElementById('board');
      el.innerHTML = '';
      board.forEach((v, i) => {
        const btn = document.createElement('button');
        btn.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
        btn.textContent = v || '';
        btn.disabled = !!v || gameOver;
        btn.addEventListener('click', () => move(i));
        el.appendChild(btn);
      });
    }
    function move(i) {
      if (board[i] || gameOver) return;
      board[i] = current;
      if (checkWin(current)) {
        document.getElementById('status').textContent = current + ' vyhrál!';
        gameOver = true;
      } else if (board.every(c => c)) {
        document.getElementById('status').textContent = 'Remíza!';
        gameOver = true;
      } else {
        current = current === 'X' ? 'O' : 'X';
        document.getElementById('status').textContent = 'Hraje: ' + current;
      }
      render();
    }
    function checkWin(p) {
      return wins.some(([a,b,c]) => board[a] === p && board[b] === p && board[c] === p);
    }
    document.getElementById('reset').addEventListener('click', init);
    init();
  </script>
</body>
</html>
