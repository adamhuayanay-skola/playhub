<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tic Tac Toe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(160deg,#1e1b4b,#312e81 40%,#0f766e);font-family:system-ui,sans-serif;color:#e2e8f0}
h1{font-size:1.4rem;font-weight:800;margin-bottom:.4rem;background:linear-gradient(90deg,#a5b4fc,#6ee7b7);
-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{font-size:1.05rem;margin-bottom:1.1rem;color:#c7d2fe;font-weight:600;min-height:1.4em}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;background:rgba(15,23,42,.45);
border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 0 2px rgba(165,180,252,.2)}
.cell{width:92px;height:92px;border:none;border-radius:16px;background:rgba(255,255,255,.08);
cursor:pointer;font-size:2.6rem;font-weight:800;transition:.2s;color:transparent;
box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.cell:hover:not(:disabled){background:rgba(255,255,255,.14);transform:scale(1.03)}
.cell:disabled{cursor:default}
.cell.x{color:#a78bfa;text-shadow:0 0 20px rgba(167,139,250,.6)}
.cell.o{color:#34d399;text-shadow:0 0 20px rgba(52,211,153,.5)}
.cell.win{animation:pulse .5s ease;background:rgba(251,191,36,.2)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
button#reset{margin-top:1.3rem;padding:.65rem 1.6rem;border:none;border-radius:999px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:.95rem;
cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.4)}
button#reset:hover{transform:scale(1.04)}
</style></head><body>
<h1>Tic Tac Toe</h1>
<div class="status" id="status">Hraje: X</div>
<div class="board" id="board"></div>
<button id="reset">Nova hra</button>
<script>
let board,current,gameOver;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function init(){board=Array(9).fill(null);current='X';gameOver=false;document.getElementById('status').textContent='Hraje: X';render()}
function render(){const el=document.getElementById('board');el.innerHTML='';
board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v?' '+v.toLowerCase():'');
b.textContent=v||'';b.disabled=!!v||gameOver;b.onclick=()=>move(i);el.appendChild(b)})}
function move(i){if(board[i]||gameOver)return;board[i]=current;
const w=wins.find(([a,b,c])=>board[a]===current&&board[b]===current&&board[c]===current);
if(w){gameOver=true;document.getElementById('status').textContent=current+' vyhral!';render();
w.forEach(i=>document.querySelectorAll('.cell')[i].classList.add('win'));return}
if(board.every(c=>c)){gameOver=true;document.getElementById('status').textContent='Remiza!';render();return}
current=current==='X'?'O':'X';document.getElementById('status').textContent='Hraje: '+current;render()}
document.getElementById('reset').onclick=init;init();
</script></body></html>
