<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Tic Tac Toe</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none}h1{font-size:1.4rem;font-weight:800;margin-bottom:8px}.status{margin-bottom:14px;font-weight:600;color:#94a3b8}.board{display:grid;grid-template-columns:repeat(3,100px);gap:10px}.cell{width:100px;height:100px;background:#1e293b;border:2px solid #334155;border-radius:14px;font-size:2.6rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}.cell:hover:not(.taken){border-color:#6366f1}.cell.x{color:#38bdf8}.cell.o{color:#f472b6}.cell.win{background:#14532d;border-color:#34d399}.btn{margin-top:16px;padding:10px 22px;border:none;border-radius:10px;background:#6366f1;color:#fff;font-weight:700;cursor:pointer}</style></head><body>
<h1>Tic Tac Toe</h1><div class="status" id="st">Ty jsi X</div><div class="board" id="b"></div><button class="btn" id="rst">Nova hra</button>
<script>
let board,turn,over;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function init(){board=Array(9).fill("");turn="X";over=false;document.getElementById("st").textContent="Ty jsi X";render()}
function render(winLine=[]){const el=document.getElementById("b");el.innerHTML="";board.forEach((v,i)=>{const d=document.createElement("button");d.className="cell"+(v?" taken":"")+(v==="X"?" x":"")+(v==="O"?" o":"")+(winLine.includes(i)?" win":"");d.textContent=v==="X"?"X":(v==="O"?"O":"");d.onclick=()=>move(i);el.appendChild(d)})}
function check(){for(const w of wins){const[a,b,c]=w;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return w}return null}
function move(i){if(over||board[i]||turn!=="X")return;board[i]="X";let w=check();if(w){over=true;document.getElementById("st").textContent="Vyhral jsi!";render(w);return}if(board.every(Boolean)){over=true;document.getElementById("st").textContent="Remiza";render();return}turn="O";document.getElementById("st").textContent="AI...";render();setTimeout(ai,280)}
function ai(){const empty=board.map((v,i)=>v?"":i).filter(v=>v!=="");function find(t){for(const w of wins){const cells=w.map(i=>board[i]);const n=cells.filter(c=>c===t).length;const e=w.filter(i=>!board[i]);if(n===2&&e.length===1)return e[0]}return null}let pick=find("O")??find("X")??(board[4]?"":4);if(pick===""||pick===null)pick=empty[Math.floor(Math.random()*empty.length)];board[pick]="O";let w=check();if(w){over=true;document.getElementById("st").textContent="AI vyhrala";render(w);return}if(board.every(Boolean)){over=true;document.getElementById("st").textContent="Remiza";render();return}turn="X";document.getElementById("st").textContent="Ty jsi X";render()}
document.getElementById("rst").onclick=init;init();
</script></body></html>
