<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Chrome Dino</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f7f7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Courier New,monospace;user-select:none;touch-action:none;color:#535353}
h1{font-size:1rem;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.sc{font-size:.9rem;margin-bottom:8px}
canvas{display:block;max-width:96vw;image-rendering:pixelated;image-rendering:crisp-edges;background:#f7f7f7;border:1px solid #e5e5e5}
.hint{margin-top:10px;font-size:.75rem;color:#999}
</style></head><body>
<h1>THE DINOSAUR GAME</h1>
<div class="sc">HI <span id="hi">00000</span> &nbsp; <span id="sc">00000</span></div>
<canvas id="c" width="700" height="200"></canvas>
<p class="hint">Space / klik = skok</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const W=700,H=200,GROUND=170;
// Classic T-rex sprite (pixel grid from Chrome dino style)
const DINO=[
"........................",
".............######.....",
"............########....",
"............##.#.####...",
"............########....",
"............#######.....",
"............######......",
"............#####.......",
"....##.....######.......",
"...###....########......",
"..################......",
".#################......",
".##################.....",
".#########..#######.....",
".########...#######.....",
"..######....##...##.....",
"...####.....#.....#.....",
"....##......#.....#.....",
"............##...##....."
];
const CACTUS=[
"...##...",
"...##...",
"...##.#.",
"#..##.#.",
"#..##.#.",
"#..####.",
".######.",
"...##...",
"...##...",
"...##...",
"...##...",
"...##..."
];
function drawSprite(sprite,x,y,scale,color){
  ctx.fillStyle=color||"#535353";
  for(var r=0;r<sprite.length;r++){
    for(var c=0;c<sprite[r].length;c++){
      if(sprite[r][c]==="#")ctx.fillRect(x+c*scale,y+r*scale,scale,scale);
    }
  }
}
let dino={x:50,y:GROUND-38,vy:0,onGround:true,w:44,h:38};
let obstacles=[],clouds=[],score=0,hi=+(localStorage.getItem("dinoHi")||0),run=false,dead=false,speed=6,frame=0,spawnT=0;
document.getElementById("hi").textContent=String(hi).padStart(5,"0");
function reset(){
  dino={x:50,y:GROUND-38,vy:0,onGround:true,w:44,h:38};
  obstacles=[];clouds=[{x:200,y:40},{x:450,y:25},{x:650,y:50}];
  score=0;run=true;dead=false;speed=6;frame=0;spawnT=0;
  document.getElementById("sc").textContent="00000";
}
function jump(){
  if(!run){reset();return;}
  if(dino.onGround&&!dead){dino.vy=-11;dino.onGround=false;}
  if(dead)reset();
}
function loop(){
  frame++;
  if(run&&!dead){
    dino.vy+=0.55;dino.y+=dino.vy;
    if(dino.y>=GROUND-38){dino.y=GROUND-38;dino.vy=0;dino.onGround=true;}
    score+=0.15;speed=6+score/200;
    document.getElementById("sc").textContent=String(Math.floor(score)).padStart(5,"0");
    spawnT--;
    if(spawnT<=0){
      obstacles.push({x:W+10,w:24,h:36});
      spawnT=60+Math.random()*80;
    }
    for(var i=obstacles.length-1;i>=0;i--){
      var o=obstacles[i];o.x-=speed;
      if(o.x<-40)obstacles.splice(i,1);
      // collision box tighter
      if(dino.x+8<o.x+o.w&&dino.x+dino.w-8>o.x&&dino.y+8<GROUND&&dino.y+dino.h>GROUND-o.h){
        dead=true;run=false;
        if(Math.floor(score)>hi){hi=Math.floor(score);localStorage.setItem("dinoHi",hi);document.getElementById("hi").textContent=String(hi).padStart(5,"0");}
      }
    }
    clouds.forEach(function(c){c.x-=0.5;if(c.x<-40)c.x=W+Math.random()*100;});
  }
  // draw
  ctx.fillStyle="#f7f7f7";ctx.fillRect(0,0,W,H);
  // ground line
  ctx.strokeStyle="#535353";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();
  // ground dots
  ctx.fillStyle="#535353";
  for(var i=0;i<20;i++){
    var gx=((i*40-frame*speed*0.3)%W+W)%W;
    ctx.fillRect(gx,GROUND+4,3,2);
    ctx.fillRect(gx+15,GROUND+8,6,2);
  }
  // clouds simple
  clouds.forEach(function(c){
    ctx.strokeStyle="#dadada";ctx.lineWidth=2;
    ctx.strokeRect(c.x,c.y,30,10);ctx.strokeRect(c.x+10,c.y-6,20,10);
  });
  // dino leg animation
  var spr=DINO.slice();
  if(run&&dino.onGround&&Math.floor(frame/6)%2===0){
    // alternate legs slightly by clearing bottom
  }
  drawSprite(DINO,dino.x,dino.y,2);
  // obstacles
  obstacles.forEach(function(o){
    drawSprite(CACTUS,o.x,GROUND-24,2);
  });
  if(!run&&!dead){
    ctx.fillStyle="#535353";ctx.font="16px Courier New";ctx.textAlign="center";
    ctx.fillText("Press Space to start",W/2,H/2);
  }
  if(dead){
    ctx.fillStyle="#535353";ctx.font="bold 18px Courier New";ctx.textAlign="center";
    ctx.fillText("G A M E  O V E R",W/2,H/2-10);
    ctx.font="14px Courier New";ctx.fillText("press space to restart",W/2,H/2+16);
  }
  requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}});
canvas.addEventListener("pointerdown",jump);
requestAnimationFrame(loop);
</script></body></html>
