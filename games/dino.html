<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Chrome Dino</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7f7f7;font-family:Courier New,monospace;user-select:none;touch-action:none;color:#535353}
.hud{width:min(700px,96vw);display:flex;justify-content:flex-end;gap:16px;font:bold 14px Courier New,monospace;margin-bottom:4px;letter-spacing:1px}
canvas{display:block;width:min(700px,96vw);image-rendering:pixelated;image-rendering:crisp-edges;background:#f7f7f7;cursor:pointer}
.hint{margin-top:10px;font-size:12px;color:#999}
</style></head><body>
<div class="hud"><span>HI <b id="hi">00000</b></span><span id="sc">00000</span></div>
<canvas id="c" width="700" height="200"></canvas>
<p class="hint">SPACE / TAP = jump</p>
<script>
(function(){
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const W=700,H=200,G=175;
const C="#535353";

// Official Chrome-like HORIZONTAL runner (44x47 style, scale 2)
// Based on Chromium offline T-Rex silhouette – long body, head right, tail left
const RUN1=[
".................####...........",
"...............########.........",
"..............##########........",
"..............##.#.######.......",
"..............##########........",
"..............#########.........",
"..............########..........",
"..............######............",
"...##........######.............",
"...###......########............",
"...##################...........",
"...###################..........",
"...####################.........",
"...##########..########.........",
"...#########....#######.........",
"....#######.....#######.........",
".....####.......##...##.........",
"......##........##...##.........",
"................##...##.........",
"................#.....#........."
];
const RUN2=[
".................####...........",
"...............########.........",
"..............##########........",
"..............##.#.######.......",
"..............##########........",
"..............#########.........",
"..............########..........",
"..............######............",
"...##........######.............",
"...###......########............",
"...##################...........",
"...###################..........",
"...####################.........",
"...##########..########.........",
"...#########....#######.........",
"....#######.....#######.........",
".....####......##....##.........",
"......##.......##.....#.........",
"...............#......#.........",
"...............#................"
];
const JUMP=[
".................####...........",
"...............########.........",
"..............##########........",
"..............##.#.######.......",
"..............##########........",
"..............#########.........",
"..............########..........",
"..............######............",
"...##........######.............",
"...###......########............",
"...##################...........",
"...###################..........",
"...####################.........",
"...##########..########.........",
"...#########....#######.........",
"....#######.....#######.........",
".....####.......#######.........",
"......##........##...##.........",
"................##...##.........",
"................................"
];
const DEAD=[
".................####...........",
"...............########.........",
"..............##########........",
"..............#.#.#.#####.......",
"..............##########........",
"..............#########.........",
"..............########..........",
"..............######............",
"...##........######.............",
"...###......########............",
"...##################...........",
"...###################..........",
"...####################.........",
"...##########..########.........",
"...#########....#######.........",
"....#######.....#######.........",
".....####.......##...##.........",
"......##........##...##.........",
"................##...##.........",
"................#.....#........."
];
const CACT1=[
"..##..",
"..##..",
"..###.",
"..##.#",
"#.##.#",
"#.###.",
".###..",
"..##..",
"..##..",
"..##..",
"..##..",
"..##.."
];
const CACT2=[
"...##...",
"...##...",
"...##.#.",
".#.##.#.",
".#.####.",
".####...",
"..##....",
"..##.#..",
"..##.#..",
"..####..",
"...##...",
"...##...",
"...##...",
"...##...",
"...##..."
];

function blit(rows,x,y,s){
  ctx.fillStyle=C;
  for(var r=0;r<rows.length;r++){
    var line=rows[r];
    for(var c=0;c<line.length;c++){
      if(line[c]==="#")ctx.fillRect(x+c*s,y+r*s,s,s);
    }
  }
}
function pad5(n){return ("00000"+Math.floor(Math.max(0,n))).slice(-5);}

var hi=+(localStorage.getItem("dinoHiOrig")||0);
document.getElementById("hi").textContent=pad5(hi);

var dY=0,dV=0,onG=true,obs=[],clouds=[],bits=[];
var score=0,spd=6.5,frame=0,spawn=80,run=false,dead=false,blink=0;

function reset(){
  dY=0;dV=0;onG=true;obs=[];
  clouds=[{x:180,y:36},{x:400,y:52},{x:600,y:28}];
  bits=[];for(var i=0;i<30;i++)bits.push({x:i*28,y:G+3+(i%3)*3});
  score=0;spd=6.5;frame=0;spawn=70;run=true;dead=false;blink=0;
  document.getElementById("sc").textContent="00000";
}
function jump(){
  if(!run||dead){reset();return;}
  if(onG){dV=-10.8;onG=false;}
}

function loop(){
  frame++;
  if(run&&!dead){
    dV+=0.62;dY+=dV;
    if(dY>=0){dY=0;dV=0;onG=true;}
    score+=0.2;spd=6.5+Math.min(7,score/120);
    document.getElementById("sc").textContent=pad5(score);
    spawn--;
    if(spawn<=0){
      obs.push({x:W+16,big:Math.random()>0.5});
      spawn=50+Math.random()*55-Math.min(18,score/40);
    }
    for(var i=obs.length-1;i>=0;i--){obs[i].x-=spd;if(obs[i].x<-50)obs.splice(i,1);}
    bits.forEach(function(b){b.x-=spd;if(b.x<-12)b.x+=840;});
    clouds.forEach(function(c){c.x-=0.4;if(c.x<-50){c.x=W+40;c.y=24+Math.random()*40;}});

    var bx=48,by=G-40+dY,bw=42,bh=40;
    for(var i=0;i<obs.length;i++){
      var o=obs[i],ox=o.x+2,oy=G-(o.big?40:28),ow=o.big?22:14,oh=o.big?40:28;
      if(bx+10<ox+ow&&bx+bw-12>ox&&by+8<oy+oh&&by+bh>oy){
        dead=true;run=false;
        if(Math.floor(score)>hi){hi=Math.floor(score);localStorage.setItem("dinoHiOrig",hi);document.getElementById("hi").textContent=pad5(hi);}
      }
    }
  }

  ctx.fillStyle="#f7f7f7";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#dadada";
  clouds.forEach(function(c){
    ctx.fillRect(c.x,c.y,40,10);ctx.fillRect(c.x+12,c.y-8,26,12);
  });
  ctx.strokeStyle=C;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();
  ctx.fillStyle=C;
  bits.forEach(function(b){ctx.fillRect(b.x,b.y,4,2);});

  obs.forEach(function(o){
    if(o.big)blit(CACT2,o.x,G-30,2.5);
    else blit(CACT1,o.x,G-24,2.5);
  });

  var spr=dead?DEAD:(!onG?JUMP:((Math.floor(frame/5)%2)?RUN2:RUN1));
  blit(spr,40,G-40+dY,2);

  if(!run&&!dead){
    blink++;
    if(Math.floor(blink/18)%2===0){
      ctx.fillStyle=C;ctx.font="14px Courier New";ctx.textAlign="center";
      ctx.fillText("Press Space to Play",W/2,70);
    }
  }
  if(dead){
    ctx.fillStyle=C;ctx.font="bold 16px Courier New";ctx.textAlign="center";
    ctx.fillText("G A M E  O V E R",W/2,65);
    ctx.strokeRect(W/2-14,85,28,28);
  }
  requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}});
canvas.addEventListener("pointerdown",function(e){e.preventDefault();jump();});
requestAnimationFrame(loop);
})();
</script></body></html>
