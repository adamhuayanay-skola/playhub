<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Chrome Dino</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7f7f7;font-family:Courier New,monospace;user-select:none;touch-action:none;color:#535353}
.hud{width:min(700px,96vw);display:flex;justify-content:flex-end;gap:18px;font:bold 15px Courier New,monospace;margin-bottom:6px;letter-spacing:1px}
canvas{display:block;width:min(700px,96vw);image-rendering:pixelated;image-rendering:crisp-edges;background:#f7f7f7;cursor:pointer;border:1px solid #eee}
.hint{margin-top:10px;font-size:12px;color:#999}
</style></head><body>
<div class="hud"><span>HI <b id="hi">00000</b></span><span id="sc">00000</span></div>
<canvas id="c" width="700" height="200"></canvas>
<p class="hint">SPACE / TAP = jump</p>
<script>
(function(){
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const W=700,H=200,G=172;
const COL="#535353";

// Classic Chrome T-rex shape (side view, facing right)
// Rows from top: head with eye, body, legs, tail behind
function makeDino(legMode){
  // 25 wide x 22 tall-ish
  var rows=[
    ".....................####..",
    "...................#######.",
    "...................##.#.###",
    "...................########",
    "...................#######.",
    "...................######..",
    "...................####....",
    "............##...######....",
    "...........###..########...",
    "..........################.",
    ".........#################.",
    ".........##################",
    ".........#########..######.",
    ".........########....#####.",
    "..........######.....####..",
    "...........####......####..",
    "............##.......##.#..",
    ".....................##....",
    ".....................##...."
  ];
  // leg frames
  if(legMode===1){
    rows[15]="...........####......##....";
    rows[16]="............##......##.....";
    rows[17]="...................##......";
    rows[18]="...................#.......";
  }else if(legMode===2){
    rows[15]="...........####....##......";
    rows[16]="............##.....##......";
    rows[17]=".............#.....#.......";
    rows[18]=".............#.............";
  }else if(legMode===0){ // jump both legs back
    rows[15]="...........####....####....";
    rows[16]="............##......##.....";
    rows[17]=".............#.......#.....";
    rows[18]="...........................";
  }
  return rows;
}

const CACTUS=[
  "..##..",
  "..##..",
  "..##.#",
  "#.##.#",
  "#.####",
  ".###..",
  "..##..",
  "..##..",
  "..##..",
  "..##..",
  "..##.."
];
const CACTUS2=[
  "...##...",
  "...##...",
  "...##.#.",
  ".#.##.#.",
  ".#.####.",
  ".####...",
  "..##.#..",
  "..##.#..",
  "..####..",
  "...##...",
  "...##...",
  "...##...",
  "...##...",
  "...##..."
];

function drawSprite(rows,x,y,s){
  ctx.fillStyle=COL;
  for(var r=0;r<rows.length;r++){
    for(var c=0;c<rows[r].length;c++){
      if(rows[r][c]==="#")ctx.fillRect(x+c*s,y+r*s,s,s);
    }
  }
}
function pad5(n){return ("00000"+Math.floor(Math.max(0,n))).slice(-5);}

var hi=+(localStorage.getItem("dinoHi3")||0);
document.getElementById("hi").textContent=pad5(hi);

var dY=0,dV=0,onG=true;
var obs=[],clouds=[],dots=[];
var score=0,spd=6.5,frame=0,spawn=90;
var run=false,dead=false,blink=0;

function reset(){
  dY=0;dV=0;onG=true;obs=[];
  clouds=[{x:180,y:35},{x:400,y:50},{x:600,y:28}];
  dots=[];for(var i=0;i<30;i++)dots.push({x:i*30,y:G+4+((i%3)*3)});
  score=0;spd=6.5;frame=0;spawn=70;
  run=true;dead=false;blink=0;
  document.getElementById("sc").textContent="00000";
}
function jump(){
  if(dead||!run){reset();return;}
  if(onG){dV=-11;onG=false;}
}

function loop(){
  frame++;
  if(run&&!dead){
    dV+=0.65;dY+=dV;
    if(dY>=0){dY=0;dV=0;onG=true;}
    score+=0.2;spd=6.5+Math.min(7,score/120);
    document.getElementById("sc").textContent=pad5(score);
    spawn--;
    if(spawn<=0){
      var big=Math.random()>0.5;
      obs.push({x:W+20,big:big});
      spawn=50+Math.random()*60-Math.min(20,score/50);
    }
    for(var i=obs.length-1;i>=0;i--){
      obs[i].x-=spd;
      if(obs[i].x<-50)obs.splice(i,1);
    }
    dots.forEach(function(d){d.x-=spd;if(d.x<-10)d.x+=900;});
    clouds.forEach(function(c){c.x-=0.45;if(c.x<-60){c.x=W+40;c.y=25+Math.random()*40;}});

    // hitbox
    var bx=55,by=G-42+dY,bw=40,bh=40;
    for(var i=0;i<obs.length;i++){
      var o=obs[i];
      var ox=o.x+4,oy=G-(o.big?36:26),ow=o.big?20:14,oh=o.big?36:26;
      if(bx+10<ox+ow&&bx+bw-12>ox&&by+8<oy+oh&&by+bh>oy){
        dead=true;run=false;
        if(Math.floor(score)>hi){hi=Math.floor(score);localStorage.setItem("dinoHi3",hi);document.getElementById("hi").textContent=pad5(hi);}
      }
    }
  }

  ctx.fillStyle="#f7f7f7";ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle="#dadada";
  clouds.forEach(function(c){
    ctx.fillRect(c.x,c.y,40,10);ctx.fillRect(c.x+10,c.y-8,28,12);
  });
  // ground
  ctx.strokeStyle=COL;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();
  ctx.fillStyle=COL;
  dots.forEach(function(d){ctx.fillRect(d.x,d.y,4,2);});

  obs.forEach(function(o){
    if(o.big)drawSprite(CACTUS2,o.x,G-28,2.5);
    else drawSprite(CACTUS,o.x,G-22,2.5);
  });

  // T-rex
  var leg=dead?1:(!onG?0:((Math.floor(frame/5)%2)+1));
  var spr=makeDino(leg);
  var dx=50,dy=G-38+dY;
  drawSprite(spr,dx,dy,2);

  if(!run&&!dead){
    blink++;
    if(Math.floor(blink/18)%2===0){
      ctx.fillStyle=COL;ctx.font="14px Courier New";ctx.textAlign="center";
      ctx.fillText("Press Space to Play",W/2,75);
    }
  }
  if(dead){
    ctx.fillStyle=COL;ctx.font="bold 16px Courier New";ctx.textAlign="center";
    ctx.fillText("G A M E  O V E R",W/2,68);
    ctx.strokeRect(W/2-14,88,28,28);
    ctx.beginPath();ctx.arc(W/2,102,7,0.2,Math.PI*1.6);ctx.stroke();
  }
  requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}});
canvas.addEventListener("pointerdown",function(e){e.preventDefault();jump();});
requestAnimationFrame(loop);
})();
</script></body></html>
