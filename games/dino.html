<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Chrome Dino</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#f7f7f7;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;user-select:none;touch-action:none;color:#535353}
.hud{width:min(700px,96vw);display:flex;justify-content:flex-end;gap:16px;font:bold 14px Courier New,monospace;margin-bottom:4px;letter-spacing:1px}
canvas{display:block;width:min(700px,96vw);height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#f7f7f7;cursor:pointer}
.hint{margin-top:10px;font-size:12px;color:#999;font-family:Courier New,monospace}
</style></head><body>
<div class="hud"><span>HI <b id="hi">00000</b></span><span id="sc">00000</span></div>
<canvas id="c" width="700" height="200"></canvas>
<p class="hint">SPACE / TAP = jump</p>
<script>
(function(){
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
const W=700,H=200,G=175;

// Official-style sprites (1 = pixel), scaled x2 when drawing
// T-Rex run frame A
const DINO_RUN1=[
"0000000000111110",
"0000000001111111",
"0000000001101011",
"0000000001111111",
"0000000001111110",
"0000000001111000",
"0000000001111110",
"1000000011111000",
"1100000111111100",
"1110001111111110",
"1111011111111110",
"1111111111111110",
"0111111111111110",
"0011111111111100",
"0001111111111000",
"0000111110011000",
"0000011100011000",
"0000011000011000",
"0000011000010000",
"0000010000010000"
];
const DINO_RUN2=[
"0000000000111110",
"0000000001111111",
"0000000001101011",
"0000000001111111",
"0000000001111110",
"0000000001111000",
"0000000001111110",
"1000000011111000",
"1100000111111100",
"1110001111111110",
"1111011111111110",
"1111111111111110",
"0111111111111110",
"0011111111111100",
"0001111111111000",
"0000110011111000",
"0000011000110000",
"0000011000010000",
"0000010000010000",
"0000010000000000"
];
const DINO_JUMP=[
"0000000000111110",
"0000000001111111",
"0000000001101011",
"0000000001111111",
"0000000001111110",
"0000000001111000",
"0000000001111110",
"1000000011111000",
"1100000111111100",
"1110001111111110",
"1111011111111110",
"1111111111111110",
"0111111111111110",
"0011111111111100",
"0001111111111000",
"0000111111111000",
"0000011100011000",
"0000011000011000",
"0000010000010000",
"0000000000000000"
];
const DINO_DEAD=[
"0000000000111110",
"0000000001111111",
"0000000001010111",
"0000000001111111",
"0000000001111110",
"0000000001111000",
"0000000001111110",
"1000000011111000",
"1100000111111100",
"1110001111111110",
"1111011111111110",
"1111111111111110",
"0111111111111110",
"0011111111111100",
"0001111111111000",
"0000111110011000",
"0000011100011000",
"0000011000011000",
"0000010000010000",
"0000010000010000"
];
const CACTUS_S=[
"001100",
"001100",
"001101",
"101101",
"101111",
"111100",
"001100",
"001100",
"001100",
"001100"
];
const CACTUS_L=[
"00011000",
"00011000",
"00011010",
"10011010",
"10011110",
"11011000",
"01011000",
"00011000",
"00011000",
"00011000",
"00011000",
"00011000",
"00011000"
];
const CLOUD=[
"00111100",
"01111110",
"11111111",
"01111110"
];

function drawMat(mat,x,y,scale,color){
  ctx.fillStyle=color||"#535353";
  for(var r=0;r<mat.length;r++){
    for(var c=0;c<mat[r].length;c++){
      if(mat[r][c]==="1")ctx.fillRect(x+c*scale,y+r*scale,scale,scale);
    }
  }
}
function pad5(n){n=Math.max(0,Math.floor(n));return ("00000"+n).slice(-5);}

var hi=+(localStorage.getItem("dinoHi2")||0);
document.getElementById("hi").textContent=pad5(hi);

var dinoY=0, dinoV=0, onGround=true;
var obstacles=[], clouds=[], ground=[];
var score=0, speed=6, frame=0, spawnIn=90;
var run=false, dead=false;
var blink=0;

function reset(){
  dinoY=0;dinoV=0;onGround=true;
  obstacles=[];clouds=[];
  for(var i=0;i<3;i++)clouds.push({x:200+i*220,y:30+Math.random()*40});
  ground=[];
  for(var i=0;i<40;i++)ground.push({x:i*24,t:Math.random()>0.6?1:0});
  score=0;speed=6;frame=0;spawnIn=80;
  run=true;dead=false;blink=0;
  document.getElementById("sc").textContent="00000";
}

function jump(){
  if(dead){reset();return;}
  if(!run){reset();return;}
  if(onGround){dinoV=-10.5;onGround=false;}
}

function loop(){
  frame++;
  if(run&&!dead){
    // physics
    dinoV+=0.6;
    dinoY+=dinoV;
    if(dinoY>=0){dinoY=0;dinoV=0;onGround=true;}

    score+=0.2;
    speed=6+Math.min(8,score/150);
    document.getElementById("sc").textContent=pad5(score);

    // spawn
    spawnIn--;
    if(spawnIn<=0){
      var big=Math.random()>0.55;
      obstacles.push({x:W+10, big:big, w:big?28:18, h:big?36:26});
      spawnIn=55+Math.random()*70 - Math.min(25,score/40);
    }

    // move obstacles
    for(var i=obstacles.length-1;i>=0;i--){
      obstacles[i].x-=speed;
      if(obstacles[i].x<-40)obstacles.splice(i,1);
    }
    // ground scroll
    for(var i=0;i<ground.length;i++){
      ground[i].x-=speed;
      if(ground[i].x<-24){ground[i].x+=40*24;ground[i].t=Math.random()>0.6?1:0;}
    }
    clouds.forEach(function(c){c.x-=0.4;if(c.x<-50){c.x=W+Math.random()*100;c.y=25+Math.random()*45;}});

    // collision (tight boxes like original)
    var dx=50, dy=G-40+dinoY, dw=36, dh=40;
    for(var i=0;i<obstacles.length;i++){
      var o=obstacles[i];
      var ox=o.x+2, oy=G-o.h, ow=o.w-4, oh=o.h;
      if(dx+8<ox+ow&&dx+dw-10>ox&&dy+10<oy+oh&&dy+dh>oy){
        dead=true;run=false;
        var s=Math.floor(score);
        if(s>hi){hi=s;localStorage.setItem("dinoHi2",hi);document.getElementById("hi").textContent=pad5(hi);}
      }
    }
  }

  // DRAW
  ctx.fillStyle="#f7f7f7";ctx.fillRect(0,0,W,H);

  // clouds
  clouds.forEach(function(c){drawMat(CLOUD,c.x,c.y,3,"#dadada");});

  // ground line
  ctx.strokeStyle="#535353";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();
  // ground texture
  ctx.fillStyle="#535353";
  ground.forEach(function(g){
    if(g.t){ctx.fillRect(g.x,G+3,6,2);ctx.fillRect(g.x+10,G+6,3,2);}
    else{ctx.fillRect(g.x+4,G+5,4,2);}
  });

  // obstacles
  obstacles.forEach(function(o){
    if(o.big)drawMat(CACTUS_L,o.x,G-26,2);
    else drawMat(CACTUS_S,o.x,G-20,2);
  });

  // dino
  var dx=50, dy=G-40+dinoY;
  var spr;
  if(dead)spr=DINO_DEAD;
  else if(!onGround)spr=DINO_JUMP;
  else spr=(Math.floor(frame/6)%2===0)?DINO_RUN1:DINO_RUN2;
  drawMat(spr,dx,dy,2);

  // UI overlay
  if(!run&&!dead){
    // blinking start prompt like chrome
    blink++;
    if(Math.floor(blink/20)%2===0){
      ctx.fillStyle="#535353";
      ctx.font="14px Courier New";
      ctx.textAlign="center";
      ctx.fillText("Press Space to Play",W/2,80);
    }
  }
  if(dead){
    ctx.fillStyle="#535353";
    ctx.font="bold 16px Courier New";
    ctx.textAlign="center";
    ctx.fillText("G A M E  O V E R",W/2,70);
    // restart icon box
    ctx.strokeStyle="#535353";ctx.lineWidth=2;
    ctx.strokeRect(W/2-15,90,30,30);
    ctx.beginPath();ctx.arc(W/2,105,8,0.3,Math.PI*1.7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W/2+6,97);ctx.lineTo(W/2+10,105);ctx.lineTo(W/2+2,105);ctx.fill();
  }

  requestAnimationFrame(loop);
}

document.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}
});
canvas.addEventListener("pointerdown",function(e){e.preventDefault();jump();});

requestAnimationFrame(loop);
})();
</script></body></html>
