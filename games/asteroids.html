<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Asteroids</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;font-family:Courier New,monospace;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.1rem;letter-spacing:.2em;margin-bottom:6px}
.sc{font-weight:700;margin-bottom:8px}
canvas{max-width:96vw;background:#000;border:1px solid #333}
.hint{margin-top:8px;color:#666;font-size:.75rem}
</style></head><body>
<h1>ASTEROIDS</h1>
<div class="sc">SCORE <span id="sc">0</span></div>
<canvas id="c" width="480" height="480"></canvas>
<p class="hint">← → otoc · ↑ plyn · Space strelba</p>
<script>
(function(){
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const W=480,H=480;
let ship,rocks,shots,score=0,run=false,keys={};
function reset(){
  ship={x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0};
  rocks=[];for(var i=0;i<5;i++)rocks.push(makeRock(60+Math.random()*30,Math.random()*W,Math.random()*H));
  shots=[];score=0;run=true;document.getElementById("sc").textContent="0";
}
function makeRock(r,x,y){
  var pts=[];for(var i=0;i<8;i++){var ang=i/8*Math.PI*2;pts.push({a:ang,d:r*(0.7+Math.random()*0.3)});} 
  return {x:x,y:y,r:r,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,pts:pts};
}
function loop(){
  if(run){
    if(keys.left)ship.a-=0.08;if(keys.right)ship.a+=0.08;
    if(keys.up){ship.vx+=Math.cos(ship.a)*0.15;ship.vy+=Math.sin(ship.a)*0.15;}
    ship.vx*=0.99;ship.vy*=0.99;
    ship.x=(ship.x+ship.vx+W)%W;ship.y=(ship.y+ship.vy+H)%H;
    shots.forEach(function(s){s.x+=s.vx;s.y+=s.vy;s.life--;});
    shots=shots.filter(function(s){return s.life>0;});
    rocks.forEach(function(r){r.x=(r.x+r.vx+W)%W;r.y=(r.y+r.vy+H)%H;});
    for(var i=shots.length-1;i>=0;i--){
      for(var j=rocks.length-1;j>=0;j--){
        var s=shots[i],r=rocks[j];
        if(!s)continue;
        var dx=s.x-r.x,dy=s.y-r.y;
        if(dx*dx+dy*dy<r.r*r.r){
          shots.splice(i,1);rocks.splice(j,1);score+=Math.floor(100/r.r*10);document.getElementById("sc").textContent=score;
          if(r.r>20){rocks.push(makeRock(r.r/2,r.x,r.y));rocks.push(makeRock(r.r/2,r.x,r.y));}
          break;
        }
      }
    }
    rocks.forEach(function(r){
      var dx=ship.x-r.x,dy=ship.y-r.y;
      if(dx*dx+dy*dy<(r.r+8)*(r.r+8)){run=false;}
    });
    if(rocks.length===0){for(var i=0;i<5;i++)rocks.push(makeRock(50+Math.random()*30,Math.random()*W,Math.random()*H));}
  }
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  // ship triangle
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(ship.x+Math.cos(ship.a)*14,ship.y+Math.sin(ship.a)*14);
  ctx.lineTo(ship.x+Math.cos(ship.a+2.5)*10,ship.y+Math.sin(ship.a+2.5)*10);
  ctx.lineTo(ship.x+Math.cos(ship.a-2.5)*10,ship.y+Math.sin(ship.a-2.5)*10);
  ctx.closePath();ctx.stroke();
  rocks.forEach(function(r){
    ctx.beginPath();
    r.pts.forEach(function(p,i){
      var px=r.x+Math.cos(p.a)*p.d,py=r.y+Math.sin(p.a)*p.d;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.closePath();ctx.stroke();
  });
  ctx.fillStyle="#fff";shots.forEach(function(s){ctx.fillRect(s.x-1,s.y-1,3,3);});
  if(!run){ctx.fillStyle="#fff";ctx.font="18px Courier New";ctx.textAlign="center";ctx.fillText(score?"GAME OVER - CLICK":"CLICK TO START",W/2,H/2);}
  requestAnimationFrame(loop);
}
function fire(){
  if(!run){reset();return;}
  shots.push({x:ship.x,y:ship.y,vx:Math.cos(ship.a)*7,vy:Math.sin(ship.a)*7,life:40});
}
document.addEventListener("keydown",function(e){
  if(e.code==="ArrowLeft")keys.left=true;if(e.code==="ArrowRight")keys.right=true;
  if(e.code==="ArrowUp")keys.up=true;if(e.code==="Space"){e.preventDefault();fire();}
});
document.addEventListener("keyup",function(e){
  if(e.code==="ArrowLeft")keys.left=false;if(e.code==="ArrowRight")keys.right=false;if(e.code==="ArrowUp")keys.up=false;
});
canvas.addEventListener("pointerdown",fire);
requestAnimationFrame(loop);
})();
</script></body></html>
