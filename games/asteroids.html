<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Asteroids</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;user-select:none;touch-action:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#leave{
  position:fixed;top:10px;left:10px;z-index:100;
  width:48px;height:48px;border:2px solid #fff;border-radius:12px;
  background:#ef4444;color:#fff;font-size:28px;font-weight:900;cursor:pointer;line-height:1;
}
h1{letter-spacing:.15em;margin-bottom:6px;font-size:18px}
#sc{margin-bottom:8px;font-weight:700}
#c{background:#000;border:2px solid #444;max-width:96vw;cursor:pointer}
.hint{margin-top:10px;color:#888;font-size:13px;text-align:center}
</style></head><body>
<button type="button" id="leave" aria-label="Zpet">&times;</button>
<h1>ASTEROIDS</h1>
<div id="sc">SCORE 0</div>
<canvas id="c" width="480" height="480"></canvas>
<p class="hint">Klik / Space = start a strelba<br/>Sipky nebo WASD = rizeni</p>
<script>
(function(){
document.getElementById("leave").onclick=function(){
  try{if(document.referrer)history.back();else location.href="../index.html";}
  catch(e){location.href="../index.html";}
};
var cv=document.getElementById("c");
var ctx=cv.getContext("2d");
var W=480,H=480;
var ship={x:240,y:240,a:-Math.PI/2,vx:0,vy:0};
var rocks=[];
var shots=[];
var score=0;
var run=false;
var keys={L:0,R:0,U:0};

function rock(r,x,y){
  var pts=[],i;
  for(i=0;i<8;i++)pts.push({a:i/8*Math.PI*2,d:r*(0.65+Math.random()*0.35)});
  return {x:x,y:y,r:r,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5,pts:pts};
}
function start(){
  ship={x:240,y:240,a:-Math.PI/2,vx:0,vy:0};
  rocks=[];shots=[];score=0;run=true;
  document.getElementById("sc").textContent="SCORE 0";
  var i,ang,d;
  for(i=0;i<5;i++){
    ang=Math.random()*6.28;d=130+Math.random()*70;
    rocks.push(rock(42+Math.random()*22,240+Math.cos(ang)*d,240+Math.sin(ang)*d));
  }
}
function shoot(){
  if(!run){start();return;}
  shots.push({
    x:ship.x+Math.cos(ship.a)*14,
    y:ship.y+Math.sin(ship.a)*14,
    vx:Math.cos(ship.a)*8+ship.vx,
    vy:Math.sin(ship.a)*8+ship.vy,
    life:40
  });
}
function tick(){
  if(run){
    if(keys.L)ship.a-=0.1;
    if(keys.R)ship.a+=0.1;
    if(keys.U){ship.vx+=Math.cos(ship.a)*0.2;ship.vy+=Math.sin(ship.a)*0.2;}
    ship.vx*=0.99;ship.vy*=0.99;
    ship.x=(ship.x+ship.vx+W)%W;
    ship.y=(ship.y+ship.vy+H)%H;
    var i,j,s,r,dx,dy;
    for(i=shots.length-1;i>=0;i--){
      s=shots[i];s.x+=s.vx;s.y+=s.vy;s.life--;
      if(s.life<=0)shots.splice(i,1);
    }
    for(i=0;i<rocks.length;i++){
      r=rocks[i];r.x=(r.x+r.vx+W)%W;r.y=(r.y+r.vy+H)%H;
    }
    for(i=shots.length-1;i>=0;i--){
      for(j=rocks.length-1;j>=0;j--){
        if(!shots[i])break;
        s=shots[i];r=rocks[j];
        dx=s.x-r.x;dy=s.y-r.y;
        if(dx*dx+dy*dy<r.r*r.r){
          shots.splice(i,1);
          rocks.splice(j,1);
          score+=Math.floor(1000/Math.max(10,r.r));
          document.getElementById("sc").textContent="SCORE "+score;
          if(r.r>24){
            rocks.push(rock(r.r*0.55,r.x,r.y));
            rocks.push(rock(r.r*0.55,r.x,r.y));
          }
          break;
        }
      }
    }
    for(j=0;j<rocks.length;j++){
      r=rocks[j];dx=ship.x-r.x;dy=ship.y-r.y;
      if(dx*dx+dy*dy<(r.r+12)*(r.r+12)){run=false;break;}
    }
    if(rocks.length===0){
      for(i=0;i<5;i++){
        ang=Math.random()*6.28;d=140+Math.random()*60;
        rocks.push(rock(40+Math.random()*25,240+Math.cos(ang)*d,240+Math.sin(ang)*d));
      }
    }
  }

  ctx.fillStyle="#050505";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#333";
  for(i=0;i<50;i++)ctx.fillRect((i*91)%W,(i*57)%H,2,2);

  ctx.strokeStyle="#fff";ctx.lineWidth=2;
  for(i=0;i<rocks.length;i++){
    r=rocks[i];ctx.beginPath();
    for(j=0;j<r.pts.length;j++){
      var px=r.x+Math.cos(r.pts[j].a)*r.pts[j].d;
      var py=r.y+Math.sin(r.pts[j].a)*r.pts[j].d;
      if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(ship.x+Math.cos(ship.a)*16,ship.y+Math.sin(ship.a)*16);
  ctx.lineTo(ship.x+Math.cos(ship.a+2.5)*12,ship.y+Math.sin(ship.a+2.5)*12);
  ctx.lineTo(ship.x+Math.cos(ship.a-2.5)*12,ship.y+Math.sin(ship.a-2.5)*12);
  ctx.closePath();ctx.stroke();

  ctx.fillStyle="#fff";
  for(i=0;i<shots.length;i++)ctx.fillRect(shots[i].x-2,shots[i].y-2,4,4);

  if(!run){
    ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.textAlign="center";
    ctx.fillText(score?"GAME OVER - KLIKNI":"KLIKNI PRO START",W/2,H/2);
    if(score){ctx.font="16px Arial";ctx.fillText("Score "+score,W/2,H/2+28);}
  }
  requestAnimationFrame(tick);
}

document.addEventListener("keydown",function(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=1;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=1;
  if(e.code==="ArrowUp"||e.code==="KeyW")keys.U=1;
  if(e.code==="Space"){e.preventDefault();shoot();}
});
document.addEventListener("keyup",function(e){
  if(e.code==="ArrowLeft"||e.code==="KeyA")keys.L=0;
  if(e.code==="ArrowRight"||e.code==="KeyD")keys.R=0;
  if(e.code==="ArrowUp"||e.code==="KeyW")keys.U=0;
});
cv.addEventListener("pointerdown",function(e){e.preventDefault();shoot();});
requestAnimationFrame(tick);
})();
</script>
</body></html>
