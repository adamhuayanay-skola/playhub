<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Flappy Bird</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#70c5ce;font-family:system-ui,sans-serif;user-select:none;touch-action:none}
h1{color:#fff;text-shadow:2px 2px #e67e22;margin-bottom:8px;font-weight:900}canvas{border-radius:10px;box-shadow:0 12px 32px #0004;max-width:96vw;cursor:pointer}.hint{margin-top:8px;color:#fff;font-size:.8rem}.leave-btn{position:fixed;top:12px;left:12px;z-index:99;width:42px;height:42px;border:none;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:1.35rem;font-weight:800;cursor:pointer;line-height:1}

/* visual polish – no gameplay changes */
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;
}
#leave,.leave-btn,button#leave{
  position:fixed!important;top:12px!important;left:12px!important;z-index:9999!important;
  width:48px!important;height:48px!important;border:none!important;border-radius:14px!important;
  background:linear-gradient(145deg,#f87171,#dc2626)!important;color:#fff!important;
  font-size:28px!important;font-weight:900!important;cursor:pointer!important;
  box-shadow:0 6px 20px rgba(220,38,38,.45)!important;line-height:1!important;
}
#leave:active,.leave-btn:active,button#leave:active{transform:scale(.94)}
canvas{
  border-radius:14px!important;
  box-shadow:0 16px 40px rgba(0,0,0,.35)!important;
}
h1{
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

</style></head><body>
<button type="button" class="leave-btn" id="leaveBtn" title="Zpet">×</button>
<h1>Flappy Bird</h1><canvas id="c" width="400" height="560"></canvas><p class="hint">Space / klik = mavnuti</p>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=400,H=560,G=500;
const gap={easy:165,mid:135,hard:110}[(new URLSearchParams(location.search)).get("diff")||"mid"]||135;
let bird={x:90,y:250,vy:0},pipes=[],score=0,hi=+(localStorage.flappyHi||0),run=false,dead=false,frame=0;
function spawn(x){var t=50+Math.random()*200;pipes.push({x:x,top:t,bot:t+gap,ok:false});}
function reset(){bird={x:90,y:250,vy:0};pipes=[];score=0;run=true;dead=false;frame=0;for(var i=0;i<3;i++)spawn(320+i*210);}
function flap(){if(!run)reset();if(!dead)bird.vy=-7.2;}
function loop(){
  frame++;
  if(run){bird.vy+=0.42;bird.y+=bird.vy;if(bird.y>G-16||bird.y<16){dead=true;run=false;}
    pipes.forEach(function(p){p.x-=2.6;if(!p.ok&&p.x+52<bird.x){p.ok=true;score++;if(score>hi){hi=score;localStorage.flappyHi=hi;}}
      if(bird.x+14>p.x&&bird.x-14<p.x+52&&(bird.y-14<p.top||bird.y+14>p.bot)){dead=true;run=false;}});
    pipes=pipes.filter(function(p){return p.x>-70;});
    if(pipes.length&&pipes[pipes.length-1].x<210)spawn(pipes[pipes.length-1].x+210);
  }
  var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#4ec0ca");sky.addColorStop(1,"#70d5de");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.5)";for(var i=0;i<4;i++){ctx.beginPath();ctx.ellipse(((i*110-frame*0.3)%(W+80))-40,50+i*18,30,13,0,0,6.28);ctx.fill();}
  pipes.forEach(function(p){ctx.fillStyle="#3d9b12";ctx.fillRect(p.x,0,52,p.top);ctx.fillRect(p.x,p.bot,52,G-p.bot);ctx.fillStyle="#58c918";ctx.fillRect(p.x-3,p.top-24,58,24);ctx.fillRect(p.x-3,p.bot,58,24);});
  ctx.fillStyle="#ded895";ctx.fillRect(0,G,W,H-G);ctx.fillStyle="#c5c06a";ctx.fillRect(0,G,W,6);
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-0.5,Math.min(0.8,bird.vy*0.06)));
  ctx.fillStyle="#f7d23a";ctx.beginPath();ctx.ellipse(0,0,16,14,0,0,6.28);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(5,-4,5,0,6.28);ctx.fill();ctx.fillStyle="#222";ctx.beginPath();ctx.arc(6.5,-4,2,0,6.28);ctx.fill();
  ctx.fillStyle="#f39c12";ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(20,2);ctx.lineTo(10,5);ctx.fill();ctx.restore();
  ctx.fillStyle="#fff";ctx.font="bold 40px system-ui";ctx.textAlign="center";ctx.strokeStyle="#000";ctx.lineWidth=4;ctx.strokeText(score,W/2,55);ctx.fillText(score,W/2,55);
  if(!run&&!dead){ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 22px system-ui";ctx.fillText("Klikni pro start",W/2,H/2);}
  if(dead){ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 26px system-ui";ctx.fillText("Game Over",W/2,H/2-12);ctx.font="15px system-ui";ctx.fillText("Score "+score+" · Best "+hi,W/2,H/2+16);}
  requestAnimationFrame(loop);
}
document.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();flap();}});cv.addEventListener("pointerdown",flap);
requestAnimationFrame(loop);
})();</script><script>(function(){var b=document.getElementById("leaveBtn");if(b)b.onclick=function(){if(history.length>1)history.back();else location.href="../index.html";};})();</script>
</body></html>
