<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#70c5ce;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;user-select:none;touch-action:none}
h1{color:#fff;text-shadow:2px 2px 0 #e67e22;margin-bottom:.3rem;font-size:1.3rem}
.sc{color:#fff;font-weight:800;font-size:1.5rem;margin-bottom:.3rem;text-shadow:1px 1px 0 #000}
canvas{border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:96vw}
.hint{color:rgba(255,255,255,.8);font-size:.75rem;margin-top:.4rem}
</style></head><body>
<h1>FLAPPY BIRD</h1>
<div class="sc" id="sc">0</div>
<canvas id="c" width="360" height="480"></canvas>
<p class="hint">Klik / mezernik = mavnuti</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc");
const params=new URLSearchParams(location.search);
const gapMod={easy:160,mid:130,hard:105}[params.get("diff")||"mid"]||130;
const W=360,H=480,G=400;
let bird={x:80,y:200,vy:0,r:14},pipes=[],score=0,running=false,frame=0;
function reset(){bird={x:80,y:200,vy:0,r:14};pipes=[];score=0;frame=0;scEl.textContent=0;for(let i=0;i<3;i++)spawn(220+i*180)}
function spawn(x){const top=50+Math.random()*180;pipes.push({x,top,bot:top+gapMod,w:52})}
function flap(){if(!running){running=true;reset()}bird.vy=-6.2}
function tick(){if(!running){draw();requestAnimationFrame(tick);return}frame++;bird.vy+=0.38;bird.y+=bird.vy;pipes.forEach(p=>p.x-=2.4);if(pipes[0]&&pipes[0].x<-60){pipes.shift();spawn(pipes[pipes.length-1].x+180);score++;scEl.textContent=score}if(bird.y+bird.r>G||bird.y-bird.r<0){running=false}for(const p of pipes){if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+p.w){if(bird.y-bird.r<p.top||bird.y+bird.r>p.bot)running=false}}draw();requestAnimationFrame(tick)}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#4ec0ca");g.addColorStop(1,"#70c5ce");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="rgba(255,255,255,.5)";for(let i=0;i<4;i++){const cx=((i*100-frame*0.3)%(W+80))-40;ctx.beginPath();ctx.ellipse(cx,60+i*20,30,14,0,0,Math.PI*2);ctx.fill()}pipes.forEach(p=>{ctx.fillStyle="#73bf2e";ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.bot,p.w,G-p.bot);ctx.fillStyle="#558c1f";ctx.fillRect(p.x-3,p.top-24,p.w+6,24);ctx.fillRect(p.x-3,p.bot,p.w+6,24);ctx.fillStyle="#8fd94a";ctx.fillRect(p.x+4,4,8,p.top-28);ctx.fillRect(p.x+4,p.bot+28,8,G-p.bot-32)});ctx.fillStyle="#ded895";ctx.fillRect(0,G,W,H-G);ctx.fillStyle="#c4b84a";ctx.fillRect(0,G,W,6);const by=bird.y;ctx.save();ctx.translate(bird.x,by);ctx.rotate(Math.min(0.6,Math.max(-0.5,bird.vy*0.06)));ctx.fillStyle="#f7e26b";ctx.beginPath();ctx.ellipse(0,0,16,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f5d547";ctx.beginPath();ctx.ellipse(-4,2,10,6,-0.3+Math.sin(frame*0.3)*0.4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(6,-3,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(7,-3,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e67e22";ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(22,3);ctx.lineTo(12,6);ctx.closePath();ctx.fill();ctx.restore();if(!running){ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 24px system-ui";ctx.textAlign="center";ctx.fillText(score>0?"Game Over · "+score:"Klikni pro start",W/2,H/2)}}
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap()}});canvas.addEventListener("pointerdown",flap);tick();
</script></body></html>
