<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Pong</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}h1{font-size:1.3rem;font-weight:800;letter-spacing:.3em;margin-bottom:10px}canvas{border-radius:4px;box-shadow:0 0 40px rgba(255,255,255,.08);max-width:96vw;background:#000}.hint{margin-top:10px;color:#555;font-size:.75rem}</style></head><body>
<h1>PONG</h1><canvas id="c" width="700" height="400"></canvas><p class="hint">Mys / touch = palka · prvni na 7</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");const W=700,H=400;
const params=new URLSearchParams(location.search);const aiSpd={easy:3.2,mid:4.5,hard:6.5}[params.get("diff")||"mid"]||4.5;
let p1={y:H/2-40,s:0},p2={y:H/2-40,s:0},ball,run=false;
function serve(){const a=(Math.random()>.5?1:-1);ball={x:W/2,y:H/2,vx:a*(5+Math.random()),vy:(Math.random()*2-1)*4}}
function reset(){p1.s=0;p2.s=0;serve();run=true}
function tick(){if(run){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<8||ball.y>H-8)ball.vy*=-1;const target=ball.y-40;p2.y+=(target-p2.y)*0.08;p2.y=Math.max(0,Math.min(H-80,p2.y));if(ball.x<28&&ball.y>p1.y&&ball.y<p1.y+80){ball.vx=Math.abs(ball.vx)*1.05;ball.vy+=(ball.y-(p1.y+40))*0.12}if(ball.x>W-28&&ball.y>p2.y&&ball.y<p2.y+80){ball.vx=-Math.abs(ball.vx)*1.05;ball.vy+=(ball.y-(p2.y+40))*0.12}if(ball.x<0){p2.s++;serve();if(p2.s>=7)run=false}if(ball.x>W){p1.s++;serve();if(p1.s>=7)run=false}}ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#222";ctx.setLineDash([10,12]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#fff";ctx.fillRect(12,p1.y,10,80);ctx.fillRect(W-22,p2.y,10,80);ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,Math.PI*2);ctx.fill();ctx.font="bold 48px system-ui";ctx.textAlign="center";ctx.fillText(p1.s,W/2-60,50);ctx.fillText(p2.s,W/2+60,50);if(!run){ctx.font="20px system-ui";ctx.fillText(p1.s>=7?"Vyhral jsi!":"Klikni pro start",W/2,H/2)}requestAnimationFrame(tick)}
canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();p1.y=Math.max(0,Math.min(H-80,(e.clientY-r.top)*(H/r.height)-40))});
canvas.addEventListener("pointerdown",()=>{if(!run)reset()});serve();requestAnimationFrame(tick);
</script></body></html>
