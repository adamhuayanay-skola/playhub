<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Pong</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:.25em;margin-bottom:10px;opacity:.9}
canvas{border-radius:6px;box-shadow:0 0 60px rgba(255,255,255,.06);max-width:96vw;background:#000;cursor:none}
.hint{margin-top:10px;color:#555;font-size:.75rem}
</style></head><body>
<h1>PONG</h1>
<canvas id="c" width="720" height="420"></canvas>
<p class="hint">Mys / touch · prvni na 7</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const W=720,H=420;
const params=new URLSearchParams(location.search);
const aiMax={easy:3.5,mid:5.2,hard:7.5}[params.get("diff")||"mid"]||5.2;
let p1={y:H/2-45,s:0},p2={y:H/2-45,s:0};
let ball={x:W/2,y:H/2,vx:5.5,vy:3.2,r:8};
let run=false,trail=[];
function serve(toRight){
  var a=toRight?1:-1;
  ball={x:W/2,y:H/2,vx:a*(5.2+Math.random()),vy:(Math.random()*2-1)*4.5,r:8};
  trail=[];
}
function reset(){p1.s=0;p2.s=0;serve(true);run=true;}
function loop(){
  if(run){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.y<ball.r||ball.y>H-ball.r){ball.vy*=-1;ball.y=Math.max(ball.r,Math.min(H-ball.r,ball.y));}
    // AI smooth follow
    var target=ball.y-45;
    var dy=target-p2.y;
    p2.y+=Math.max(-aiMax,Math.min(aiMax,dy*0.12));
    p2.y=Math.max(0,Math.min(H-90,p2.y));
    // paddles
    if(ball.x-ball.r<p1.x+14&&ball.x>12&&ball.y>p1.y&&ball.y<p1.y+90){
      ball.vx=Math.abs(ball.vx)*1.05;ball.vy+=(ball.y-(p1.y+45))*0.14;ball.x=26+ball.r;
    }
    if(ball.x+ball.r>W-26&&ball.x<W-12&&ball.y>p2.y&&ball.y<p2.y+90){
      ball.vx=-Math.abs(ball.vx)*1.05;ball.vy+=(ball.y-(p2.y+45))*0.14;ball.x=W-26-ball.r;
    }
    ball.vx=Math.max(-14,Math.min(14,ball.vx));
    trail.push({x:ball.x,y:ball.y});if(trail.length>12)trail.shift();
    if(ball.x<0){p2.s++;serve(true);if(p2.s>=7)run=false;}
    if(ball.x>W){p1.s++;serve(false);if(p1.s>=7)run=false;}
  }
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  // center line
  ctx.strokeStyle="rgba(255,255,255,.12)";ctx.setLineDash([8,12]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  // trail
  for(var i=0;i<trail.length;i++){
    var t=trail[i];ctx.beginPath();ctx.arc(t.x,t.y,3+i*0.3,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,"+(0.05+i*0.04)+")";ctx.fill();
  }
  // paddles glow
  ctx.shadowColor="#fff";ctx.shadowBlur=12;
  ctx.fillStyle="#fff";
  roundRect(ctx,12,p1.y,12,90,4);ctx.fill();
  roundRect(ctx,W-24,p2.y,12,90,4);ctx.fill();
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.font="bold 52px system-ui";ctx.textAlign="center";ctx.fillStyle="rgba(255,255,255,.85)";
  ctx.fillText(String(p1.s),W/2-70,56);ctx.fillText(String(p2.s),W/2+70,56);
  if(!run){
    ctx.font="20px system-ui";ctx.fillStyle="#fff";
    ctx.fillText(p1.s>=7?"Vyhral jsi!":"Klikni pro start",W/2,H/2);
  }
  requestAnimationFrame(loop);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
p1.x=12;
canvas.addEventListener("pointermove",function(e){
  var r=canvas.getBoundingClientRect();
  p1.y=Math.max(0,Math.min(H-90,(e.clientY-r.top)*(H/r.height)-45));
});
canvas.addEventListener("pointerdown",function(){if(!run)reset();});
serve(true);requestAnimationFrame(loop);
</script></body></html>
