<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Pong</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;font-family:system-ui,sans-serif;color:#fff;user-select:none;touch-action:none}
h1{letter-spacing:.3em;font-size:1.1rem;margin-bottom:10px}canvas{max-width:96vw;background:#000;border-radius:4px;cursor:none}.hint{margin-top:10px;color:#555;font-size:.75rem}.leave-btn{position:fixed;top:12px;left:12px;z-index:99;width:42px;height:42px;border:none;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:1.35rem;font-weight:800;cursor:pointer;line-height:1}
</style></head><body>
<button type="button" class="leave-btn" id="leaveBtn" title="Zpet">×</button>
<h1>PONG</h1><canvas id="c" width="700" height="400"></canvas><p class="hint">Mys = palka · prvni na 7</p>
<script>
(function(){
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=700,H=400;
const ai={easy:3.5,mid:5,hard:7}[(new URLSearchParams(location.search)).get("diff")||"mid"]||5;
let p1={y:H/2-40,s:0},p2={y:H/2-40,s:0},ball={x:W/2,y:H/2,vx:5,vy:3},run=false,trail=[];
function serve(dir){ball={x:W/2,y:H/2,vx:dir*(5+Math.random()),vy:(Math.random()*2-1)*4};trail=[];}
function reset(){p1.s=0;p2.s=0;serve(1);run=true;}
function loop(){
  if(run){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.y<8||ball.y>H-8)ball.vy*=-1;
    var t=ball.y-40;p2.y+=Math.max(-ai,Math.min(ai,(t-p2.y)*0.12));
    p2.y=Math.max(0,Math.min(H-80,p2.y));
    if(ball.x<28&&ball.y>p1.y&&ball.y<p1.y+80){ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-p1.y-40)*0.12;ball.x=28;}
    if(ball.x>W-28&&ball.y>p2.y&&ball.y<p2.y+80){ball.vx=-Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-p2.y-40)*0.12;ball.x=W-28;}
    trail.push({x:ball.x,y:ball.y});if(trail.length>14)trail.shift();
    if(ball.x<0){p2.s++;serve(1);if(p2.s>=7)run=false;}if(ball.x>W){p1.s++;serve(-1);if(p1.s>=7)run=false;}
  }
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#222";ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  trail.forEach(function(t,i){ctx.fillStyle="rgba(255,255,255,"+(i/trail.length*0.4)+")";ctx.beginPath();ctx.arc(t.x,t.y,3,0,6.28);ctx.fill();});
  ctx.fillStyle="#fff";ctx.shadowColor="#fff";ctx.shadowBlur=10;
  ctx.fillRect(12,p1.y,10,80);ctx.fillRect(W-22,p2.y,10,80);
  ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,6.28);ctx.fill();ctx.shadowBlur=0;
  ctx.font="bold 48px system-ui";ctx.textAlign="center";ctx.fillText(p1.s,W/2-60,50);ctx.fillText(p2.s,W/2+60,50);
  if(!run){ctx.font="20px system-ui";ctx.fillText(p1.s>=7?"Vyhral jsi!":"Klikni pro start",W/2,H/2);}
  requestAnimationFrame(loop);
}
cv.addEventListener("pointermove",function(e){var r=cv.getBoundingClientRect();p1.y=Math.max(0,Math.min(H-80,(e.clientY-r.top)*(H/r.height)-40));});
cv.addEventListener("pointerdown",function(){if(!run)reset();});
serve(1);requestAnimationFrame(loop);
})();</script><script>(function(){var b=document.getElementById("leaveBtn");if(b)b.onclick=function(){if(history.length>1)history.back();else location.href="../index.html";};})();</script>
</body></html>
