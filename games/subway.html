<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Subway Surfers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(#87CEEB,#E0F7FA);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Arial Black,system-ui,sans-serif;user-select:none;touch-action:none;overflow:hidden}
.logo{font-size:1.6rem;font-weight:900;letter-spacing:-1px;margin-bottom:4px;
  background:linear-gradient(180deg,#FFD600,#FF6D00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 #BF360C);text-transform:uppercase}
.hud{display:flex;gap:20px;color:#fff;font-weight:900;font-size:1.05rem;text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:6px}
.hud span{background:rgba(0,0,0,.35);padding:4px 12px;border-radius:20px;border:2px solid rgba(255,255,255,.3)}
canvas{border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.4);max-width:96vw;border:3px solid #fff}
.hint{margin-top:8px;color:#546E7A;font-size:.8rem;font-family:system-ui}
</style></head><body>
<div class="logo">Subway Surfers</div>
<div class="hud"><span>\uD83E\uDE99 <b id="coins">0</b></span><span>SCORE <b id="sc">0</b></span></div>
<canvas id="c" width="420" height="600"></canvas>
<p class="hint">Swipe / \u2190\u2192 lanes \u00b7 \u2191 jump \u00b7 \u2193 roll</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc"),coinEl=document.getElementById("coins");
const params=new URLSearchParams(location.search);
const baseSpd={easy:5,mid:6.5,hard:8.5}[params.get("diff")||"mid"]||6.5;
const W=420,H=600,LANES=[70,210,350];
let targetLane=1,px=LANES[1],py=460,jump=0,vy=0,slide=0;
let obs=[],coins=[],score=0,coinC=0,speed=baseSpd,run=false,frame=0,bgY=0,hi=+(localStorage.getItem("subHi")||0);

function reset(){
  targetLane=1;px=LANES[1];py=460;jump=0;vy=0;slide=0;
  obs=[];coins=[];score=0;coinC=0;speed=baseSpd;frame=0;bgY=0;
  for(let i=0;i<10;i++)spawn(i*150+450);
}
function spawn(z){
  const l=Math.floor(Math.random()*3),r=Math.random();
  if(r<0.55){
    const types=["train","train","barrier","box","pole"];
    obs.push({lane:l,z,type:types[Math.floor(Math.random()*types.length)]});
  } else {
    // coin streak
    for(let i=0;i<3;i++)coins.push({lane:l,z:z+i*35,got:false});
  }
}
function start(){if(!run){run=true;reset()}}
function doJump(){if(jump===0&&slide===0){vy=-14;jump=1}}
function doSlide(){if(jump===0)slide=28}

function tick(){
  if(!run){draw();requestAnimationFrame(tick);return}
  frame++;speed=baseSpd+frame*0.0015;score=Math.floor(frame/2);
  if(score>hi){hi=score;localStorage.setItem("subHi",hi)}
  scEl.textContent=score;coinEl.textContent=coinC;bgY=(bgY+speed)%60;
  px+=(LANES[targetLane]-px)*0.2;
  if(jump){vy+=0.75;py+=vy;if(py>=460){py=460;vy=0;jump=0}}
  if(slide>0)slide--;
  obs.forEach(o=>o.z-=speed);coins.forEach(c=>c.z-=speed);
  obs=obs.filter(o=>o.z>-100);coins=coins.filter(c=>c.z>-100);
  if(obs.length+coins.length<12){
    const zs=[...obs.map(o=>o.z),...coins.map(c=>c.z),400];
    spawn(Math.max(...zs)+130+Math.random()*40);
  }
  for(const o of obs){
    if(o.lane===targetLane&&o.z>355&&o.z<455){
      if(jump&&(o.type==="barrier"||o.type==="box"||o.type==="pole"))continue;
      if(slide&&(o.type==="barrier"||o.type==="pole"))continue;
      run=false;
    }
  }
  coins.forEach(c=>{
    if(!c.got&&c.lane===targetLane&&c.z>370&&c.z<450){
      c.got=true;coinC++;score+=10;scEl.textContent=score;coinEl.textContent=coinC;
    }
  });
  draw();requestAnimationFrame(tick);
}

function draw(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,280);
  sky.addColorStop(0,"#29B6F6");sky.addColorStop(1,"#81D4FA");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,280);
  // sun
  ctx.fillStyle="#FFF59D";ctx.beginPath();ctx.arc(340,50,32,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,245,157,.3)";ctx.beginPath();ctx.arc(340,50,50,0,Math.PI*2);ctx.fill();
  // city skyline
  ctx.fillStyle="#5C6BC0";
  for(let i=0;i<10;i++){
    const x=((i*55-frame*0.25)%(W+60))-30;
    const h=50+((i*41)%90);
    ctx.fillRect(x,280-h,48,h);
    ctx.fillStyle="#FFEB3B";
    for(let wy=0;wy<h-10;wy+=14)for(let wx=6;wx<40;wx+=12)
      if(Math.random()>0.3)ctx.fillRect(x+wx,280-h+8+wy,5,7);
    ctx.fillStyle="#5C6BC0";
  }
  // platform
  const pg=ctx.createLinearGradient(0,280,0,H);
  pg.addColorStop(0,"#90A4AE");pg.addColorStop(1,"#546E7A");
  ctx.fillStyle=pg;ctx.fillRect(0,280,W,H-280);
  // rails + sleepers
  for(let i=0;i<3;i++){
    const lx=LANES[i];
    ctx.fillStyle="#37474F";
    for(let j=0;j<14;j++){
      const y=290+((j*48+bgY*0.9)%320);
      ctx.fillRect(lx-32,y,64,8);
    }
    ctx.strokeStyle="#FFC107";ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(lx-24,285);ctx.lineTo(lx-24,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(lx+24,285);ctx.lineTo(lx+24,H);ctx.stroke();
  }
  // lane lines
  ctx.strokeStyle="rgba(255,255,255,.2)";ctx.lineWidth=2;ctx.setLineDash([20,20]);
  ctx.beginPath();ctx.moveTo(140,285);ctx.lineTo(140,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(280,285);ctx.lineTo(280,H);ctx.stroke();
  ctx.setLineDash([]);

  // draw objects back to front
  const all=[...obs.map(o=>({...o,kind:"obs"})),...coins.filter(c=>!c.got).map(c=>({...c,kind:"coin"}))];
  all.sort((a,b)=>a.z-b.z);
  all.forEach(o=>{
    const scale=0.2+0.8*Math.min(1,(o.z+50)/550);
    if(scale<0.15)return;
    const x=LANES[o.lane],y=60+o.z*0.78;
    if(y>H+50||y<30)return;
    if(o.kind==="coin"){
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(scale,scale);
      ctx.fillStyle="#FFD600";ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#FFECB3";ctx.beginPath();ctx.arc(-3,-3,6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#FF8F00";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle="#FF8F00";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",0,1);
      ctx.restore();
      return;
    }
    const w=60*scale;
    if(o.type==="train"){
      const h=100*scale;
      const g=ctx.createLinearGradient(x-w/2,y-h,x+w/2,y);
      g.addColorStop(0,"#EF5350");g.addColorStop(1,"#C62828");
      ctx.fillStyle=g;ctx.fillRect(x-w/2,y-h,w,h);
      ctx.fillStyle="#FFD600";ctx.fillRect(x-w/2,y-h,w,10*scale);
      ctx.fillStyle="#81D4FA";
      ctx.fillRect(x-w/2+8*scale,y-h+18*scale,w*0.35,22*scale);
      ctx.fillRect(x+4*scale,y-h+18*scale,w*0.35,22*scale);
      ctx.fillStyle="#212121";ctx.fillRect(x-w/2,y-6*scale,w,8*scale);
    } else if(o.type==="barrier"){
      const h=38*scale;
      ctx.fillStyle="#FF9800";ctx.fillRect(x-w/2,y-h,w,h);
      ctx.fillStyle="#E65100";ctx.fillRect(x-w/2,y-h,w,6*scale);
      ctx.fillStyle="#fff";ctx.font="bold "+(14*scale)+"px Arial";ctx.textAlign="center";
      ctx.fillText("!",x,y-h/2+4*scale);
    } else if(o.type==="pole"){
      ctx.fillStyle="#78909C";ctx.fillRect(x-6*scale,y-70*scale,12*scale,70*scale);
      ctx.fillStyle="#FFC107";ctx.beginPath();ctx.arc(x,y-70*scale,10*scale,0,Math.PI*2);ctx.fill();
    } else {
      const h=45*scale;
      ctx.fillStyle="#8D6E63";ctx.fillRect(x-w/2,y-h,w,h);
      ctx.fillStyle="#6D4C41";ctx.fillRect(x-w/2,y-h,w,7*scale);
    }
  });

  // character
  const pH=slide>0?34:56;
  const pY=slide>0?py+20:py;
  // shadow
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(px,478,20,7,0,0,Math.PI*2);ctx.fill();
  // hoodie body
  const body=ctx.createLinearGradient(px-16,pY-pH,px+16,pY);
  body.addColorStop(0,"#FF5722");body.addColorStop(1,"#D84315");
  ctx.fillStyle=body;
  if(slide>0)ctx.fillRect(px-18,pY-20,36,28);
  else ctx.fillRect(px-15,pY-pH+14,30,pH-14);
  // head
  ctx.fillStyle="#FFCC80";ctx.beginPath();ctx.arc(px,pY-pH+8,14,0,Math.PI*2);ctx.fill();
  // hair
  ctx.fillStyle="#3E2723";ctx.beginPath();ctx.arc(px,pY-pH+4,13,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  // eyes
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px-5,pY-pH+8,3.5,0,Math.PI*2);ctx.arc(px+5,pY-pH+8,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#1a1a1a";ctx.beginPath();ctx.arc(px-4,pY-pH+8,1.8,0,Math.PI*2);ctx.arc(px+6,pY-pH+8,1.8,0,Math.PI*2);ctx.fill();
  // smile
  ctx.strokeStyle="#5D4037";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,pY-pH+11,5,0.2,Math.PI-0.2);ctx.stroke();
  // legs
  if(slide===0){
    const leg=Math.floor(frame/3)%2;
    ctx.fillStyle="#1565C0";
    ctx.fillRect(px-13,pY,11,leg?12:18);
    ctx.fillRect(px+2,pY,11,leg?18:12);
    ctx.fillStyle="#212121";
    ctx.fillRect(px-13,pY+(leg?12:18),11,5);
    ctx.fillRect(px+2,pY+(leg?18:12),11,5);
  }

  if(!run){
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#FFD600";ctx.font="bold 28px Arial Black";ctx.textAlign="center";
    ctx.fillText(score>0?"GAME OVER":"TAP TO RUN!",W/2,H/2-20);
    ctx.fillStyle="#fff";ctx.font="16px Arial";
    if(score>0)ctx.fillText("Score "+score+"  Coins "+coinC+"  Best "+hi,W/2,H/2+15);
    else ctx.fillText("Collect coins \u00b7 Dodge trains",W/2,H/2+15);
  }
}

document.addEventListener("keydown",e=>{
  if(e.code==="ArrowLeft"||e.key==="a"){targetLane=Math.max(0,targetLane-1);start()}
  if(e.code==="ArrowRight"||e.key==="d"){targetLane=Math.min(2,targetLane+1);start()}
  if(e.code==="ArrowUp"||e.code==="Space"){e.preventDefault();start();doJump()}
  if(e.code==="ArrowDown"){e.preventDefault();start();doSlide()}
});
let tx=0,ty=0;
canvas.addEventListener("pointerdown",e=>{tx=e.clientX;ty=e.clientY;start()});
canvas.addEventListener("pointerup",e=>{
  const dx=e.clientX-tx,dy=e.clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>30){
    if(dx<0)targetLane=Math.max(0,targetLane-1);else targetLane=Math.min(2,targetLane+1);
  } else if(dy<-30)doJump();else if(dy>30)doSlide();else doJump();
});
tick();
</script></body></html>
