<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><title>Subway Surfers</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#87CEEB;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;user-select:none;touch-action:none;overflow:hidden}h1{font-size:1.3rem;font-weight:900;margin-bottom:.3rem;background:linear-gradient(90deg,#ff6b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hud{display:flex;gap:1.5rem;color:#fff;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.5);margin-bottom:.3rem}canvas{border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.35);max-width:96vw}.hint{color:rgba(0,0,0,.45);font-size:.75rem;margin-top:.4rem}</style></head><body>
<h1>SUBWAY SURFERS</h1><div class="hud"><span>\uD83E\uDE99 <span id="coins">0</span></span><span>Score: <span id="sc">0</span></span></div>
<canvas id="c" width="400" height="560"></canvas><p class="hint">&larr; &rarr; koleje \u00b7 \u2191 skok \u00b7 \u2193 slide</p>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc"),coinEl=document.getElementById("coins");
const params=new URLSearchParams(location.search);
const baseSpd={easy:4.5,mid:6,hard:8}[params.get("diff")||"mid"]||6;
const W=400,H=560,LANES=[80,200,320];
let lane=1,targetLane=1,px=LANES[1],py=420,jump=0,vy=0,slide=0,obs=[],coins=[],score=0,coinC=0,speed=baseSpd,run=false,frame=0,bgY=0;
function reset(){lane=1;targetLane=1;px=LANES[1];py=420;jump=0;vy=0;slide=0;obs=[];coins=[];score=0;coinC=0;speed=baseSpd;frame=0;bgY=0;for(let i=0;i<8;i++)spawn(i*160+500)}
function spawn(z){const l=Math.floor(Math.random()*3),r=Math.random();if(r>0.45)obs.push({lane:l,z,type:r>0.75?"train":r>0.6?"barrier":"box"});else coins.push({lane:l,z,got:false})}
function start(){if(!run){run=true;reset()}}function doJump(){if(jump===0&&slide===0){vy=-13;jump=1}}function doSlide(){if(jump===0)slide=25}
function tick(){if(!run){draw();requestAnimationFrame(tick);return}frame++;speed=baseSpd+frame*0.0012;score=Math.floor(frame/2);scEl.textContent=score;coinEl.textContent=coinC;bgY=(bgY+speed*0.8)%80;px+=(LANES[targetLane]-px)*0.18;lane=targetLane;if(jump){vy+=0.7;py+=vy;if(py>=420){py=420;vy=0;jump=0}}if(slide>0)slide--;obs.forEach(o=>o.z-=speed);coins.forEach(c=>c.z-=speed);obs=obs.filter(o=>o.z>-80);coins=coins.filter(c=>c.z>-80);if(obs.length+coins.length<10){const zs=[...obs.map(o=>o.z),...coins.map(c=>c.z),400];spawn(Math.max(...zs)+140+Math.random()*50)}for(const o of obs){if(o.lane===targetLane&&o.z>340&&o.z<440){if(jump&&(o.type==="barrier"||o.type==="box"))continue;if(slide&&o.type==="barrier")continue;run=false}}coins.forEach(c=>{if(!c.got&&c.lane===targetLane&&c.z>360&&c.z<430){c.got=true;coinC++;score+=50;scEl.textContent=score;coinEl.textContent=coinC}});draw();requestAnimationFrame(tick)}
function draw(){const sky=ctx.createLinearGradient(0,0,0,H*0.45);sky.addColorStop(0,"#4fc3f7");sky.addColorStop(1,"#81d4fa");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.45);ctx.fillStyle="#ffe082";ctx.beginPath();ctx.arc(320,60,28,0,Math.PI*2);ctx.fill();ctx.fillStyle="#5c6bc0";for(let i=0;i<8;i++){const x=((i*70-frame*0.3)%(W+80))-40,h=60+((i*37)%80);ctx.fillRect(x,H*0.45-h,50,h)}const trackG=ctx.createLinearGradient(0,H*0.4,0,H);trackG.addColorStop(0,"#78909c");trackG.addColorStop(1,"#455a64");ctx.fillStyle=trackG;ctx.fillRect(0,H*0.4,W,H*0.6);for(let i=0;i<3;i++){const lx=LANES[i];ctx.strokeStyle="#ffc107";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx-22,H*0.42);ctx.lineTo(lx-22,H);ctx.stroke();ctx.beginPath();ctx.moveTo(lx+22,H*0.42);ctx.lineTo(lx+22,H);ctx.stroke();ctx.fillStyle="#5d4037";for(let j=0;j<12;j++){const y=H*0.42+((j*50+bgY)%(H*0.6));ctx.fillRect(lx-28,y,56,6)}}obs.forEach(o=>{const scale=0.25+0.75*Math.min(1,o.z/500);if(scale<0.2)return;const x=LANES[o.lane],y=80+o.z*0.75;if(y>H+40||y<40)return;const w=55*scale,h=(o.type==="train"?90:o.type==="barrier"?35:40)*scale;if(o.type==="train"){ctx.fillStyle="#e53935";ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle="#ffc107";ctx.fillRect(x-w/2,y-h,w,8*scale);ctx.fillStyle="#81d4fa";ctx.fillRect(x-w/2+6*scale,y-h+14*scale,w*0.35,h*0.25)}else if(o.type==="barrier"){ctx.fillStyle="#ff9800";ctx.fillRect(x-w/2,y-h,w,h)}else{ctx.fillStyle="#8d6e63";ctx.fillRect(x-w/2,y-h,w,h)}});coins.forEach(c=>{if(c.got)return;const scale=0.25+0.75*Math.min(1,c.z/500);const x=LANES[c.lane],y=80+c.z*0.75;if(y>H||y<40)return;ctx.fillStyle="#ffc107";ctx.beginPath();ctx.arc(x,y,12*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffe082";ctx.beginPath();ctx.arc(x-2*scale,y-2*scale,5*scale,0,Math.PI*2);ctx.fill()});const pH=slide>0?36:52,pY=slide>0?py+16:py;ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(px,440,18,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff5722";ctx.fillRect(px-14,pY-pH+12,28,pH-12);ctx.fillStyle="#ffcc80";ctx.beginPath();ctx.arc(px,pY-pH+6,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#3e2723";ctx.beginPath();ctx.arc(px,pY-pH+2,12,Math.PI,0);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px-4,pY-pH+6,3,0,Math.PI*2);ctx.arc(px+4,pY-pH+6,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(px-3.5,pY-pH+6,1.5,0,Math.PI*2);ctx.arc(px+4.5,pY-pH+6,1.5,0,Math.PI*2);ctx.fill();if(slide===0){const leg=Math.floor(frame/4)%2;ctx.fillStyle="#1565c0";ctx.fillRect(px-12,pY,10,leg?14:18);ctx.fillRect(px+2,pY,10,leg?18:14)}else{ctx.fillStyle="#1565c0";ctx.fillRect(px-16,pY,32,12)}if(!run){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 24px system-ui";ctx.textAlign="center";ctx.fillText(score>0?"Game Over":"TAP TO RUN",W/2,H/2-10);if(score>0){ctx.font="16px system-ui";ctx.fillStyle="#ffc107";ctx.fillText("Score "+score+" \u00b7 Coins "+coinC,W/2,H/2+20)}}}
document.addEventListener("keydown",e=>{if(e.code==="ArrowLeft"||e.key==="a"){targetLane=Math.max(0,targetLane-1);start()}if(e.code==="ArrowRight"||e.key==="d"){targetLane=Math.min(2,targetLane+1);start()}if(e.code==="ArrowUp"||e.code==="Space"){e.preventDefault();start();doJump()}if(e.code==="ArrowDown"){e.preventDefault();start();doSlide()}});
let tx=0,ty=0;canvas.addEventListener("pointerdown",e=>{tx=e.clientX;ty=e.clientY;start()});canvas.addEventListener("pointerup",e=>{const dx=e.clientX-tx,dy=e.clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25){if(dx<0)targetLane=Math.max(0,targetLane-1);else targetLane=Math.min(2,targetLane+1)}else if(dy<-25)doJump();else if(dy>25)doSlide();else doJump()});tick();
</script></body></html>
