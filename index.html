<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub – Hraj zdarma online</title>
  <meta name="description" content="Hraj zdarma browser hry." />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">Play<span>Hub</span></span>
      </a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Hledat hry..." autocomplete="off" />
      </div>
      <span class="version-badge">v1.4</span>
    </div>
  </header>
  <section class="hero">
    <div class="hero-content">
      <h1>Hraj <span class="gradient-text">zdarma</span> a hned</h1>
      <p>Nejlepsi browser hry na jednom miste.</p>
      <div class="hero-stats">
        <div class="stat"><span class="stat-num" id="gameCount">40+</span><span class="stat-label">Her</span></div>
        <div class="stat"><span class="stat-num">100%</span><span class="stat-label">Zdarma</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">Instalaci</span></div>
      </div>
    </div>
  </section>
  <section class="categories">
    <div class="container">
      <h2 class="section-title">Kategorie</h2>
      <div class="category-pills" id="categoryPills">
        <button type="button" class="pill active" data-cat="all">Vse</button>
        <button type="button" class="pill" data-cat="arcade">Arcade</button>
        <button type="button" class="pill" data-cat="puzzle">Puzzle</button>
        <button type="button" class="pill" data-cat="action">Akce</button>
        <button type="button" class="pill" data-cat="racing">Zavody</button>
        <button type="button" class="pill" data-cat="sports">Sport</button>
        <button type="button" class="pill" data-cat="strategy">Strategie</button>
        <button type="button" class="pill" data-cat="io">.io hry</button>
      </div>
    </div>
  </section>
  <section class="games-section">
    <div class="container">
      <h2 class="section-title">Populerne prave ted</h2>
      <div class="games-grid" id="featuredGrid"></div>
    </div>
  </section>
  <section class="games-section">
    <div class="container">
      <h2 class="section-title">Vsechny hry</h2>
      <div class="games-grid" id="gamesGrid"></div>
      <p class="no-results" id="noResults" hidden>Zadne hry nenalezeny</p>
    </div>
  </section>
  <footer class="footer">
    <div class="container">
      <div class="footer-top">
        <div class="logo"><span class="logo-icon">🎮</span><span class="logo-text">Play<span>Hub</span></span></div>
        <p>Hry bezi primo v prohlizeci</p>
      </div>
    </div>
  </footer>
  <div class="player" id="gameModal" hidden>
    <div class="player-bar">
      <button type="button" class="player-back" id="modalClose" aria-label="Zpet">← Zpet</button>
      <h3 class="player-title" id="modalTitle">Hra</h3>
      <div class="modal-diff" id="modalDiff">
        <button type="button" class="diff-btn" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn active" data-diff="mid">Mid</button>
        <button type="button" class="diff-btn" data-diff="hard">Hard</button>
      </div>
    </div>
    <div class="player-stage">
      <div id="playArea" class="play-area"></div>
      <iframe id="gameFrame" src="" allowfullscreen title="Game"></iframe>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
