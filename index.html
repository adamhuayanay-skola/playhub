<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayHub – Hraj zdarma online</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">Play<span>Hub</span></span>
      </a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Hledat hry..." autocomplete="off" />
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="hero-content">
      <h1>Hraj <span class="gradient-text">zdarma</span> a hned</h1>
      <p>Nejlepší browser hry na jednom místě.</p>
      <div class="hero-stats">
        <div class="stat"><span class="stat-num" id="gameCount">40+</span><span class="stat-label">Her</span></div>
        <div class="stat"><span class="stat-num">100%</span><span class="stat-label">Zdarma</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">Instalací</span></div>
      </div>
    </div>
  </section>
  <section class="categories" id="categories">
    <div class="container">
      <h2 class="section-title">Kategorie</h2>
      <div class="category-pills" id="categoryPills">
        <button class="pill active" data-cat="all">Vše</button>
        <button class="pill" data-cat="arcade">Arcade</button>
        <button class="pill" data-cat="puzzle">Puzzle</button>
        <button class="pill" data-cat="action">Akce</button>
        <button class="pill" data-cat="racing">Závody</button>
        <button class="pill" data-cat="sports">Sport</button>
        <button class="pill" data-cat="strategy">Strategie</button>
        <button class="pill" data-cat="io">.io hry</button>
      </div>
    </div>
  </section>
  <section class="games-section" id="featured">
    <div class="container">
      <h2 class="section-title">🔥 Populární právě teď</h2>
      <div class="games-grid" id="featuredGrid"></div>
    </div>
  </section>
  <section class="games-section" id="all">
    <div class="container">
      <h2 class="section-title">Všechny hry</h2>
      <div class="games-grid" id="gamesGrid"></div>
      <p class="no-results" id="noResults" hidden>Žádné hry nenalezeny</p>
    </div>
  </section>
  <footer class="footer">
    <div class="container">
      <div class="footer-top">
        <div class="logo"><span class="logo-icon">🎮</span><span class="logo-text">Play<span>Hub</span></span></div>
        <p>Hry běží přímo v prohlížeči</p>
      </div>
    </div>
  </footer>
  <div class="modal" id="gameModal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Hra</h3>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body"><iframe id="gameFrame" src="" allowfullscreen></iframe></div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
