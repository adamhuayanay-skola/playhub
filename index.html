<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Retro Hry – klasicke hry moderně</title>
  <meta name="description" content="Retro Hry – Snake, Tetris, Pong a dalsi klasiky." />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">R</span>
        <span class="logo-text">Retro <span>Hry</span></span>
      </a>
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="searchInput" placeholder="Hledat hry..." autocomplete="off" />
      </div>
      <span class="version-badge">v6.0</span>
    </div>
  </header>

  <div class="hero">
    <div class="hero-card">
      <h1>Hraj <span>retro klasiky</span></h1>
      <p>Snake, Tetris, Pong a dalsi – moderni vzhled, plynule ovladani. Spust primo v prohlizeci.</p>
      <div class="hero-stats">
        <span class="hero-stat">14 her</span>
        <span class="hero-stat">Bez instalace</span>
        <span class="hero-stat">Skolni projekt</span>
      </div>
    </div>
  </div>

  <main>
    <div class="cat-bar">
      <div class="container">
        <div class="category-pills" id="categoryPills">
          <button type="button" class="pill active" data-cat="all">Vse</button>
          <button type="button" class="pill" data-cat="arcade">Arcade</button>
          <button type="button" class="pill" data-cat="puzzle">Puzzle</button>
          <button type="button" class="pill" data-cat="strategy">Strategie</button>
        </div>
      </div>
    </div>
    <section class="section">
      <div class="container">
        <div class="section-head"><h2 class="section-title">Popuarni</h2></div>
        <div class="games-grid" id="featuredGrid"></div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title">Vsechny hry</h2>
          <span class="game-count" id="gameCount">0</span>
        </div>
        <div class="games-grid" id="gamesGrid"></div>
        <p class="no-results" id="noResults" hidden>Nic nenalezeno</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><span class="logo-mark small">R</span> Retro Hry</div>
      <p>Skolni projekt · klasicke hry s modernim vzhledem</p>
      <p style="margin-top:8px"><a href="https://github.com/adamhuayanay-skola/playhub" style="color:#6366f1">GitHub</a></p>
    </div>
  </footer>

  <div class="player" id="gamePlayer" hidden>
    <div class="player-bar">
      <button type="button" class="player-back" id="playerBack">Zpet</button>
      <h3 class="player-title" id="playerTitle">Hra</h3>
      <div class="player-diff" id="playerDiff">
        <button type="button" class="diff-btn" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn active" data-diff="mid">Mid</button>
        <button type="button" class="diff-btn" data-diff="hard">Hard</button>
      </div>
    </div>
    <div class="player-stage">
      <div id="playArea" class="play-area"></div>
      <iframe id="gameFrame" src="" allowfullscreen title="Hra"></iframe>
    </div>
  </div>
  <script src="js/main.js?v=6"></script>
</body>
</html>
