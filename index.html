<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Retro Hry</title>
<meta name="version" content="v15-all-games"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
header{background:#4f46e5;color:#fff;padding:14px 20px;font-size:1.3rem;font-weight:800;box-shadow:0 4px 20px rgba(79,70,229,.35)}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#eef2ff,#ecfeff);border-radius:16px;padding:20px;margin:12px 0 16px;border:1px solid #e2e8f0}
.hero h1{font-size:1.4rem;margin-bottom:4px}
.hero p{color:#64748b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
a.card{display:block;background:#fff;border-radius:16px;overflow:hidden;text-decoration:none;color:#0f172a;border:1px solid #e2e8f0;box-shadow:0 4px 14px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,23,42,.12);border-color:#a5b4fc}
.thumb{height:118px;background:linear-gradient(160deg,#1e293b,#0f172a);overflow:hidden}
.thumb canvas{width:100%;height:100%;display:block;image-rendering:auto}
.info{padding:10px 12px 12px}
.info strong{display:block;font-size:.95rem}
.info small{color:#64748b;font-size:.75rem}
</style>
</head>
<body>
<header>Retro Hry</header>
<div class="wrap">
  <div class="hero">
    <h1>Vyber hru</h1>
    <p>14 her · nahlady gameplaye · klikni na kartu</p>
  </div>
  <div class="grid">
    <a class="card" href="games/snake.html" data-g="snake"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Snake</strong><small>Arcade</small></div></a>
    <a class="card" href="games/tetris.html" data-g="tetris"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Tetris</strong><small>Puzzle</small></div></a>
    <a class="card" href="games/pong.html" data-g="pong"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Pong</strong><small>Arcade</small></div></a>
    <a class="card" href="games/breakout.html" data-g="breakout"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Breakout</strong><small>Arcade</small></div></a>
    <a class="card" href="games/2048.html" data-g="g2048"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>2048</strong><small>Puzzle</small></div></a>
    <a class="card" href="games/minesweeper.html" data-g="mines"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Minesweeper</strong><small>Puzzle</small></div></a>
    <a class="card" href="games/flappy.html" data-g="flappy"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Flappy Bird</strong><small>Arcade</small></div></a>
    <a class="card" href="games/memory.html" data-g="memory"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Memory Match</strong><small>Puzzle</small></div></a>
    <a class="card" href="games/tictactoe.html" data-g="ttt"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Tic Tac Toe</strong><small>1v1 / Bot</small></div></a>
    <a class="card" href="games/stack.html" data-g="stack"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Stack</strong><small>Arcade</small></div></a>
    <a class="card" href="games/connect4.html" data-g="connect4"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Connect 4</strong><small>1v1 / Bot</small></div></a>
    <a class="card" href="games/simon.html" data-g="simon"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Simon</strong><small>Arcade</small></div></a>
    <a class="card" href="games/frogger.html" data-g="frogger"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Frogger</strong><small>Arcade</small></div></a>
    <a class="card" href="games/race.html" data-g="race"><div class="thumb"><canvas width="320" height="200"></canvas></div><div class="info"><strong>Retro Race</strong><small>Arcade</small></div></a>
  </div>
</div>
<script>
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r||8,w/2,h/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);
  };
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function draw(id,cv){
var ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
ctx.clearRect(0,0,W,H);
ctx.imageSmoothingEnabled=true;

if(id==="snake"){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0f172a");g.addColorStop(1,"#020617");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // soft path
  ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#22c55e";ctx.lineWidth=18;
  ctx.beginPath();ctx.moveTo(40,H*0.55);ctx.bezierCurveTo(90,H*0.55,100,H*0.35,150,H*0.35);ctx.bezierCurveTo(200,H*0.35,210,H*0.6,260,H*0.55);ctx.stroke();
  ctx.fillStyle="#4ade80";ctx.beginPath();ctx.arc(260,H*0.55,12,0,6.28);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(264,H*0.52,3,0,6.28);ctx.fill();
  ctx.fillStyle="#f43f5e";ctx.beginPath();ctx.arc(W-48,H*0.45,14,0,6.28);ctx.fill();
  ctx.fillStyle="rgba(244,63,94,.35)";ctx.beginPath();ctx.arc(W-48,H*0.45,20,0,6.28);ctx.fill();
}
else if(id==="tetris"){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#12121c");bg.addColorStop(1,"#07070d");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var pieces=[
    {c:"#67e8f9",x:90,y:30,w:36,h:36},{c:"#67e8f9",x:126,y:30,w:36,h:36},{c:"#67e8f9",x:126,y:66,w:36,h:36},{c:"#67e8f9",x:162,y:66,w:36,h:36},
    {c:"#fde047",x:50,y:110,w:36,h:36},{c:"#fde047",x:86,y:110,w:36,h:36},{c:"#fde047",x:50,y:146,w:36,h:36},{c:"#fde047",x:86,y:146,w:36,h:36},
    {c:"#d8b4fe",x:180,y:110,w:36,h:36},{c:"#d8b4fe",x:216,y:110,w:108,h:36},
    {c:"#4ade80",x:70,y:160,w:108,h:28},{c:"#fb7185",x:200,y:160,w:70,h:28}
  ];
  for(var i=0;i<pieces.length;i++){
    var p=pieces[i];
    rr(ctx,p.x,p.y,p.w,p.h,7);ctx.fillStyle=p.c;ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.3)";rr(ctx,p.x+3,p.y+3,p.w-6,8,4);ctx.fill();
  }
}
else if(id==="pong"){
  ctx.fillStyle="#050505";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.15)";ctx.setLineDash([8,12]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#fff";ctx.shadowColor="#fff";ctx.shadowBlur=12;
  rr(ctx,18,H*0.32,12,78,6);ctx.fill();rr(ctx,W-30,H*0.42,12,78,6);ctx.fill();
  ctx.beginPath();ctx.arc(W*0.58,H*0.4,9,0,6.28);ctx.fill();ctx.shadowBlur=0;
  ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("3",W/2-36,38);ctx.fillText("2",W/2+36,38);
}
else if(id==="breakout"){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#111827");bg.addColorStop(1,"#0f172a");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var rows=["#f87171","#fb923c","#facc15","#4ade80","#60a5fa"];
  for(var r=0;r<5;r++)for(var c=0;c<7;c++){
    rr(ctx,16+c*42,14+r*18,38,14,4);ctx.fillStyle=rows[r];ctx.fill();
  }
  rr(ctx,W/2-50,H-30,100,12,6);ctx.fillStyle="#e2e8f0";ctx.fill();
  ctx.fillStyle="#fbbf24";ctx.shadowColor="#fbbf24";ctx.shadowBlur=10;ctx.beginPath();ctx.arc(W/2+30,H-55,8,0,6.28);ctx.fill();ctx.shadowBlur=0;
}
else if(id==="g2048"){
  ctx.fillStyle="#cdc1b4";ctx.fillRect(0,0,W,H);
  var vals=[[2,4,8,16],[32,64,2,4],[8,16,32,128],[4,2,8,256]];
  var col={2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61"};
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){
    var v=vals[r][c],x=16+c*74,y=14+r*46;
    rr(ctx,x,y,66,40,8);ctx.fillStyle=col[v]||"#f9f6f2";ctx.fill();
    ctx.fillStyle=v<=4?"#776e65":"#faf8ef";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(String(v),x+33,y+27);
  }
}
else if(id==="mines"){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#1e293b");bg.addColorStop(1,"#0f172a");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var data=[[1,0,2,"m",1],[0,1,2,2,1],[0,0,1,"m",1],[1,1,1,1,1]];
  for(var r=0;r<4;r++)for(var c=0;c<5;c++){
    var x=18+c*58,y=16+r*44,v=data[r][c];
    rr(ctx,x,y,52,38,8);
    if(v==="m"){ctx.fillStyle="#334155";ctx.fill();ctx.fillStyle="#f87171";ctx.font="20px system-ui";ctx.textAlign="center";ctx.fillText("●",x+26,y+26);}
    else if(v===0){ctx.fillStyle="#0b1220";ctx.fill();}
    else{ctx.fillStyle="#0b1220";ctx.fill();ctx.fillStyle=["","#60a5fa","#4ade80","#f87171"][v];ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(String(v),x+26,y+26);}
  }
}
else if(id==="flappy"){
  var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#5ec6d1");sky.addColorStop(1,"#7dd3de");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.ellipse(70,42,40,16,0,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(210,58,32,13,0,0,6.28);ctx.fill();
  // pipes rounded
  ctx.fillStyle="#3d9b12";rr(ctx,210,0,50,72,6);ctx.fill();rr(ctx,210,138,50,H-174,6);ctx.fill();
  ctx.fillStyle="#58c918";rr(ctx,204,64,62,18,5);ctx.fill();rr(ctx,204,130,62,18,5);ctx.fill();
  ctx.fillStyle="#e5d98a";ctx.fillRect(0,H-32,W,32);ctx.fillStyle="#cfc76a";ctx.fillRect(0,H-32,W,4);
  // bird
  ctx.fillStyle="#f7d23a";ctx.beginPath();ctx.ellipse(95,105,18,15,-0.2,0,6.28);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(102,100,5,0,6.28);ctx.fill();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(103,100,2.4,0,6.28);ctx.fill();
  ctx.fillStyle="#f39c12";ctx.beginPath();ctx.moveTo(110,104);ctx.lineTo(124,106);ctx.lineTo(110,110);ctx.fill();
  ctx.fillStyle="#fff";ctx.strokeStyle="rgba(0,0,0,.4)";ctx.lineWidth=3;ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.strokeText("7",W/2,34);ctx.fillText("7",W/2,34);
}
else if(id==="memory"){
  var bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#1e1b4b");bg.addColorStop(1,"#312e81");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var em=["🍎","⭐","🔥","💎","🚀","🎵"],face=[1,0,1,0,0,1,0,1];
  for(var i=0;i<8;i++){
    var x=18+(i%4)*74,y=22+Math.floor(i/4)*85;
    rr(ctx,x,y,66,72,12);
    if(face[i]){ctx.fillStyle="#1e293b";ctx.fill();ctx.font="30px system-ui";ctx.textAlign="center";ctx.fillText(em[i%6],x+33,y+46);}
    else{var gg=ctx.createLinearGradient(x,y,x+66,y+72);gg.addColorStop(0,"#818cf8");gg.addColorStop(1,"#a78bfa");ctx.fillStyle=gg;ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("?",x+33,y+46);}
  }
}
else if(id==="ttt"){
  ctx.fillStyle="#0f172a";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#64748b";ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(W/3,18);ctx.lineTo(W/3,H-18);ctx.moveTo(2*W/3,18);ctx.lineTo(2*W/3,H-18);
  ctx.moveTo(18,H/3);ctx.lineTo(W-18,H/3);ctx.moveTo(18,2*H/3);ctx.lineTo(W-18,2*H/3);ctx.stroke();
  ctx.font="bold 44px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#38bdf8";ctx.fillText("X",W/6,H/6);ctx.fillText("X",W/2,H/2);
  ctx.fillStyle="#f472b6";ctx.fillText("O",5*W/6,H/6);ctx.fillText("O",W/6,5*H/6);
}
else if(id==="stack"){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#3730a3");bg.addColorStop(1,"#0f172a");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var widths=[170,155,140,125,110],base=H-20;
  for(var i=0;i<5;i++){
    var w=widths[i],x=(W-w)/2;
    rr(ctx,x,base-i*30,w,26,8);ctx.fillStyle="hsl("+((i*52+30)%360)+",85%,60%)";ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.28)";rr(ctx,x+6,base-i*30+4,w-12,7,4);ctx.fill();
  }
  // moving block
  rr(ctx,30,base-5*30-6,100,26,8);ctx.fillStyle="hsl(280,85%,62%)";ctx.fill();
  ctx.fillStyle="#c4b5fd";ctx.font="bold 24px system-ui";ctx.textAlign="center";ctx.fillText("5",W/2,28);
}
else if(id==="connect4"){
  ctx.fillStyle="#1d4ed8";rr(ctx,8,8,W-16,H-16,18);ctx.fill();
  var board=[[0,0,0,1,0,0,0],[0,0,2,1,0,0,0],[0,2,1,2,0,0,0],[1,2,1,2,1,0,0],[1,2,1,2,1,2,0],[1,2,1,2,1,2,1]];
  for(var r=0;r<6;r++)for(var c=0;c<7;c++){
    var cx=28+c*42,cy=24+r*28;
    ctx.beginPath();ctx.arc(cx,cy,12.5,0,6.28);
    if(board[r][c]===1){var g=ctx.createRadialGradient(cx-3,cy-3,1,cx,cy,12.5);g.addColorStop(0,"#fecaca");g.addColorStop(1,"#dc2626");ctx.fillStyle=g;}
    else if(board[r][c]===2){var g2=ctx.createRadialGradient(cx-3,cy-3,1,cx,cy,12.5);g2.addColorStop(0,"#fef08a");g2.addColorStop(1,"#ca8a04");ctx.fillStyle=g2;}
    else ctx.fillStyle="#0f172a";
    ctx.fill();
  }
}
else if(id==="simon"){
  ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,W,H);
  var cols=[["#22c55e",30,18],["#ef4444",170,18],["#eab308",30,108],["#3b82f6",170,108]];
  for(var i=0;i<4;i++){
    rr(ctx,cols[i][1],cols[i][2],120,82,18);ctx.fillStyle=cols[i][0];ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.2)";rr(ctx,cols[i][1]+10,cols[i][2]+8,100,20,10);ctx.fill();
  }
}
else if(id==="frogger"){
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#0ea5e9");bg.addColorStop(0.15,"#14532d");bg.addColorStop(1,"#14532d");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1e293b";ctx.fillRect(0,48,W,100);
  // cars rounded
  rr(ctx,24,58,58,24,8);ctx.fillStyle="#ef4444";ctx.fill();
  rr(ctx,150,88,64,24,8);ctx.fillStyle="#3b82f6";ctx.fill();
  rr(ctx,80,118,54,24,8);ctx.fillStyle="#eab308";ctx.fill();
  ctx.fillStyle="#22c55e";ctx.fillRect(0,H-36,W,36);
  ctx.fillStyle="#4ade80";ctx.beginPath();ctx.arc(W/2,H-18,15,0,6.28);ctx.fill();
  ctx.fillStyle="#166534";ctx.beginPath();ctx.arc(W/2-5,H-22,3,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(W/2+5,H-22,3,0,6.28);ctx.fill();
}
else if(id==="race"){
  ctx.fillStyle="#18181b";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#fbbf24";ctx.lineWidth=4;ctx.setLineDash([16,14]);
  ctx.beginPath();ctx.moveTo(W/3,0);ctx.lineTo(W/3,H);ctx.moveTo(2*W/3,0);ctx.lineTo(2*W/3,H);ctx.stroke();ctx.setLineDash([]);
  function car(ln,y,col){
    var x=ln*(W/3)+W/6-17;
    rr(ctx,x,y,34,50,8);ctx.fillStyle=col;ctx.fill();
    rr(ctx,x+5,y+10,24,14,4);ctx.fillStyle="#7dd3fc";ctx.fill();
  }
  car(0,28,"#ef4444");car(2,70,"#a855f7");car(1,H-72,"#22c55e");
}
else{ctx.fillStyle="#6366f1";ctx.fillRect(0,0,W,H);}
}
var cards=document.querySelectorAll("a.card");
for(var i=0;i<cards.length;i++){
  var cv=cards[i].querySelector("canvas");
  if(cv)try{draw(cards[i].getAttribute("data-g"),cv);}catch(e){}
}
</script>
</body>
</html>
